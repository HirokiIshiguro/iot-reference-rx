# Fleet embeds claim credentials. Reuse the matching public boot inputs, sign
# the exact authenticated Fleet MOT privately, and publish only an encrypted set.
package_normal_boot_rx671_fleet:
  extends: .rx_windows_canonical_checkout
  stage: build
  tags:
    - exec-shell
    - os-windows
    - ccrx
    - $RX671_WIFI_BUILD_RUNNER_TAG
  resource_group: $WINDOWS_CCRX_BUILD_RESOURCE_GROUP
  variables:
    GIT_SUBMODULE_STRATEGY: none
  needs:
    - job: package_normal_boot_rx671
      artifacts: true
    - job: build_rx671_wifi_fleet
      artifacts: true
  rules: !reference [.rx671_wifi_fleet_rules, rules]
  script:
    - |
      $ErrorActionPreference = 'Stop'
      foreach ($id in @($env:CI_PIPELINE_ID, $env:CI_JOB_ID)) {
        if ($id -notmatch '^[1-9][0-9]*$') { throw 'Invalid Fleet package identity.' }
      }
      python -m pip install --user cryptography
      if ($LASTEXITCODE -ne 0) { throw 'Fleet cryptography dependency installation failed.' }
      $source = $env:CI_PROJECT_DIR
      python -c "import os, sys; from pathlib import Path; from tools.idt.prepare_public_signer import _source_state; sys.exit(0 if _source_state(Path(os.environ['CI_PROJECT_DIR'])) == os.environ['CI_COMMIT_SHA'] else 'Fleet source SHA mismatch')"
      if ($LASTEXITCODE -ne 0) { throw 'Fleet package source must be clean and matching.' }
      $privateRoot = "C:/ai/codex/tmp/rx671-fleet-package-$env:CI_PIPELINE_ID-$env:CI_JOB_ID"
      if (Test-Path -LiteralPath $privateRoot) { throw 'Fleet private output already exists.' }
      New-Item -ItemType Directory -Path $privateRoot | Out-Null
      try {
        $claimKey = ''
        foreach ($name in @('RX671_EK_FLEET_CLAIM_PRIVATE_KEY_PEM_FILE', 'RX671_EK_FLEET_CLAIM_PRIVATE_KEY_PEM', 'AWS_FLEET_CLAIM_PRIVATE_KEY_RX72N_02', 'AWS_FLEET_CLAIM_PRIVATE_KEY')) {
          $value = [Environment]::GetEnvironmentVariable($name)
          if (-not [string]::IsNullOrWhiteSpace($value)) { $claimKey = $value; break }
        }
        if ([string]::IsNullOrWhiteSpace($claimKey)) { throw 'Fleet artifact key is not configured.' }
        $env:RX671_FLEET_ARTIFACT_SECRET = $claimKey
        $claimKey = ''; $value = ''
        $inputRoot = Join-Path $source 'artifacts/build_rx671_wifi_fleet'
        $metadata = Get-Content -LiteralPath (Join-Path $inputRoot 'manifest.json') -Raw | ConvertFrom-Json
        $context = "rx671-fleet-v1:${env:CI_PIPELINE_ID}:${env:CI_COMMIT_SHA}"
        if ($metadata.format -cne 'rx671-fleet-encrypted-artifact-v1' -or
            [string]$metadata.pipeline_id -cne $env:CI_PIPELINE_ID -or
            $metadata.commit_sha -cne $env:CI_COMMIT_SHA -or $metadata.encryption_context -cne $context) {
          throw 'Fleet build manifest identity mismatch.'
        }
        $encrypted = Join-Path $inputRoot 'aws_wifi_rx671_ek_fleet.mot.enc'
        if ((Get-FileHash -LiteralPath $encrypted -Algorithm SHA256).Hash.ToLowerInvariant() -cne $metadata.encrypted_mot_sha256) {
          throw 'Fleet ciphertext hash mismatch.'
        }
        $mot = Join-Path $privateRoot 'fleet.mot'
        python tools/ci/protect_secret_artifact.py decrypt --input "$encrypted" --output "$mot" --secret-env RX671_FLEET_ARTIFACT_SECRET --context "$context"
        if ($LASTEXITCODE -ne 0) { throw 'Fleet artifact authentication failed.' }
        if ((Get-FileHash -LiteralPath $mot -Algorithm SHA256).Hash.ToLowerInvariant() -cne $metadata.plaintext_mot_sha256) {
          throw 'Fleet plaintext hash mismatch.'
        }
        $targets = (Get-Content -LiteralPath (Join-Path $source 'tools/idt/targets.json') -Raw | ConvertFrom-Json).targets
        $key = Join-Path $source $targets.'rx671-wifi'.signing_key
        $rsu = Join-Path $privateRoot 'fleet.rsu'
        python tools/build_rx671_fwup_v2_rsu.py --mot "$mot" --key "$key" --output "$rsu"
        if ($LASTEXITCODE -ne 0) { throw 'Fleet signed application generation failed.' }
        $base = Join-Path $source 'artifacts/normal_boot_rx671'
        $bundle = Join-Path $privateRoot 'bundle'
        python tools/prepare_normal_boot.py --source "$source" --target rx671-wifi --output "$bundle" --tls-backend software `
          --rsu "$rsu" --bootloader (Join-Path $base 'bootloader.mot') --bootloader-bank1 (Join-Path $base 'bootloader_bank1.mot') `
          --provisioner-mot (Join-Path $base 'public_signer_provisioner.mot') `
          --provisioner-manifest (Join-Path $base 'public_signer_provisioner_manifest.json') `
          --signer-cert (Join-Path $base 'signer.crt.pem') --signer-public-key (Join-Path $base 'signer.pub.pem')
        if ($LASTEXITCODE -ne 0) { throw 'Fleet normal-install bundle validation failed.' }
        python tools/ci/protected_normal_bundle.py pack --bundle "$bundle" `
          --output (Join-Path $source 'artifacts/normal_boot_rx671_fleet') --target rx671-wifi `
          --source-sha "$env:CI_COMMIT_SHA" --pipeline-id "$env:CI_PIPELINE_ID" --secret-env RX671_FLEET_ARTIFACT_SECRET
        if ($LASTEXITCODE -ne 0) { throw 'Fleet bundle protection failed.' }
      } finally {
        $env:RX671_FLEET_ARTIFACT_SECRET = ''; $claimKey = ''; $value = ''
        # This newly owned tree has only flat bundle files and the two inputs.
        # Do not recursively delete an unchecked or replaced directory.
        $resolvedPrivate = [IO.Path]::GetFullPath($privateRoot)
        if (-not $resolvedPrivate.StartsWith('C:\ai\codex\tmp\rx671-fleet-package-', [StringComparison]::OrdinalIgnoreCase) -or
            (Get-Item -LiteralPath $privateRoot).Attributes.HasFlag([IO.FileAttributes]::ReparsePoint)) {
          throw 'Fleet private output ownership changed; retained for inspection.'
        }
        $privateBundle = Join-Path $privateRoot 'bundle'
        if (Test-Path -LiteralPath $privateBundle) {
          $entries = @(Get-ChildItem -LiteralPath $privateBundle -Force)
          if ((Get-Item -LiteralPath $privateBundle).Attributes.HasFlag([IO.FileAttributes]::ReparsePoint) -or
              @($entries | Where-Object {$_.PSIsContainer -or $_.Attributes.HasFlag([IO.FileAttributes]::ReparsePoint)}).Count) {
            throw 'Unexpected Fleet bundle entries; private output retained.'
          }
          foreach ($entry in $entries) { Remove-Item -LiteralPath $entry.FullName -Force }
          Remove-Item -LiteralPath $privateBundle -Force
        }
        foreach ($name in @('fleet.mot', 'fleet.rsu')) {
          $path = Join-Path $privateRoot $name
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
        }
        if (@(Get-ChildItem -LiteralPath $privateRoot -Force).Count) {
          throw 'Unexpected private outputs; Fleet staging retained.'
        }
        Remove-Item -LiteralPath $privateRoot -Force
      }
  artifacts:
    paths:
      - artifacts/normal_boot_rx671_fleet/bundle.zip.enc
      - artifacts/normal_boot_rx671_fleet/manifest.json
    expire_in: 7 days

# Runner needs delivers the same-pipeline bundle; this job never installs it.
validate_normal_boot_rx72n:
  extends: .rx72n_linux_hw_job
  stage: package
  timeout: 10 minutes
  variables:
    GIT_SUBMODULE_STRATEGY: none
    RX72N_RPI1_HARDWARE_LOCK_TIMEOUT_SECONDS: "0"
  needs:
    - job: package_normal_boot_rx72n
      artifacts: true
  rules:
    - if: '($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web") && $PIPELINE_PROFILE == "focused" && $RUN_RX72N_BUNDLE_VALIDATION == "true" && $RUN_RX72N_BUILD == "true" && $RX72N_TEST_SCOPE == "build" && $RX72N_SKIP_HW_TESTS == "true" && $RX72N_TLS_BACKEND == "software"'
      when: on_success
    - when: never
  script:
    - |
      python3 - <<'PY'
      import datetime
      import hashlib
      import json
      import os
      import socket
      from pathlib import Path
      from tools import normal_boot
      from tools.idt.targets import get_target

      project = Path(os.environ["CI_PROJECT_DIR"]).absolute()
      bundle = project / "artifacts/normal_boot_rx72n"
      source_sha = os.environ["CI_COMMIT_SHA"]
      target = get_target("rx72n-ethernet")
      if socket.gethostname() != target["hostname"]:
          raise RuntimeError("Normal bundle validation must use the reviewed RX72 runner host")
      manifest = normal_boot.validate(bundle, target, source_sha)
      now = datetime.datetime.now(datetime.timezone.utc)
      receipt = {
          "schema_version": 1,
          "status": "PASS",
          "operation": "normal_bundle_validation_only",
          "source_sha": source_sha,
          "pipeline_id": int(os.environ["CI_PIPELINE_ID"]),
          "consumer_job_id": int(os.environ["CI_JOB_ID"]),
          "producer_job_name": "package_normal_boot_rx72n",
          "producer_binding": "same-pipeline needs artifacts:true; exact producer ID must be recorded from the pipeline job plan",
          "target_id": target["id"],
          "target_sha256": manifest["target_sha256"],
          "tls_backend": manifest["tls_backend"],
          "checkout_path": str(project),
          "bundle_path": str(bundle),
          "manifest_sha256": hashlib.sha256((bundle / "normal_install_manifest.json").read_bytes()).hexdigest(),
          "files_sha256": manifest["files"],
          "validated_at_utc": now.isoformat(),
          "probe_start_not_after_utc": (now + datetime.timedelta(minutes=30)).isoformat(),
          "probe_authorized": False,
          "revalidation_before_probe_required": True,
      }
      receipt_dir = project / "artifacts/validate_normal_boot_rx72n"
      receipt_dir.mkdir(exist_ok=False)
      (receipt_dir / "receipt.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
      print("RX72 normal bundle validation PASS")
      PY
  artifacts:
    paths:
      - artifacts/validate_normal_boot_rx72n/receipt.json
    expire_in: 1 day
