# Public normal-install bundles are prepared after normal images are retained.
.normal_boot_package:
  timeout: 3 hours
  extends: .rx_windows_canonical_checkout
  stage: build
  resource_group: $WINDOWS_CCRX_BUILD_RESOURCE_GROUP
  script:
    - !reference [.windows_ccrx_host_lease, script]
    - |
      $ErrorActionPreference = 'Stop'
      python -m pip install --user cryptography
      if ($LASTEXITCODE -ne 0) { throw 'Normal boot cryptography dependency installation failed.' }
      $source = $env:CI_PROJECT_DIR
      $target = $env:NORMAL_BOOT_TARGET
      python -c "import os, sys; from pathlib import Path; from tools.idt.prepare_public_signer import _source_state; source_sha = _source_state(Path(os.environ['CI_PROJECT_DIR'])); sys.exit(0 if source_sha == os.environ['CI_COMMIT_SHA'] else 'Normal source SHA mismatch')"
      if ($LASTEXITCODE -ne 0) { throw 'Normal package requires a clean matching source checkout before generation.' }
      $privateRoot = "C:/ai/codex/tmp/normal-boot-$env:CI_PIPELINE_ID-$env:CI_JOB_ID"
      if (Test-Path -LiteralPath $privateRoot) { throw 'Normal boot output already exists.' }
      New-Item -ItemType Directory -Path $privateRoot | Out-Null
      $workspace = "C:/ai/codex/ws/normal-boot-$env:CI_PIPELINE_ID-$env:CI_JOB_ID"
      $targets = (Get-Content -LiteralPath (Join-Path $source 'tools/idt/targets.json') -Raw | ConvertFrom-Json).targets
      $signingKey = if ($target -eq 'rx671-wifi') { $targets.$target.signing_key } else { [Environment]::GetEnvironmentVariable($env:NORMAL_BOOT_SIGNING_KEY_VARIABLE) }
      if ([string]::IsNullOrWhiteSpace($signingKey)) { throw 'Normal signing key path is not configured.' }
      if (-not [IO.Path]::IsPathRooted($signingKey)) { $signingKey = Join-Path $source $signingKey }
      $backend = if ($target -eq 'rx671-wifi') { 'software' } else { [Environment]::GetEnvironmentVariable($env:NORMAL_BOOT_BACKEND_VARIABLE) }
      $inputs = Join-Path $privateRoot 'normal-inputs'
      New-Item -ItemType Directory -Path $inputs | Out-Null
      $rsu = Join-Path $inputs 'normal_app.rsu'
      $boot0 = Join-Path $inputs 'bootloader.mot'
      $boot1 = Join-Path $inputs 'bootloader_bank1.mot'
      if ($target -eq 'rx671-wifi') {
        & tools/build_headless_rx671_bootloader.ps1 -ProjectRoot "$source" -E2Studio "$env:E2STUDIO_CLI" `
          -Workspace (Join-Path $workspace 'e2ws_iot_ref_rx671_bootloader_2026_04_2') `
          -LogFile (Join-Path $privateRoot 'bootloader-build-private.log') -Python python
        if ($LASTEXITCODE -ne 0) { throw 'Normal RX671 bootloader build failed.' }
        Copy-Item -LiteralPath (Join-Path $source 'Projects/boot_loader_rx671_ek/e2studio_ccrx/HardwareDebug/boot_loader_rx671_ek.mot') -Destination $boot0
        python tools/shift_srec_addresses.py --input "$boot0" --output "$boot1" --range-start 0xFFFC0000 --range-end 0xFFFFFFFF --shift=-0x100000 --drop-out-of-range
        if ($LASTEXITCODE -ne 0) { throw 'Normal RX671 bootloader mirror generation failed.' }
        python tools/build_rx671_fwup_v2_rsu.py --mot (Join-Path $source $env:NORMAL_BOOT_APP_MOT) --key "$signingKey" --output "$rsu"
        if ($LASTEXITCODE -ne 0) { throw 'Normal RX671 signed RSU generation failed.' }
      } else {
        # Preserve downloaded normal images before the public producer rebuilds HardwareDebug.
        Copy-Item -LiteralPath (Join-Path $source $env:NORMAL_BOOT_RSU) -Destination $rsu
        Copy-Item -LiteralPath (Join-Path $source $env:NORMAL_BOOT_BOOT0) -Destination $boot0
        if ($target -eq 'rx65n-bg96') {
          python tools/shift_srec_addresses.py --input "$boot0" --output "$boot1" --range-start 0xFFFC0000 --range-end 0xFFFFFFFF --shift=-0x100000 --drop-out-of-range
          if ($LASTEXITCODE -ne 0) { throw 'Normal RX65N bootloader mirror generation failed.' }
        } else {
          Copy-Item -LiteralPath (Join-Path $source $env:NORMAL_BOOT_BOOT1) -Destination $boot1
        }
      }
      $public = Join-Path $privateRoot 'public-signer'
      python tools/idt/prepare_public_signer.py --source "$source" --target "$target" --output "$public" --workspace "$workspace" --python python --signing-key "$signingKey"
      if ($LASTEXITCODE -ne 0) { throw 'Normal public signer preparation failed.' }
      $bundle = Join-Path $privateRoot 'bundle'
      python tools/prepare_normal_boot.py --source "$source" --target "$target" --output "$bundle" --tls-backend "$backend" `
        --rsu "$rsu" --bootloader "$boot0" --bootloader-bank1 "$boot1" `
        --provisioner-mot (Join-Path $public 'public_signer_provisioner.mot') `
        --provisioner-manifest (Join-Path $public 'public_signer_provisioner_manifest.json') `
        --signer-cert (Join-Path $public 'signer.crt.pem') --signer-public-key (Join-Path $public 'signer.pub.pem')
      if ($LASTEXITCODE -ne 0) { throw 'Normal install bundle validation failed.' }
      $artifact = Join-Path $source $env:NORMAL_BOOT_ARTIFACT_DIR
      if (Test-Path -LiteralPath $artifact) { throw 'Normal boot artifact directory already exists.' }
      New-Item -ItemType Directory -Path $artifact -Force | Out-Null
      $publicFiles = @('normal_app.rsu', 'bootloader.mot', 'bootloader_bank1.mot',
        'public_signer_provisioner.mot', 'public_signer_provisioner_manifest.json',
        'signer.crt.pem', 'signer.pub.pem', 'public_signer_bootloader_config.h',
        'public_signer_target.h', 'normal_install_manifest.json')
      foreach ($name in $publicFiles) { Copy-Item -LiteralPath (Join-Path $bundle $name) -Destination (Join-Path $artifact $name) }
  artifacts:
    paths:
      - $NORMAL_BOOT_ARTIFACT_DIR/
    expire_in: 7 days

