# XML-only diagnostic candidate: no SDK/build/RPi/AWS setup or native entry.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $READ_BASELINE11928_ASSERTION == "true" && $CI_COMMIT_REF_NAME == "codex/184-baseline11928-assertion-readonly"'
    - when: never
stages: [diagnostic]
variables:
  GIT_SUBMODULE_STRATEGY: none
  PYTHONUTF8: "1"
  RX72N_IDT_PYTHON: "C:/ai/codex/tools/venvs/rx72n-idt-windows/Scripts/python.exe"
  RX72N_IDT_HOST_PROFILE: "C:/ai/codex/tools/venvs/rx72n-idt-windows/host-profile.json"
inspect_rx65n_baseline11928_assertion:
  stage: diagnostic
  tags: [exec-shell, os-windows, hw-ishiguro-pc, ccrx, aws-cli-ishiguro]
  resource_group: ishiguro-pc-ccrx-e2studio-build
  timeout: 5 minutes
  retry: 0
  script:
    - |
      $ErrorActionPreference = 'Stop'
      & "$env:RX72N_IDT_PYTHON" -I -B tools/idt/baseline_native_assertion_diagnostic.py --execute --reviewed-code-sha256 "$env:RX_IDT_ASSERT_DIAG_REVIEWED_CODE_SHA256" --output "$env:CI_PROJECT_DIR/artifacts/idt/baseline11928-assertion-diagnostic.json"
      exit $LASTEXITCODE
  artifacts:
    when: always
    paths:
      - artifacts/idt/baseline11928-assertion-intent.json
      - artifacts/idt/baseline11928-assertion-diagnostic.json
    expire_in: 30 days
