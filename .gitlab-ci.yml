# Standalone metadata-only candidate: exactly one API job, no bridges or native test.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $READ_CURRENT_NATIVE11947_FILE_STAT == "true" && $CI_COMMIT_REF_NAME == "codex/184-ci11947-file-stat-readonly"'
    - when: never
stages: [diagnostic]
variables:
  GIT_SUBMODULE_STRATEGY: none
  PYTHONUTF8: "1"
  RX72N_IDT_PYTHON: "C:/ai/codex/tools/venvs/rx72n-idt-windows/Scripts/python.exe"
  RX72N_IDT_HOST_PROFILE: "C:/ai/codex/tools/venvs/rx72n-idt-windows/host-profile.json"
inspect_rx65n_native11947_file_stat:
  stage: diagnostic
  tags: [exec-shell, os-windows, hw-ishiguro-pc, ccrx, aws-cli-ishiguro]
  resource_group: ishiguro-pc-ccrx-e2studio-build
  timeout: 5 minutes
  retry: 0
  script:
    - |
      $ErrorActionPreference = 'Stop'
      & "$env:RX72N_IDT_PYTHON" -I -B tools/idt/current_native_metadata_stat.py --execute --reviewed-code-sha256 "$env:RX_IDT_STAT_DIAG_REVIEWED_CODE_SHA256" --output "$env:CI_PROJECT_DIR/artifacts/idt/current11947-file-stat.json"
      exit $LASTEXITCODE
  artifacts:
    when: always
    paths:
      - artifacts/idt/current11947-file-stat-intent.json
      - artifacts/idt/current11947-file-stat.json
    expire_in: 30 days
