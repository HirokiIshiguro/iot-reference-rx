workflow:
  rules:
    - if: '$CI_DEBUG_TRACE =~ /(?i)^(t|true|\+?0*1)$/ || $CI_DEBUG_SERVICES =~ /(?i)^(t|true|\+?0*1)$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PROJECT_ID == "38"'
      when: always
    - when: never

stages: [probe]
variables:
  GIT_STRATEGY: none
  GIT_SUBMODULE_STRATEGY: none

win29_limited_ssh_probe:
  stage: probe
  timeout: 5 minutes
  tags: [exec-shell, os-windows, ccrx, project38-idt-windows-protected]
  script:
    - |
      $ErrorActionPreference = 'Stop'
      if ($env:CI_PROJECT_ID -ne '38' -or $env:CI_RUNNER_ID -ne '29' -or
          $env:CI_COMMIT_REF_PROTECTED -ne 'true' -or [Environment]::UserName -ne 'svc-idt-rx' -or
          $env:CI_JOB_ID -notmatch '^\d+$') { throw 'Unexpected probe job identity.' }
      $key = 'C:/ProgramData/SAFFTI-IdtRxRunner/work/ssh-idt-rpi4/id_ed25519'
      $ssh = 'C:/Windows/System32/OpenSSH/ssh.exe'
      $keygen = 'C:/Windows/System32/OpenSSH/ssh-keygen.exe'
      $known = Join-Path $env:TEMP ("idt-rpi4-host-$env:CI_JOB_ID.txt")
      $stream = [IO.File]::Open($known, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
      try {
          $line = '192.168.10.123 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOHlGXFMBaNKz+F1uwnyxARvZFi92qDdOAbcOCOMHaRT' + "`n"
          $bytes = [Text.Encoding]::ASCII.GetBytes($line)
          $stream.Write($bytes, 0, $bytes.Length)
      } finally { $stream.Dispose() }
      try {
          $hostFingerprint = (& $keygen -lf $known -E sha256 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $hostFingerprint -notmatch 'SHA256:Cs4R7fkjzUKr8\+yrKLE\+e/dSl92IxX4e35DPkZuPn8U') { throw 'Unexpected host fingerprint.' }
          foreach ($entry in @(Get-ChildItem Env:)) {
              if ($entry.Name -match '^(?i:AWS_)' -or $entry.Name -match '(?i:TOKEN|SECRET|PRIVATE_KEY|PASSWORD)') {
                  Remove-Item -LiteralPath ('Env:' + $entry.Name) -ErrorAction Stop
              }
          }
          $python = 'C:/ProgramData/SAFFTI-IdtRxRunner/work/tools/venv-3.14.10/Scripts/python.exe'
          $probe = @'
      import subprocess, sys
      ssh, known, key = sys.argv[1:]
      options = ['-F', 'NUL', '-o', 'StrictHostKeyChecking=yes', '-o', 'UserKnownHostsFile=' + known,
                 '-o', 'GlobalKnownHostsFile=NUL', '-o', 'IdentitiesOnly=yes', '-o', 'BatchMode=yes',
                 '-o', 'ConnectTimeout=8', '-i', key, 'gitlab-runner-idt-rx@192.168.10.123']
      def invoke(command):
          return subprocess.run([ssh, *options, command], capture_output=True, text=True, timeout=15)
      rejected = invoke('hostname')
      if rejected.returncode != 1 or 'Paired SSH command rejected' not in rejected.stderr:
          raise SystemExit('Unexpected general command result')
      allowed = invoke('python3 -u "$HOME/.cache/idt-rx72n-pair/20969174760001/rpi4_pair_agent.py" attach 20969174760001')
      if allowed.returncode != 0 or allowed.stdout.strip() != 'IDT_GATE_PROBE_OK':
          raise SystemExit('Expected limited command did not complete')
      print('PASS: pinned host, dedicated key, general-command rejection and limited-command acceptance.')
      '@
          $probe | & $python -I - $ssh $known $key
          if ($LASTEXITCODE -ne 0) { throw 'Restricted SSH probe failed.' }
      } finally {
          Remove-Item -LiteralPath $known -Force -ErrorAction SilentlyContinue
      }
