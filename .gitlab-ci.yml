prepare_rx65n_bg96_mqtt_credentials:
  stage: credential_prepare
  tags:
    - exec-shell
    - os-windows
    - ccrx
  resource_group: rx65n-bg96-aws-iot-credentials
  extends:
    - .rx65n_bg96_credential_prepare_rules
  needs:
    - job: download_rx65n_bg96_app
      artifacts: false
  script:
    - $ErrorActionPreference = "Stop"
    - |
      $artifactDir = Join-Path $env:CI_PROJECT_DIR "artifacts\prepare_rx65n_bg96_mqtt_credentials"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

      function Get-FirstEnv {
        param([string[]]$Names)
        foreach ($name in $Names) {
          $value = [Environment]::GetEnvironmentVariable($name)
          if (-not [string]::IsNullOrWhiteSpace($value)) {
            return @{ Name = $name; Value = $value }
          }
        }
        return $null
      }

      $thing = Get-FirstEnv @("AWS_IOT_THING_NAME_CK_RX65N_01", "RX65N_BG96_AWS_IOT_THING_NAME", "BG96_AWS_IOT_THING_NAME", "BG96_MQTT_THING_NAME", "AWS_IOT_THING_NAME")
      $cert = Get-FirstEnv @("AWS_IOT_DEVICE_CERT_PEM_FILE_CK_RX65N_01", "AWS_IOT_DEVICE_CERT_PEM_CK_RX65N_01", "AWS_IOT_CLIENT_CERT_PEM_CK_RX65N_01", "AWS_IOT_CLIENT_CERTIFICATE_PEM_CK_RX65N_01", "BG96_AWS_IOT_DEVICE_CERT_PEM_FILE", "BG96_AWS_IOT_DEVICE_CERT_PEM", "BG96_AWS_IOT_CLIENT_CERTIFICATE_PEM", "AWS_IOT_DEVICE_CERT_PEM_FILE", "AWS_IOT_DEVICE_CERT_PEM", "AWS_IOT_CLIENT_CERTIFICATE_PEM", "AWS_IOT_CERT")
      $key = Get-FirstEnv @("AWS_IOT_DEVICE_PRIVATE_KEY_PEM_FILE_CK_RX65N_01", "AWS_IOT_DEVICE_PRIVATE_KEY_PEM_CK_RX65N_01", "AWS_IOT_CLIENT_PRIVATE_KEY_PEM_CK_RX65N_01", "AWS_IOT_PRIVATE_KEY_PEM_CK_RX65N_01", "BG96_AWS_IOT_DEVICE_PRIVATE_KEY_PEM_FILE", "BG96_AWS_IOT_DEVICE_PRIVATE_KEY_PEM", "BG96_AWS_IOT_PRIVATE_KEY_PEM", "AWS_IOT_DEVICE_PRIVATE_KEY_PEM_FILE", "AWS_IOT_DEVICE_PRIVATE_KEY_PEM", "AWS_IOT_PRIVATE_KEY_PEM", "AWS_IOT_PRIVKEY", "AWS_IOT_PRIVATE_KEY")
      if ($env:RX65N_BG96_TLS_BACKEND -eq "tsip") {
        if ($thing -and $cert) {
          Write-Host "Static BG96 MQTT certificate metadata is available for TSIP: $($thing.Name), $($cert.Name)"
          Set-Content -Path (Join-Path $artifactDir "mode.txt") -Value "static-tsip" -Encoding ascii
          exit 0
        }
        throw "RX65N/BG96 TSIP requires static thing/certificate variables matching the masked TSIP wrapped key blobs; dynamic AWS IoT credentials cannot be used."
      }
      if ($thing -and $cert -and $key) {
        Write-Host "Static BG96 MQTT credentials are available from CI variables: $($thing.Name), $($cert.Name), $($key.Name)"
        Set-Content -Path (Join-Path $artifactDir "mode.txt") -Value "static" -Encoding ascii
        exit 0
      }

      if ($env:RX65N_BG96_DYNAMIC_IOT_CREDENTIALS -ne "true") {
        throw "BG96 MQTT credentials are not available and RX65N_BG96_DYNAMIC_IOT_CREDENTIALS is not true."
      }

      $endpoint = Get-FirstEnv @("AWS_IOT_MQTT_BROKER_ENDPOINT_CK_RX65N_01", "BG96_AWS_IOT_ENDPOINT", "BG96_AWS_IOT_MQTT_BROKER_ENDPOINT", "BG96_MQTT_ENDPOINT", "BG96_MQTT_BROKER_ENDPOINT", "AWS_IOT_ENDPOINT", "AWS_IOT_MQTT_BROKER_ENDPOINT")
      $thingName = "$env:RX65N_BG96_THING_NAME_PREFIX-$env:CI_PIPELINE_ID"
      $args = @(
        "tools/create_bg96_iot_credentials.py",
        "--artifact-dir", $artifactDir,
        "--thing-name", $thingName,
        "--policy-name", $env:RX65N_BG96_IOT_POLICY_NAME,
        "--region", $env:AWS_DEFAULT_REGION,
        "--policy-document", "tools/iot_policy.json"
      )
      if ($endpoint) {
        $args += @("--endpoint", $endpoint.Value)
      }
      python @args
  artifacts:
    when: always
    paths:
      - artifacts/prepare_rx65n_bg96_mqtt_credentials/
    expire_in: 7 days

provision_rx65n_bg96_mqtt:
  stage: provision
  extends:
    - .rx65n_bg96_linux_hw_job
    - .rx65n_bg96_provision_rules
  needs:
    - job: prepare_rx65n_bg96_mqtt_credentials
      artifacts: true
    - job: download_rx65n_bg96_app
      artifacts: true
    - job: run_rx65n_bg96_app
      artifacts: true
      optional: true
  script:
    - echo "=== Provision CK-RX65N BG96 MQTT/APN credentials ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/provision_rx65n_bg96_mqtt"
      mkdir -p "$artifact_dir"
      actual_host="$(hostname)"
      if [ -n "${RX65N_BG96_RUNNER_HOSTNAME:-}" ] && ! printf '%s' "${actual_host}" | grep -Fq "${RX65N_BG96_RUNNER_HOSTNAME}"; then
        echo "This job must run on ${RX65N_BG96_RUNNER_HOSTNAME}*, but it was scheduled on ${actual_host}." >&2
        exit 1
      fi

      uart_port="${RX65N_BG96_UART_PORT:-${COMMAND_PORT:-}}"
      if [ -z "$uart_port" ] && [ -f artifacts/download_rx65n_bg96_app/selected_uart_port.txt ]; then
        uart_port="$(tr -d '\r\n' < artifacts/download_rx65n_bg96_app/selected_uart_port.txt)"
      fi
      if [ -z "$uart_port" ]; then
        echo "RX65N BG96 UART port was not selected." >&2
        exit 1
      fi

      credential_dir="$CI_PROJECT_DIR/artifacts/prepare_rx65n_bg96_mqtt_credentials"
      if [ -f "$credential_dir/iot_credentials_meta.json" ]; then
        export RX65N_BG96_AWS_IOT_THING_NAME="$(tr -d '\r\n' < "$credential_dir/thing_name.txt")"
        export AWS_IOT_CERT="$credential_dir/certificate.pem"
        export AWS_IOT_PRIVKEY="$credential_dir/private_key.pem"
        if [ -z "${AWS_IOT_ENDPOINT:-}" ] && [ -f "$credential_dir/endpoint.txt" ]; then
          export AWS_IOT_ENDPOINT="$(tr -d '\r\n' < "$credential_dir/endpoint.txt")"
        fi
        echo "Using temporary BG96 AWS IoT credentials from $credential_dir"
      fi

      rfp_tool="${RX65N_BG96_RFP_TOOL:-e2l:OBE110020}"
      bg96_provision_args=(
        --action provision-mqtt
        --uart-port "${uart_port}"
        --baud "${RX65N_BG96_UART_BAUD_RATE}"
        --provision-cli-timeout "${RX65N_BG96_MQTT_PROVISION_CLI_TIMEOUT_SECONDS}"
        --provision-char-delay "${RX65N_BG96_MQTT_PROVISION_CHAR_DELAY_SECONDS}"
        --provision-line-delay "${RX65N_BG96_MQTT_PROVISION_LINE_DELAY_SECONDS}"
        --rfp-cli "${RX65N_BG96_LINUX_RFP_CLI}"
        --rfp-device "${RX65N_BG96_RFP_DEVICE}"
        --rfp-tool "${rfp_tool}"
        --rfp-interface "${RX65N_BG96_RFP_INTERFACE}"
        --rfp-speed "${RX65N_BG96_RFP_SPEED}"
        --rfp-auth-id "${RX65N_BG96_RFP_AUTH_ID}"
      )
      if [ "${RX65N_BG96_TLS_BACKEND}" = "tsip" ]; then
        bg96_provision_args+=(--skip-private-key --no-reset-after-provision)
      fi

      python3 tools/bg96_bootloader_integration.py "${bg96_provision_args[@]}" \
        2>&1 | tee "$artifact_dir/provision_mqtt.log"
      status="${PIPESTATUS[0]}"
      if [ "$status" -ne 0 ]; then
        exit "$status"
      fi

      if [ "${RX65N_BG96_TLS_BACKEND}" = "tsip" ]; then
        python3 tools/provision_tsip_over_uart.py \
          --target rx65n \
          --port "${uart_port}" \
          --baud "${RX65N_BG96_UART_BAUD_RATE}" \
          --chunk-size "${RX65N_BG96_TSIP_PROVISION_CHUNK_SIZE}" \
          --timeout "${RX65N_BG96_TSIP_PROVISION_TIMEOUT_SECONDS}" \
          --no-enter-cli \
          2>&1 | tee "$artifact_dir/provision_tsip.log"
        status="${PIPESTATUS[0]}"
        if [ "$status" -ne 0 ]; then
          exit "$status"
        fi

        python3 tools/bg96_bootloader_integration.py \
          --action reset-app \
          --uart-port "${uart_port}" \
          --baud "${RX65N_BG96_UART_BAUD_RATE}" \
          --rfp-cli "${RX65N_BG96_LINUX_RFP_CLI}" \
          --rfp-device "${RX65N_BG96_RFP_DEVICE}" \
          --rfp-tool "${rfp_tool}" \
          --rfp-interface "${RX65N_BG96_RFP_INTERFACE}" \
          --rfp-speed "${RX65N_BG96_RFP_SPEED}" \
          --rfp-auth-id "${RX65N_BG96_RFP_AUTH_ID}" \
          2>&1 | tee "$artifact_dir/reset_after_tsip.log"
        status="${PIPESTATUS[0]}"
      fi
      exit "$status"
  artifacts:
    when: always
    paths:
      - artifacts/provision_rx65n_bg96_mqtt/
    expire_in: 7 days

reset_rx65n_bg96_app:
  stage: app_reset
