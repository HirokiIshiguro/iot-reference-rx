workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH =~ /^202-oidc-rx72n-read-(allow|deny)$/ && $CI_DEBUG_TRACE !~ /(?i)^(t|true|\+?0*1)$/ && $CI_DEBUG_SERVICES !~ /(?i)^(t|true|\+?0*1)$/'
    - when: never

rx72n_aws_oidc_read_proof:
  tags: [exec-shell, os-linux, cap-aws-sdk, ef-saffti-001-rpi-linux-004]
  timeout: 5 minutes
  variables:
    GIT_SUBMODULE_STRATEGY: none
  id_tokens:
    RX_OIDC_ID_TOKEN:
      aud: sts.amazonaws.com
  script:
    - python3 -m tools.aws.rx72n_read_proof
