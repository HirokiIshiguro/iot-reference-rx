include:
  - project: oss/infra/hardware-config
    ref: f26789f1b61645b7c5aad9d7e5e9f52c933b18e9
    file: /templates/windows_ccrx_host_lease.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "202-idt-transport-rx72n-pilot" && $CI_DEBUG_TRACE !~ /(?i)^(t|true|\+?0*1)$/ && $CI_DEBUG_SERVICES !~ /(?i)^(t|true|\+?0*1)$/'
    - when: never

.rx_windows_canonical_checkout:
  variables:
    GIT_STRATEGY: "clone"
    GIT_CONFIG_COUNT: "3"
    GIT_CONFIG_KEY_0: "core.longpaths"
    GIT_CONFIG_VALUE_0: "true"
    GIT_CONFIG_KEY_1: "core.autocrlf"
    GIT_CONFIG_VALUE_1: "false"
    GIT_CONFIG_KEY_2: "core.eol"
    GIT_CONFIG_VALUE_2: "lf"

.rx_idt_job:
  stage: test
  id_tokens:
    RX_OIDC_ID_TOKEN:
      aud: sts.amazonaws.com
  # Do not start PATH-selected AWS/Python tools while the JWT is in the job shell.
  before_script: []
  after_script: []
  tags:
    - exec-shell
    - os-windows
    - hw-ishiguro-pc
    - ccrx
    - aws-cli-ishiguro
  # This exact group must also protect the eventual independent OTA recovery.
  # A pipeline variable override must not silently remove that serialization.
  resource_group: ishiguro-pc-ccrx-e2studio-build
  timeout: 3 hours
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    PYTHONUTF8: "1"
  script:
    - !reference [.windows_ccrx_host_lease, script]
    - |
      & "C:/ai/codex/tools/venvs/rx72n-idt-windows/Scripts/python.exe" -I tools/idt/oidc_job.py
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    # IDT raw results can retain credential-injected source, firmware and
    # certificates. Publish only the sanitized files emitted by run_idt.py.
    paths:
      - artifacts/idt/FRQ_Report.xml
      - artifacts/idt/metadata.json
      - artifacts/idt/summary.json
    reports:
      junit: artifacts/idt/FRQ_Report.xml
    expire_in: 30 days

test_rx72n_idt:
  extends:
    - .rx_idt_job
    - .rx_windows_canonical_checkout
  variables:
    RUN_RX_IDT: "true"
    IDT_TARGET: "rx72n-ethernet"
    IDT_SCOPE: "transport"
