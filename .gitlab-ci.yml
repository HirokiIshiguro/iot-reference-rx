workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_REF_NAME == "codex/209-win29-repro-20261115"'
    - when: never
stages: [reproduce]
win29_reproduce_transport_build:
  stage: reproduce
  tags: [exec-shell, os-windows, ccrx, project38-idt-windows-protected]
  resource_group: ishiguro-pc-ccrx-e2studio-build
  timeout: 60m
  variables:
    GIT_STRATEGY: fetch
    GIT_SUBMODULE_STRATEGY: normal
    GIT_CONFIG_COUNT: "3"
    GIT_CONFIG_KEY_0: core.longpaths
    GIT_CONFIG_VALUE_0: "true"
    GIT_CONFIG_KEY_1: core.autocrlf
    GIT_CONFIG_VALUE_1: "false"
    GIT_CONFIG_KEY_2: core.eol
    GIT_CONFIG_VALUE_2: lf
    PYTHONUTF8: "1"
  before_script: []
  after_script: []
  script:
    - |
      $ErrorActionPreference = 'Stop'
      if ($env:CI_PROJECT_ID -ne '38' -or $env:CI_RUNNER_ID -ne '29' -or $env:CI_COMMIT_REF_PROTECTED -ne 'true' -or [Environment]::UserName -ne 'svc-idt-rx') { throw 'Unexpected reproduction identity.' }
      if ($env:IDT_REPRO_MODE -notin @('validate','compile')) { throw 'Unexpected reproduction mode.' }
      $diagSha = $env:CI_COMMIT_SHA
      $baseSha = 'abe3aa9d9f21349fcaa457212e08dd2da90f435d'
      if ((& git -C $env:CI_PROJECT_DIR rev-parse HEAD).Trim() -cne $diagSha) { throw 'Unexpected initial checkout.' }
      if (@(& git -C $env:CI_PROJECT_DIR status --porcelain=v1 --untracked-files=all --ignore-submodules=none).Count -ne 0) { throw 'Checkout is not clean.' }
      & git -C $env:CI_PROJECT_DIR checkout --detach $baseSha
      if ($LASTEXITCODE -ne 0) { throw 'Cannot select exact reproduction source.' }
      try {
        . (Join-Path $env:CI_PROJECT_DIR 'tools/rx_e2studio_cli.ps1')
        Initialize-RxBuildDependencies -ProjectRoot $env:CI_PROJECT_DIR
        foreach ($entry in @(Get-ChildItem Env:)) { if ($entry.Name -match '^(?i:AWS_)' -or $entry.Name -match '(?i:TOKEN|SECRET|PRIVATE_KEY|PASSWORD)') { Remove-Item -LiteralPath ('Env:' + $entry.Name) -ErrorAction Stop } }
        $env:AWS_EC2_METADATA_DISABLED = 'true'
        $repro = @'
      import os,sys,re,subprocess,tempfile,shutil,json,uuid,stat
      from pathlib import Path
      BASE='abe3aa9d9f21349fcaa457212e08dd2da90f435d'
      mode=os.environ.get('IDT_REPRO_MODE','')
      if mode not in ('validate','compile'):raise SystemExit('REPRO_ERROR invalid_mode')
      checkout=Path(os.environ['CI_PROJECT_DIR']).resolve(strict=True)
      sys.path.insert(0,str(checkout))
      from tools.idt import rpi4_pair as pair, rpi4_windows_worker as worker, rpi4_build_callback as callback
      from tools.idt.targets import get_target,target_fingerprint
      from tools.idt_source_manifest import capture_dependency_provenance
      from tools.idt.windows_build_job import UnconfirmedStop
      class ValidationPassed(Exception):pass
      stage='identity';safe_to_cleanup=True;runroot=None;wsroot=None
      
      def marker_failure(label,content):
       text=content.decode('utf-8-sig',errors='replace')
       locations=[]
       for m in re.finditer(r'(?i)(build_rx72n_idt_transport\.ps1|rpi4_windows_build\.ps1|rx_e2studio_cli\.ps1|build_headless_rx72n\.ps1)\s*:\s*(?:line\s*)?(\d{1,6})',text):
        v=(m.group(1).lower(),int(m.group(2)))
        if v not in locations:locations.append(v)
       for name,line in locations[-10:]:print('REPRO_LOCATION '+label+' '+name+' line='+str(line),flush=True)
       for c in sorted(set(re.findall(r'\b[CEF]\d{5,8}\b',text)))[:20]:print('REPRO_COMPILER_CODE '+c,flush=True)
       for name in ('TimeoutExpired','CalledProcessError','RuntimeException','UnauthorizedAccessException','FileNotFoundException','NativeCommandError','NativeCommandExitException'):
        if re.search(r'\b'+name+r'\b',text):print('REPRO_LOG_TYPE '+label+' '+name,flush=True)
       print('REPRO_LOG '+label+' present lines='+str(len(text.splitlines())),flush=True)
      
      def inspect_logs():
       if not runroot:return
       parent=runroot/'worker-private'
       try:entries=list(parent.glob('idt-pair-*'))
       except OSError:return
       if len(entries)!=1:return
       d=entries[0]
       for name,path in [('driver',d/'build.log'),('compiler',d/'source'/'artifacts'/'idt'/'build_transport'/'build.log')]:
        if path.is_file() and path.stat().st_size<=32*1024*1024:marker_failure(name,path.read_bytes())
      
      try:
       if subprocess.check_output(['git','-C',str(checkout),'rev-parse','HEAD'],text=True).strip()!=BASE:raise ValueError('source SHA mismatch')
       if subprocess.check_output(['git','-C',str(checkout),'status','--porcelain=v1','--untracked-files=all','--ignore-submodules=none']):raise ValueError('source not clean')
       os.environ['CI_COMMIT_SHA']=BASE
       stage='provenance';print('REPRO_STAGE provenance',flush=True)
       testroot=checkout/'Test'/'FreeRTOS-Libraries-Integration-Tests'
       testsha=subprocess.check_output(['git','-C',str(testroot),'rev-parse','HEAD'],text=True).strip().lower()
       target=get_target('rx72n-ethernet');provenance={'source_sha':BASE,'test_library_sha':testsha,'source_tree_dirty':False,'target_id':target['id'],'target_sha256':target_fingerprint(target)}
       provenance.update(capture_dependency_provenance(checkout,target['id']))
       stage='baseline_snapshot';print('REPRO_STAGE baseline_snapshot',flush=True);baseline=pair.snapshot(checkout)
       temp_parent=Path(r'C:\ai\codex\tmp').resolve(strict=True);workspace_parent=Path(r'C:\ai\codex\ws').resolve(strict=True)
       runroot=Path(tempfile.mkdtemp(prefix='idt-repro-86849-',dir=temp_parent)).resolve(strict=True);wsroot=Path(tempfile.mkdtemp(prefix='idt-repro-86849-',dir=workspace_parent)).resolve(strict=True)
       if runroot.parent!=temp_parent or wsroot.parent!=workspace_parent:raise ValueError('reproduction path mismatch')
       worker.restrict_runtime(runroot);worker.restrict_runtime(wsroot)
       private=runroot/'worker-private';private.mkdir();worker.restrict_runtime(private)
       leasefile=runroot/'reviewed-lease.ps1';leasefile.write_text("function Enter-WindowsCcrxHostLease {\n    [CmdletBinding()]\n    param(\n        [string]$LockPath = 'C:/ai/codex/locks/ccrx-e2studio-build.lock',\n        [ValidateRange(0, 86400)][int]$WaitSeconds = 3600\n    )\n\n    $existingLease = Get-Variable -Name WindowsCcrxHostLease -Scope Script -ErrorAction SilentlyContinue\n    if ($existingLease -and $existingLease.Value -is [IO.FileStream] -and $existingLease.Value.CanRead) {\n        throw 'The Windows CC-RX host lease is already held by this job shell.'\n    }\n\n    $leasePath = [IO.Path]::GetFullPath($LockPath)\n    [void][IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($leasePath))\n    $leaseWait = [Diagnostics.Stopwatch]::StartNew()\n    $ownedLease = $null\n    while ($null -eq $ownedLease) {\n        try {\n            $ownedLease = [IO.File]::Open(\n                $leasePath, [IO.FileMode]::OpenOrCreate,\n                [IO.FileAccess]::ReadWrite, [IO.FileShare]::None)\n        }\n        catch {\n            # PowerShell may wrap File.Open's IOException in MethodInvocationException.\n            $openFailure = $_.Exception\n            while ($openFailure.InnerException) { $openFailure = $openFailure.InnerException }\n            if ($openFailure -isnot [IO.IOException] -or ($openFailure.HResult -band 0xffff) -ne 32) {\n                throw\n            }\n            $remainingMs = ($WaitSeconds * 1000.0) - $leaseWait.Elapsed.TotalMilliseconds\n            if ($remainingMs -le 0) {\n                throw 'Timed out waiting for the Windows CC-RX host lease.'\n            }\n            Start-Sleep -Milliseconds ([int][Math]::Min(200, [Math]::Ceiling($remainingMs)))\n        }\n    }\n\n    # Independent builds do not participate in this cooperative CI lease.\n    $script:WindowsCcrxHostLease = $ownedLease\n}\n",encoding='utf-8')
       stage='native_source_copy';print('REPRO_STAGE native_source_copy',flush=True);native=runroot/'native'
       shutil.copytree(checkout,native,ignore=shutil.ignore_patterns('.git','__pycache__','*.pyc'))
       if pair.snapshot(native)!=baseline:raise ValueError('public fixture source copy differs')
       flags=('TRANSPORT_INTERFACE_TEST_ENABLED','DEVICE_ADVISOR_TEST_ENABLED','OTA_E2E_TEST_ENABLED','CORE_PKCS11_TEST_ENABLED','OTA_PAL_TEST_ENABLED','MQTT_TEST_ENABLED')
       execution='\n'.join('#define '+x+' ('+str(int(x==flags[0]))+')' for x in flags)+'\n'
       template=(native/'Test'/'FreeRTOS-Libraries-Integration-Tests'/'config_template'/'test_param_config_template.h').read_text(encoding='utf8')
       parameters=[m.group(1) for m in re.finditer(r'(?m)^\s*\*\s*(#define\s+\w+\s+.+)$',template)]
       if len(parameters)<10:raise ValueError('public parameter template changed')
       (native/'Test/include/test_execution_config.h').write_text(execution,encoding='utf8')
       (native/'Test/include/test_param_config.h').write_text('\n'.join(parameters)+'\n',encoding='utf8')
       stage='create_request';print('REPRO_STAGE create_request',flush=True);request=pair.create_request(native,baseline,provenance,uuid.uuid4().hex)
       if mode=='validate':
        def validate_run(command,**kwargs):
         global stage,safe_to_cleanup
         stage='validate_only';print('REPRO_STAGE validate_only',flush=True)
         def arg(n):return command[command.index(n)+1]
         cmd=['pwsh','-NoProfile','-NonInteractive','-File',str(checkout/'tools/build_rx72n_idt_transport.ps1'),'-ProjectRoot',arg('-ProjectRoot'),'-Target','rx72n-ethernet','-TestGroup','Transport','-Python',sys.executable,'-ProvenanceFile',arg('-ProvenanceFile'),'-Workspace',arg('-Workspace'),'-ValidateOnly']
         try:r=subprocess.run(cmd,env=worker.scrubbed_environment(),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=600,check=False)
         except subprocess.TimeoutExpired:safe_to_cleanup=False;raise
         if r.returncode:
          marker_failure('validate',r.stdout+r.stderr)
          raise subprocess.CalledProcessError(r.returncode,cmd)
         print('REPRO_VALIDATION_EXIT 0',flush=True);raise ValidationPassed()
        stage='worker_private_copy';print('REPRO_STAGE worker_private_copy',flush=True)
        try:worker.build_request(request,checkout,private,wsroot,leasefile,run=validate_run)
        except ValidationPassed:print('REPRO_RESULT validate_passed',flush=True)
        else:raise RuntimeError('validation path unexpectedly returned build output')
       else:
        os.environ['IDT_PAIR_BUILD_SECONDS']='2400';stage='production_worker_build';print('REPRO_STAGE production_worker_build',flush=True)
        response=worker.build_request(request,checkout,private,wsroot,leasefile)
        stage='output_validation';print('REPRO_STAGE output_validation',flush=True)
        files=pair.validate_response(response,request['request_id']);callback.validate_build(files,native,provenance,target)
        print('REPRO_RESULT compile_and_output_validation_passed',flush=True)
      except BaseException as e:
       if isinstance(e,(UnconfirmedStop,subprocess.TimeoutExpired)):safe_to_cleanup=False
       try:inspect_logs()
       except BaseException:print('REPRO_LOG inspection_unavailable',flush=True)
       name=type(e).__name__
       if name not in {'UnconfirmedStop','TimeoutExpired','CalledProcessError','ValueError','RuntimeError','OSError','FileNotFoundError','PermissionError','Exception'}:name='Other'
       print('REPRO_FAILURE stage='+stage+' type='+name,flush=True)
       if isinstance(e,subprocess.CalledProcessError):print('REPRO_EXIT_CODE '+str(e.returncode),flush=True)
       sys.exit(1)
      finally:
       if safe_to_cleanup:
        for d,parent in ((runroot,Path(r'C:\ai\codex\tmp')),(wsroot,Path(r'C:\ai\codex\ws'))):
         if d is None:continue
         try:
          if d.parent.resolve(strict=True)!=parent.resolve(strict=True) or not d.name.startswith('idt-repro-86849-') or d.is_symlink():raise ValueError('unsafe cleanup root')
          for base,dirs,files in os.walk(d,topdown=True,followlinks=False):
           for name in dirs:
            st=os.lstat(os.path.join(base,name))
            if not stat.S_ISDIR(st.st_mode) or getattr(st,'st_file_attributes',0)&0x400:raise ValueError('directory reparse point')
          shutil.rmtree(d)
         except BaseException:print('REPRO_CLEANUP_FAILED',flush=True);safe_to_cleanup=False
        if safe_to_cleanup:print('REPRO_CLEANUP completed',flush=True)
        else:sys.exit(1)
       else:print('REPRO_CLEANUP retained_stop_unconfirmed',flush=True)
      '@
        $idtPython = 'C:\ProgramData\SAFFTI-IdtRxRunner\work\tools\venv-3.14.10\Scripts\python.exe'
        & $idtPython -B -I -c $repro
        if ($LASTEXITCODE -ne 0) { throw 'Reproduction failed; see bounded REPRO diagnostics.' }
      } finally {
        & git -C $env:CI_PROJECT_DIR checkout --detach $diagSha
        if ($LASTEXITCODE -ne 0) { Write-Host 'REPRO_CHECKOUT_RESTORE_FAILED' }
      }
