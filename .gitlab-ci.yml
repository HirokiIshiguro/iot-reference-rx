workflow:
  rules:
    - if: '($CI_DEBUG_TRACE =~ /(?i)^(t|true|\+?0*1)$/ || $CI_DEBUG_SERVICES =~ /(?i)^(t|true|\+?0*1)$/)'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/209-win29-pair-key" && $CI_COMMIT_REF_PROTECTED == "true" && $IDT_KEY_PREP == "true"'
    - when: never
stages: [test]
variables:
  GIT_STRATEGY: empty
  GIT_SUBMODULE_STRATEGY: none

win29_create_pair_public_key:
  stage: test
  tags: [exec-shell, os-windows, ccrx, project38-idt-windows-protected]
  timeout: 5 minutes
  before_script: []
  after_script: []
  script:
    - |
      $ErrorActionPreference = 'Stop'
      if ($env:CI_PROJECT_ID -ne '38' -or $env:CI_RUNNER_ID -ne '29' -or
          $env:CI_COMMIT_REF_PROTECTED -ne 'true' -or [Environment]::UserName -ne 'svc-idt-rx') {
          throw 'Unexpected project, runner, protected ref or execution account.'
      }
      foreach ($entry in @(Get-ChildItem Env:)) {
          if ($entry.Name -match '^(?i:AWS_)' -or $entry.Name -match '(?i:TOKEN|SECRET|PRIVATE_KEY|PASSWORD)') {
              Remove-Item -LiteralPath ('Env:' + $entry.Name) -ErrorAction Stop
          }
      }
      $work = [IO.Path]::GetFullPath('C:/ProgramData/SAFFTI-IdtRxRunner/work').TrimEnd('\')
      $directory = [IO.Path]::GetFullPath((Join-Path $work 'ssh-idt-rpi4'))
      $private = Join-Path $directory 'id_ed25519'
      $public = $private + '.pub'
      if ([IO.Path]::GetDirectoryName($directory) -ine $work -or (Test-Path -LiteralPath $directory)) {
          throw 'Dedicated SSH directory already exists or escaped its parent; do not replace keys.'
      }
      $entry = Get-Item -LiteralPath $work -Force
      while ($null -ne $entry) {
          if ($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Reparse point in SSH path.' }
          $entry = $entry.Parent
      }
      [void](New-Item -ItemType Directory -Path $directory -ErrorAction Stop)
      $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User
      $allow = [Security.AccessControl.AccessControlType]::Allow
      $inherit = [Security.AccessControl.InheritanceFlags]'ContainerInherit,ObjectInherit'
      $propagate = [Security.AccessControl.PropagationFlags]::None
      $acl = [Security.AccessControl.DirectorySecurity]::new()
      $acl.SetAccessRuleProtection($true, $false)
      foreach ($id in @($sid.Value, 'S-1-5-18', 'S-1-5-32-544')) {
          $r = [Security.AccessControl.FileSystemAccessRule]::new([Security.Principal.SecurityIdentifier]::new($id), 'FullControl', $inherit, $propagate, $allow)
          [void]$acl.AddAccessRule($r)
      }
      Set-Acl -LiteralPath $directory -AclObject $acl
      $sshkeygen = 'C:/Windows/System32/OpenSSH/ssh-keygen.exe'
      & $sshkeygen -q -t ed25519 -N '' -C 'project38-idt-win29' -f $private *> $null
      if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $private -PathType Leaf) -or
          -not (Test-Path -LiteralPath $public -PathType Leaf)) { throw 'SSH key generation did not complete; retain directory for inspection.' }
      $fileAcl = [Security.AccessControl.FileSecurity]::new()
      $fileAcl.SetAccessRuleProtection($true, $false)
      foreach ($id in @($sid.Value, 'S-1-5-18', 'S-1-5-32-544')) {
          $r = [Security.AccessControl.FileSystemAccessRule]::new([Security.Principal.SecurityIdentifier]::new($id), 'FullControl', $allow)
          [void]$fileAcl.AddAccessRule($r)
      }
      Set-Acl -LiteralPath $private -AclObject $fileAcl
      foreach ($path in @($directory, $private)) {
          $checked = Get-Acl -LiteralPath $path
          if (-not $checked.AreAccessRulesProtected) { throw 'SSH ACL inheritance was not disabled.' }
          foreach ($rule in $checked.Access) {
              $ruleSid = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
              if ($rule.AccessControlType -eq $allow -and $ruleSid -notin @($sid.Value, 'S-1-5-18', 'S-1-5-32-544')) {
                  throw 'Unexpected principal can access SSH private path.'
              }
          }
      }
      $key = [IO.File]::ReadAllText($public).Trim()
      if ($key -cnotmatch '^ssh-ed25519 [A-Za-z0-9+/=]+ project38-idt-win29$') { throw 'Unexpected public key format.' }
      $fingerprint = & $sshkeygen -lf $public -E sha256
      if ($LASTEXITCODE -ne 0 -or $fingerprint -notmatch 'SHA256:[A-Za-z0-9+/]+') { throw 'Cannot compute public fingerprint.' }
      Write-Host ('PUBLIC_KEY=' + $key)
      Write-Host ('PUBLIC_FINGERPRINT=' + $Matches[0])
      Write-Host 'PRIVATE_KEY_PATH=C:/ProgramData/SAFFTI-IdtRxRunner/work/ssh-idt-rpi4/id_ed25519'
      Write-Host 'PRIVATE_ACL=svc-idt-rx,SYSTEM,Administrators; inheritance disabled'
