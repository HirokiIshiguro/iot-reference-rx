stages:
  - build
  - flash
  - provision
  - test
  - package
  - ota_build
  - ota_prepare
  - ota_create
  - ota_test
  - fleet_flash
  - fleet_provision
  - fleet_test
  - fleet_cleanup

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "core.longpaths"
  GIT_CONFIG_VALUE_0: "true"
  E2STUDIO_CLI: "C:/Renesas/e2_studio_2025_12/eclipse/e2studioc.exe"
  E2STUDIO_WORKSPACE: "C:/Temp/e2ws_iot_ref_rx72n"
  RFP_CLI: "C:/Program Files (x86)/Renesas Electronics/Programming Tools/Renesas Flash Programmer V3.22/rfp-cli.exe"
  RFP_SPEED: "1500K"
  RFP_AUTH: "FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF"
  RFP_TOOL: "e2l"
  UART_PORT: "COM7"
  UART_BAUD_RATE: "921600"
  RX72N_SIGNING_KEY: "sample_keys/secp256r1.privatekey"
  RX72N_DEVICE_ID: "rx72n-02"
  # RX72N_TEST_SCOPE:
  #   auto  - main/tag/manual pipelines run the MQTT + OTA path; feature push/MR pipelines stay build-only unless explicitly enabled.
  #   build - build/package only, no hardware test.
  #   mqtt  - flash/provision/MQTT only, no OTA.
  #   ota   - flash/provision/MQTT + OTA.
  #   full  - flash/provision/MQTT + OTA + Fleet Provisioning cleanup path.
  RX72N_TEST_SCOPE: "full"
  RUN_RX72N_HW_TESTS: "false"
  RUN_RX72N_OTA_TESTS: "false"
  RUN_RX72N_FLEET_TESTS: "false"
  RX72N_CLEANUP_FLEET_RESOURCES: "true"
  RX72N_FLEET_POLICY_NAME: "rx72n-envision-kit-policy"
  RX72N_SKIP_HW_TESTS: "false"
  RX72N_SKIP_OTA_TESTS: "false"
  RX72N_HW_RUNNER_PLATFORM: "linux"
  RX72N_DEVICE_RESOURCE_GROUP: "rx72n-device-02"
  RX72N_LINUX_RFP_CLI: "$CI_PROJECT_DIR/tools/rfp_cli_locked.sh"
  # The restore pipeline is pinned to the RX72N set1 runner on RPi#2.
  # RPi#1 and RPi#2 both expose an RX72N E2 Lite as OBE110008, but the runner
  # tag scopes the host, so the pinned serial remains unambiguous.
  RX72N_LINUX_RFP_TOOL: "e2l:OBE110008"
  RX72N_LINUX_UART_PORT: "${UART_PORT_ENVISION_KIT_RX72N_CN6_RPI2}"
  RX72N_LINUX_COMMAND_PORT: ""
  RX72N_LINUX_UART_BAUD_RATE: "921600"
  RX72N_LINUX_COMMAND_BAUD_RATE: "115200"
  RX72N_MQTT_TEST_TIMEOUT: "600"
  RX72N_FLEET_TEST_TIMEOUT: "600"
  RX72N_OTA_CANDIDATE_VERSION: "0.9.3"
  RX72N_OTA_OBSERVE_TIMEOUT: "900"
  AWS_DEFAULT_REGION: "ap-northeast-1"
  E2STUDIO_WORKSPACE_OTA: "C:/Temp/e2ws_iot_ref_rx72n_ota"
  E2STUDIO_WORKSPACE_FLEET: "C:/Temp/e2ws_iot_ref_rx72n_fleet"
  E2STUDIO_WORKSPACE_MQTT: "C:/Temp/e2ws_iot_ref_rx72n_mqtt"

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "api"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: $CI_COMMIT_BRANCH
      when: always

build_rx72n:
  stage: build
  tags:
    - exec-shell
    - os-windows
    - hw-ishiguro-pc
  resource_group: rx72n-e2studio-build
  script:
    - Write-Host "=== Build RX72N projects ==="
    - pip install cryptography --quiet
    - |
      & "$env:CI_PROJECT_DIR\tools\build_headless_rx72n.ps1" `
        -ProjectRoot "$env:CI_PROJECT_DIR" `
        -E2Studio "$env:E2STUDIO_CLI" `
        -Workspace "$env:E2STUDIO_WORKSPACE" `
        -LogFile "$env:CI_PROJECT_DIR\rx72n_e2studio_build.log"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot")) { Write-Error "boot_loader .mot missing"; exit 1 }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.mot")) { Write-Error "app .mot missing"; exit 1 }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.abs")) { Write-Error "app .abs missing"; exit 1 }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.x")) { Write-Error "app .x missing"; exit 1 }
    - |
      python "$env:CI_PROJECT_DIR\tools\shift_srec_addresses.py" `
        --input "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot" `
        --output "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit_bank1.mot" `
        --range-start 0xFFE00000 `
        --range-end 0xFFFFFFFF `
        --shift -0x200000 `
        --drop-out-of-range
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit_bank1.mot")) { Write-Error "bank1 boot_loader .mot missing"; exit 1 }
    - |
      python "$env:CI_PROJECT_DIR\tools\build_fwup_v2_rsu.py" `
        --mot "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.mot" `
        --prm "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\src\smc_gen\r_fwup\tool\RX72N_DualBank_ImageGenerator_PRM.csv" `
        --key "$env:CI_PROJECT_DIR\$env:RX72N_SIGNING_KEY" `
        --output "$env:CI_PROJECT_DIR\rx72n_app.rsu"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\rx72n_app.rsu")) { Write-Error "rx72n_app.rsu missing"; exit 1 }
    - |
      python "$env:CI_PROJECT_DIR\tools\generate_signer_cert.py" `
        --key "$env:CI_PROJECT_DIR\$env:RX72N_SIGNING_KEY" `
        --out "$env:CI_PROJECT_DIR\rx72n_codesign_cert.pem"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\rx72n_codesign_cert.pem")) { Write-Error "rx72n_codesign_cert.pem missing"; exit 1 }
    - Write-Host "BUILD SUCCESS"
  artifacts:
    when: always
    paths:
      - rx72n_e2studio_build.log
      - rx72n_app.rsu
      - rx72n_codesign_cert.pem
      - Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 7 days

build_rx72n_fleet_candidate:
  stage: build
  tags:
    - exec-shell
    - os-windows
    - hw-ishiguro-pc
  resource_group: rx72n-e2studio-build
  rules:
    - if: '($RUN_RX72N_FLEET_TESTS == "true" || $RX72N_TEST_SCOPE == "full") && $RX72N_SKIP_HW_TESTS != "true" && $AWS_IOT_ENDPOINT && $AWS_FLEET_PROVISIONING_TEMPLATE_RX72N_02 && $AWS_FLEET_CLAIM_CERT_RX72N_02 && $AWS_FLEET_CLAIM_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Build RX72N Fleet Provisioning candidate ==="
    - pip install cryptography --quiet
    - |
      & "$env:CI_PROJECT_DIR\tools\build_headless_rx72n_fleet.ps1" `
        -ProjectRoot "$env:CI_PROJECT_DIR" `
        -E2Studio "$env:E2STUDIO_CLI" `
        -Workspace "$env:E2STUDIO_WORKSPACE_FLEET" `
        -LogFile "$env:CI_PROJECT_DIR\rx72n_e2studio_build_fleet.log" `
        -FleetDemoId "$env:RX72N_DEVICE_ID-fp"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot")) { Write-Error "boot_loader .mot missing"; exit 1 }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.mot")) { Write-Error "fleet app .mot missing"; exit 1 }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.abs")) { Write-Error "fleet app .abs missing"; exit 1 }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.x")) { Write-Error "fleet app .x missing"; exit 1 }
    - |
      python "$env:CI_PROJECT_DIR\tools\shift_srec_addresses.py" `
        --input "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot" `
        --output "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit_bank1.mot" `
        --range-start 0xFFE00000 `
        --range-end 0xFFFFFFFF `
        --shift -0x200000 `
        --drop-out-of-range
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit_bank1.mot")) { Write-Error "bank1 boot_loader .mot missing"; exit 1 }
    - |
      python "$env:CI_PROJECT_DIR\tools\build_fwup_v2_rsu.py" `
        --mot "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.mot" `
        --prm "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\src\smc_gen\r_fwup\tool\RX72N_DualBank_ImageGenerator_PRM.csv" `
        --key "$env:CI_PROJECT_DIR\$env:RX72N_SIGNING_KEY" `
        --output "$env:CI_PROJECT_DIR\rx72n_app.rsu"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\rx72n_app.rsu")) { Write-Error "rx72n_app.rsu missing"; exit 1 }
    - |
      python "$env:CI_PROJECT_DIR\tools\generate_signer_cert.py" `
        --key "$env:CI_PROJECT_DIR\$env:RX72N_SIGNING_KEY" `
        --out "$env:CI_PROJECT_DIR\rx72n_codesign_cert.pem"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\rx72n_codesign_cert.pem")) { Write-Error "rx72n_codesign_cert.pem missing"; exit 1 }
    - Write-Host "BUILD RX72N FLEET CANDIDATE SUCCESS"
  artifacts:
    when: always
    paths:
      - rx72n_e2studio_build_fleet.log
      - rx72n_app.rsu
      - rx72n_codesign_cert.pem
      - Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 7 days

.rx72n_linux_hw_job:
  tags:
    - exec-shell
    - os-linux
    - hw-raspi
    - dev-ek-rx72n
    - dev-ek-rx72n-set1
  resource_group: $RX72N_DEVICE_RESOURCE_GROUP
  before_script:
    - set -o pipefail
    - python3 -m venv .venv-pi
    - source .venv-pi/bin/activate
    - python -m pip install --quiet pyserial cryptography

flash_rx72n_linux:
  stage: flash
  extends: .rx72n_linux_hw_job
  needs:
    - build_rx72n
  rules:
    - if: '$RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE =~ /^(mqtt|ota|full)$/ && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$CI_COMMIT_TAG && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "api" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_OTA_TESTS == "true" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_HW_TESTS == "true" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - echo "=== Flash RX72N boot_loader and download app RSU on Linux runner ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/flash_rx72n_linux"
      mkdir -p "$artifact_dir"
      reset_cmd="$RX72N_LINUX_RFP_CLI -device RX72x -tool $RX72N_LINUX_RFP_TOOL -if fine -speed $RFP_SPEED -auth id $RFP_AUTH -sig -run -noquery"

      "$RX72N_LINUX_RFP_CLI" -device RX72x -tool "$RX72N_LINUX_RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id "$RFP_AUTH" -erase-chip -noquery

      "$RX72N_LINUX_RFP_CLI" -device RX72x -tool "$RX72N_LINUX_RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id "$RFP_AUTH" \
        -p "$CI_PROJECT_DIR/Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/boot_loader_rx72n_envision_kit.mot" \
        -v -noquery

      "$RX72N_LINUX_RFP_CLI" -device RX72x -tool "$RX72N_LINUX_RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id "$RFP_AUTH" \
        -p "$CI_PROJECT_DIR/Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/boot_loader_rx72n_envision_kit_bank1.mot" \
        -v -noquery

      python tools/test_uart_download_rx72n.py \
        --rsu "$CI_PROJECT_DIR/rx72n_app.rsu" \
        --port "$RX72N_LINUX_UART_PORT" \
        --baud "$RX72N_LINUX_UART_BAUD_RATE" \
        --timeout 420 \
        --post-tx-wait 120 \
        --diag \
        --wait-for-ready \
        --ready-timeout 90 \
        --reset-cmd "$reset_cmd" \
        2>&1 | tee "$artifact_dir/flash_rx72n.log"
  artifacts:
    when: always
    paths:
      - artifacts/flash_rx72n_linux/
    expire_in: 7 days

flash_rx72n_fleet_linux:
  stage: fleet_flash
  extends: .rx72n_linux_hw_job
  needs:
    - job: build_rx72n_fleet_candidate
      artifacts: true
    - job: test_ota_rx72n_linux
      artifacts: true
      optional: true
  rules:
    - if: '($RUN_RX72N_FLEET_TESTS == "true" || $RX72N_TEST_SCOPE == "full") && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_FLEET_PROVISIONING_TEMPLATE_RX72N_02 && $AWS_FLEET_CLAIM_CERT_RX72N_02 && $AWS_FLEET_CLAIM_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - echo "=== Flash RX72N Fleet Provisioning image on Linux runner ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/flash_rx72n_fleet_linux"
      mkdir -p "$artifact_dir"
      reset_cmd="$RX72N_LINUX_RFP_CLI -device RX72x -tool $RX72N_LINUX_RFP_TOOL -if fine -speed $RFP_SPEED -auth id $RFP_AUTH -sig -run -noquery"

      "$RX72N_LINUX_RFP_CLI" -device RX72x -tool "$RX72N_LINUX_RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id "$RFP_AUTH" -erase-chip -noquery

      "$RX72N_LINUX_RFP_CLI" -device RX72x -tool "$RX72N_LINUX_RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id "$RFP_AUTH" \
        -p "$CI_PROJECT_DIR/Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/boot_loader_rx72n_envision_kit.mot" \
        -v -noquery

      "$RX72N_LINUX_RFP_CLI" -device RX72x -tool "$RX72N_LINUX_RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id "$RFP_AUTH" \
        -p "$CI_PROJECT_DIR/Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/boot_loader_rx72n_envision_kit_bank1.mot" \
        -v -noquery

      python tools/test_uart_download_rx72n.py \
        --rsu "$CI_PROJECT_DIR/rx72n_app.rsu" \
        --port "$RX72N_LINUX_UART_PORT" \
        --baud "$RX72N_LINUX_UART_BAUD_RATE" \
        --timeout 420 \
        --post-tx-wait 120 \
        --diag \
        --wait-for-ready \
        --ready-timeout 90 \
        --reset-cmd "$reset_cmd" \
        2>&1 | tee "$artifact_dir/flash_rx72n_fleet.log"
  artifacts:
    when: always
    paths:
      - artifacts/flash_rx72n_fleet_linux/
    expire_in: 7 days

provision_rx72n_linux:
  stage: provision
  extends: .rx72n_linux_hw_job
  needs:
    - build_rx72n
    - flash_rx72n_linux
  rules:
    - if: '$RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE =~ /^(mqtt|ota|full)$/ && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$CI_COMMIT_TAG && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "api" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_OTA_TESTS == "true" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_HW_TESTS == "true" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - echo "=== Provision RX72N AWS IoT credentials on Linux runner ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/provision_rx72n_linux"
      mkdir -p "$artifact_dir"
      reset_cmd="$RX72N_LINUX_RFP_CLI -device RX72x -tool $RX72N_LINUX_RFP_TOOL -if fine -speed $RFP_SPEED -auth id $RFP_AUTH -sig -run -noquery"

      shadow_args=()
      if [ -n "${RX72N_LINUX_COMMAND_PORT:-}" ]; then
        shadow_args+=(--shadow-port "$RX72N_LINUX_COMMAND_PORT" --shadow-baud "$RX72N_LINUX_COMMAND_BAUD_RATE" --shadow-name cn8)
      fi

