build_rx65n_bg96_ota:
  stage: ota_build
  tags:
    - exec-shell
    - os-windows
    - ccrx
  resource_group: rx65n-bg96-e2studio-build
  extends:
    - .rx65n_bg96_ota_rules
  needs:
    - job: prepare_rx65n_bg96_mqtt_credentials
      artifacts: true
    - job: test_rx65n_bg96_mqtt
      artifacts: true
  script:
    - $ErrorActionPreference = "Stop"
    - python -m pip install --user cryptography
    - |
      $artifactDir = Join-Path $env:CI_PROJECT_DIR "artifacts\build_rx65n_bg96_ota"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

      $credentialDir = Join-Path $env:CI_PROJECT_DIR "artifacts\prepare_rx65n_bg96_mqtt_credentials"
      $dynamicMeta = Join-Path $credentialDir "iot_credentials_meta.json"
      if (Test-Path -LiteralPath $dynamicMeta) {
        $env:RX65N_BG96_AWS_IOT_THING_NAME = (Get-Content -LiteralPath (Join-Path $credentialDir "thing_name.txt") -Raw).Trim()
        $env:AWS_IOT_CERT = Join-Path $credentialDir "certificate.pem"
        $env:AWS_IOT_PRIVKEY = Join-Path $credentialDir "private_key.pem"
        if ([string]::IsNullOrWhiteSpace($env:AWS_IOT_ENDPOINT)) {
          $env:AWS_IOT_ENDPOINT = (Get-Content -LiteralPath (Join-Path $credentialDir "endpoint.txt") -Raw).Trim()
        }
        Write-Host "Using temporary BG96 AWS IoT credentials for OTA candidate build."
      }

      $version = $env:RX65N_BG96_OTA_CANDIDATE_VERSION
      if ([string]::IsNullOrWhiteSpace($version)) {
        $version = "0.9.$env:CI_PIPELINE_IID"
      }
      Set-Content -Path (Join-Path $artifactDir "version.txt") -Value $version -Encoding ascii

      function Get-FirstEnv {
        param([string[]]$Names)
        foreach ($name in $Names) {
          $value = [Environment]::GetEnvironmentVariable($name)
          if (-not [string]::IsNullOrWhiteSpace($value)) {
            return @{ Name = $name; Value = $value }
          }
        }
        return ""
      }

      $signingKeyItem = Get-FirstEnv @("RX65N_BG96_OTA_SIGNING_KEY", "BG96_OTA_SIGNING_KEY", "RX65N_BG96_SIGNING_KEY")
      if (-not $signingKeyItem) {
        throw "RX65N BG96 OTA signing key is not configured."
      }
      $signingKey = $signingKeyItem.Value
      Write-Host "Using RX65N BG96 OTA signing key from CI variable: $($signingKeyItem.Name)"
      if (-not [System.IO.Path]::IsPathRooted($signingKey)) {
        $signingKey = Join-Path $env:CI_PROJECT_DIR $signingKey
      }
      if (-not (Test-Path -LiteralPath $signingKey)) {
        throw "RX65N BG96 OTA signing key not found: $signingKey"
      }

      $rx65nBg96AppProject = if ($env:RX65N_BG96_TLS_BACKEND -eq "tsip") { "aws_bg96_ck_rx65n_tsip" } else { "aws_bg96_ck_rx65n" }
      $appRoot = Join-Path $env:CI_PROJECT_DIR "Projects\$rx65nBg96AppProject\e2studio_ccrx"
      python tools/patch_bg96_aws_iot_mcu.py patch --aws-root "$appRoot" --backup "$artifactDir\aws_dev_mode_key_provisioning.c.orig"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      python tools/configure_bg96_mqtt_credentials.py --app-dir "$appRoot" --marker "$artifactDir\mqtt_credentials_configured" --require --tls-backend "$env:RX65N_BG96_TLS_BACKEND"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      python tools/build_bg96_ota_candidate.py `
        --repo-root "$env:CI_PROJECT_DIR" `
        --app-dir "Projects/$rx65nBg96AppProject/e2studio_ccrx" `
        --version "$version" `
        --output-dir "$artifactDir" `
        --signing-key "$signingKey" `
        --e2studio-cli "$env:E2STUDIO_CLI_BG96" `
        --workspace "$env:E2STUDIO_WORKSPACE_RX65N_BG96_OTA" `
        --e2studio-timeout "$env:RX65N_BG96_E2STUDIO_TIMEOUT_SECONDS"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      $versionToken = $version -replace '\.', '_'
      $requiredArtifacts = @(
        (Join-Path $artifactDir ("bg96_{0}.rsu" -f $versionToken)),
        (Join-Path $artifactDir ("bg96_{0}_ota_payload.bin" -f $versionToken)),
        (Join-Path $artifactDir ("bg96_{0}_ota_payload.sig.der" -f $versionToken)),
        (Join-Path $artifactDir "bg96_ota_codesign_cert.pem")
      )
      foreach ($path in $requiredArtifacts) {
        if (-not (Test-Path -LiteralPath $path)) {
          throw "RX65N BG96 OTA candidate artifact missing: $path"
        }
      }

      Write-Host "Using locally generated RX65N BG96 OTA code signer certificate and customCodeSigning signature."
  after_script:
    - $artifactDir = Join-Path $env:CI_PROJECT_DIR "artifacts\build_rx65n_bg96_ota"
    - $rx65nBg96AppProject = if ($env:RX65N_BG96_TLS_BACKEND -eq "tsip") { "aws_bg96_ck_rx65n_tsip" } else { "aws_bg96_ck_rx65n" }
    - $appRoot = Join-Path $env:CI_PROJECT_DIR "Projects\$rx65nBg96AppProject\e2studio_ccrx"
    - python tools/patch_bg96_aws_iot_mcu.py restore --aws-root "$appRoot" --backup "$artifactDir\aws_dev_mode_key_provisioning.c.orig"
  artifacts:
    when: always
    paths:
      - artifacts/build_rx65n_bg96_ota/
      - Projects/aws_bg96_ck_rx65n/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_bg96_ck_rx65n/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_bg96_ck_rx65n_tsip/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_bg96_ck_rx65n_tsip/e2studio_ccrx/HardwareDebug/*.abs
    expire_in: 7 days

provision_rx65n_bg96_ota_signer:
  stage: ota_prepare
  extends:
    - .rx65n_bg96_linux_hw_job
    - .rx65n_bg96_ota_rules
  needs:
    - job: build_rx65n_bg96_ota
      artifacts: true
    - job: download_rx65n_bg96_app
      artifacts: true
    - job: test_rx65n_bg96_mqtt
      artifacts: true
  script:
    - echo "=== Provision CK-RX65N BG96 OTA signer certificate ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/provision_rx65n_bg96_ota_signer"
      mkdir -p "$artifact_dir"
      actual_host="$(hostname)"
      if [ -n "${RX65N_BG96_RUNNER_HOSTNAME:-}" ] && ! printf '%s' "${actual_host}" | grep -Fq "${RX65N_BG96_RUNNER_HOSTNAME}"; then
        echo "This job must run on ${RX65N_BG96_RUNNER_HOSTNAME}*, but it was scheduled on ${actual_host}." >&2
        exit 1
      fi

      uart_port="${RX65N_BG96_UART_PORT:-${COMMAND_PORT:-}}"
      if [ -z "$uart_port" ] && [ -f artifacts/download_rx65n_bg96_app/selected_uart_port.txt ]; then
        uart_port="$(tr -d '\r\n' < artifacts/download_rx65n_bg96_app/selected_uart_port.txt)"
      fi
      if [ -z "$uart_port" ]; then
        echo "RX65N BG96 UART port was not selected." >&2
        exit 1
      fi

      rfp_tool="${RX65N_BG96_RFP_TOOL:-e2l:OBE110020}"
      if [ -n "${RX65N_BG96_OTA_CODE_SIGNING_CERT:-}" ]; then
        code_signer_cert="${RX65N_BG96_OTA_CODE_SIGNING_CERT}"
      elif [ -n "${AWS_IOT_CODE_SIGNING_CERT_PEM_FILE_CK_RX65N_01:-}" ]; then
        code_signer_cert="${AWS_IOT_CODE_SIGNING_CERT_PEM_FILE_CK_RX65N_01}"
      elif [ -n "${BG96_OTA_CODE_SIGNING_CERT:-}" ]; then
        code_signer_cert="${BG96_OTA_CODE_SIGNING_CERT}"
      else
        code_signer_cert="artifacts/build_rx65n_bg96_ota/bg96_ota_codesign_cert.pem"
      fi
      echo "Using RX65N BG96 OTA code signer certificate: ${code_signer_cert}"
      python3 tools/bg96_ota_prepare.py \
        --uart-port "${uart_port}" \
        --code-signer-cert "${code_signer_cert}" \
        --provision-cli-timeout "${RX65N_BG96_MQTT_PROVISION_CLI_TIMEOUT_SECONDS}" \
        --provision-char-delay "${RX65N_BG96_MQTT_PROVISION_CHAR_DELAY_SECONDS}" \
        --provision-line-delay "${RX65N_BG96_MQTT_PROVISION_LINE_DELAY_SECONDS}" \
        --rfp-cli "${RX65N_BG96_LINUX_RFP_CLI}" \
        --rfp-device "${RX65N_BG96_RFP_DEVICE}" \
        --rfp-tool "${rfp_tool}" \
        --rfp-interface "${RX65N_BG96_RFP_INTERFACE}" \
        --rfp-speed "${RX65N_BG96_RFP_SPEED}" \
        --rfp-auth-id "${RX65N_BG96_RFP_AUTH_ID}" \
        2>&1 | tee "$artifact_dir/provision_ota_signer.log"
      status="${PIPESTATUS[0]}"
      if [ "$status" -ne 0 ]; then
        exit "$status"
      fi
      touch "$artifact_dir/parked.ok"
  artifacts:
    when: always
    paths:
      - artifacts/provision_rx65n_bg96_ota_signer/
    expire_in: 7 days

create_rx65n_bg96_ota:
  stage: ota_create
  tags:
    - exec-shell
    - os-windows
    - ccrx
  extends:
    - .rx65n_bg96_ota_rules
  needs:
    - job: prepare_rx65n_bg96_mqtt_credentials
      artifacts: true
    - job: build_rx65n_bg96_ota
      artifacts: true
    - job: provision_rx65n_bg96_ota_signer
      artifacts: true
  script:
    - $ErrorActionPreference = "Stop"
    - |
      $artifactDir = Join-Path $env:CI_PROJECT_DIR "artifacts\create_rx65n_bg96_ota"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
      function Get-FirstEnv {
        param([string[]]$Names)
        foreach ($name in $Names) {
          $value = [Environment]::GetEnvironmentVariable($name)
          if (-not [string]::IsNullOrWhiteSpace($value)) {
            return $value
          }
        }
        return ""
      }
      function Require-Value {
        param([string]$Label, [string]$Value)
        if ([string]::IsNullOrWhiteSpace($Value)) {
          throw "$Label is required for RX65N BG96 OTA."
        }
        return $Value
      }
      function Resolve-AwsRegion {
        $configuredRegion = Get-FirstEnv @("AWS_DEFAULT_REGION", "AWS_REGION", "AWS_OTA_REGION_CK_RX65N_01", "BG96_OTA_REGION")
        if (-not [string]::IsNullOrWhiteSpace($configuredRegion)) {
          return $configuredRegion
        }
        $endpoint = Get-FirstEnv @("AWS_IOT_MQTT_BROKER_ENDPOINT_CK_RX65N_01", "BG96_AWS_IOT_ENDPOINT", "BG96_AWS_IOT_MQTT_BROKER_ENDPOINT", "BG96_MQTT_ENDPOINT", "BG96_MQTT_BROKER_ENDPOINT", "AWS_IOT_ENDPOINT", "AWS_IOT_MQTT_BROKER_ENDPOINT")
        if ($endpoint -match '\.iot\.([a-z0-9-]+)\.amazonaws\.com') {
          return $Matches[1]
        }
        throw "AWS region is required for RX65N BG96 OTA."
      }
      function Resolve-IamRoleArn {
        param([string]$RoleArn)
        if ($RoleArn -match '^arn:aws:iam::\d{12}:role\/.+') {
          return $RoleArn
        }
        if ($RoleArn -match '^\d{12}:role\/.+') {
          return "arn:aws:iam::$RoleArn"
        }
        throw "AWS OTA service role must be a full IAM role ARN or ACCOUNT_ID:role/NAME shorthand."
      }

      $credentialDir = Join-Path $env:CI_PROJECT_DIR "artifacts\prepare_rx65n_bg96_mqtt_credentials"
      $usingDynamicThing = $false
      $thingName = ""
      $thingPath = Join-Path $credentialDir "thing_name.txt"
      $dynamicMeta = Join-Path $credentialDir "iot_credentials_meta.json"
      if ($env:RX65N_BG96_TLS_BACKEND -ne "tsip" -and (Test-Path -LiteralPath $dynamicMeta) -and (Test-Path -LiteralPath $thingPath)) {
        $thingName = (Get-Content -LiteralPath $thingPath -Raw).Trim()
        $usingDynamicThing = $true
        Write-Host "Using temporary BG96 AWS IoT thing for OTA target: $thingName"
      }
      if ([string]::IsNullOrWhiteSpace($thingName)) {
        $thingName = Get-FirstEnv @("AWS_OTA_THING_NAME_CK_RX65N_01", "BG96_OTA_THING_NAME", "AWS_IOT_THING_NAME_CK_RX65N_01", "RX65N_BG96_AWS_IOT_THING_NAME", "BG96_AWS_IOT_THING_NAME", "BG96_MQTT_THING_NAME", "AWS_IOT_THING_NAME")
      }
      if ([string]::IsNullOrWhiteSpace($thingName)) {
        $thingPath = Join-Path $credentialDir "thing_name.txt"
        if (Test-Path -LiteralPath $thingPath) {
          $thingName = (Get-Content -LiteralPath $thingPath -Raw).Trim()
        }
      }

      $version = (Get-Content (Join-Path $env:CI_PROJECT_DIR "artifacts\build_rx65n_bg96_ota\version.txt") -Raw).Trim()
      $versionToken = $version -replace '\.', '_'
      $payload = Join-Path $env:CI_PROJECT_DIR "artifacts\build_rx65n_bg96_ota\bg96_${versionToken}_ota_payload.bin"
      $payloadSignature = Join-Path $env:CI_PROJECT_DIR "artifacts\build_rx65n_bg96_ota\bg96_${versionToken}_ota_payload.sig.der"
      $codeSignerCert = Join-Path $env:CI_PROJECT_DIR "artifacts\build_rx65n_bg96_ota\bg96_ota_codesign_cert.pem"
      if (-not (Test-Path -LiteralPath $payload)) { throw "RX65N BG96 OTA payload missing: $payload" }
      if (-not (Test-Path -LiteralPath $payloadSignature)) { throw "RX65N BG96 OTA payload signature missing: $payloadSignature" }
      if (-not (Test-Path -LiteralPath $codeSignerCert)) { throw "RX65N BG96 OTA code signer certificate missing: $codeSignerCert" }
      $parkMarker = Join-Path $env:CI_PROJECT_DIR "artifacts\provision_rx65n_bg96_ota_signer\parked.ok"
      if (-not (Test-Path -LiteralPath $parkMarker)) { throw "RX65N BG96 OTA signer provisioning marker missing: $parkMarker" }

      $region = Resolve-AwsRegion
      $thingName = Require-Value "AWS IoT thing name" $thingName
      $targetArn = if ($usingDynamicThing) { "" } else { Get-FirstEnv @("AWS_OTA_TARGET_ARN_CK_RX65N_01", "BG96_OTA_TARGET_ARN", "OTA_TARGET_ARN") }
      $bucket = Require-Value "AWS OTA S3 bucket" (Get-FirstEnv @("AWS_OTA_S3_BUCKET_CK_RX65N_01", "RX65N_BG96_OTA_S3_BUCKET", "BG96_AWS_OTA_S3_BUCKET", "BG96_OTA_S3_BUCKET", "OTA_S3_BUCKET"))
      $roleArn = Require-Value "AWS OTA service role ARN" (Get-FirstEnv @("AWS_OTA_SERVICE_ROLE_ARN_CK_RX65N_01", "RX65N_BG96_OTA_SERVICE_ROLE_ARN", "BG96_AWS_OTA_SERVICE_ROLE_ARN", "BG96_OTA_SERVICE_ROLE_ARN", "BG96_OTA_ROLE_ARN", "OTA_SERVICE_ROLE_ARN", "OTA_ROLE_ARN"))
      $roleArn = Resolve-IamRoleArn $roleArn

      $targetArgs = @()
      if (-not [string]::IsNullOrWhiteSpace($targetArn)) {
        $targetArgs = @("--target-arn", $targetArn)
      }

      python tools/create_bg96_ota_update.py `
        --artifact-dir "$artifactDir" `
        --thing-name "$thingName" `
        @targetArgs `
        --input-payload "$payload" `
        --file-version "$version" `
        --bucket "$bucket" `
        --custom-signature-der "$payloadSignature" `
        --code-signer-cert "$codeSignerCert" `
        --role-arn "$roleArn" `
        --region "$region" `
        --ota-id-prefix "rx65n-bg96-ota"
  artifacts:
    when: always
    paths:
      - artifacts/create_rx65n_bg96_ota/
    expire_in: 7 days

test_rx65n_bg96_ota:
  stage: ota_test
  extends:
    - .rx65n_bg96_linux_hw_job
    - .rx65n_bg96_ota_rules
  needs:
    - job: build_rx65n_bg96_ota
      artifacts: true
    - job: download_rx65n_bg96_app
      artifacts: true
    - job: create_rx65n_bg96_ota
      artifacts: true
  script:
    - echo "=== Verify CK-RX65N BG96 OTA ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/test_rx65n_bg96_ota"
      mkdir -p "$artifact_dir"
      version="$(tr -d '\r\n' < artifacts/build_rx65n_bg96_ota/version.txt)"
      actual_host="$(hostname)"
      if [ -n "${RX65N_BG96_RUNNER_HOSTNAME:-}" ] && ! printf '%s' "${actual_host}" | grep -Fq "${RX65N_BG96_RUNNER_HOSTNAME}"; then
        echo "This job must run on ${RX65N_BG96_RUNNER_HOSTNAME}*, but it was scheduled on ${actual_host}." >&2
        exit 1
      fi

      uart_port="${RX65N_BG96_UART_PORT:-${COMMAND_PORT:-}}"
      if [ -z "$uart_port" ] && [ -f artifacts/download_rx65n_bg96_app/selected_uart_port.txt ]; then
        uart_port="$(tr -d '\r\n' < artifacts/download_rx65n_bg96_app/selected_uart_port.txt)"
      fi
      if [ -z "$uart_port" ]; then
        echo "RX65N BG96 UART port was not selected." >&2
        exit 1
      fi

      rfp_tool="${RX65N_BG96_RFP_TOOL:-e2l:OBE110020}"
      python3 tools/bg96_ota_monitor.py \
        --uart-port "${uart_port}" \
        --expected-version "${version}" \
        --timeout "${RX65N_BG96_OTA_OBSERVE_TIMEOUT_SECONDS}" \
        --app-reset-retries "${RX65N_BG96_OTA_APP_RESET_RETRIES}" \
        --activate-reset-delay "${RX65N_BG96_OTA_ACTIVATE_RESET_DELAY_SECONDS}" \
        --rfp-cli "${RX65N_BG96_LINUX_RFP_CLI}" \
        --rfp-device "${RX65N_BG96_RFP_DEVICE}" \
        --rfp-tool "${rfp_tool}" \
        --rfp-interface "${RX65N_BG96_RFP_INTERFACE}" \
        --rfp-speed "${RX65N_BG96_RFP_SPEED}" \
        --rfp-auth-id "${RX65N_BG96_RFP_AUTH_ID}" \
        --raw-log "$artifact_dir/ota_uart_raw.log" \
        --summary-json "$artifact_dir/ota_summary.json" \
        2>&1 | tee "$artifact_dir/test_ota_console.log"
      status="${PIPESTATUS[0]}"
      exit "$status"
  artifacts:
    when: always
    paths:
      - artifacts/test_rx65n_bg96_ota/
    expire_in: 7 days

cleanup_rx65n_bg96_ota:
  stage: ota_cleanup
  tags:
    - exec-shell
    - os-windows
    - ccrx
  allow_failure: true
  rules:
    - if: '$RX65N_BG96_SKIP_HW_TESTS != "true" && $RX65N_BG96_TEST_SCOPE =~ /^(ota|full)$/'
      when: always
    - when: never
  dependencies:
    - create_rx65n_bg96_ota
  script:
    - $ErrorActionPreference = "Continue"
    - |
      $metaPath = Join-Path $env:CI_PROJECT_DIR "artifacts\create_rx65n_bg96_ota\ota_job_meta.json"
      if (-not (Test-Path -LiteralPath $metaPath)) {
        Write-Host "RX65N BG96 OTA metadata missing; cleanup skipped."
        exit 0
      }
      $meta = Get-Content -LiteralPath $metaPath -Raw | ConvertFrom-Json
      if ($meta.ota_update_id) {
        aws iot delete-ota-update --ota-update-id $meta.ota_update_id --delete-stream --force-delete-aws-job --region $meta.region
      }
      if ($meta.s3_bucket -and $meta.s3_key) {
        $deleteObjectArgs = @("s3api", "delete-object", "--bucket", $meta.s3_bucket, "--key", $meta.s3_key, "--region", $meta.region)
        if ($meta.s3_version) {
          $deleteObjectArgs += @("--version-id", $meta.s3_version)
        }
        aws @deleteObjectArgs
      }
  artifacts:
    when: always
    paths:
      - artifacts/create_rx65n_bg96_ota/
    expire_in: 7 days

cleanup_rx65n_bg96_mqtt_credentials:
  stage: credential_cleanup
  tags:
    - exec-shell
    - os-windows
    - ccrx
  resource_group: rx65n-bg96-aws-iot-credentials
  dependencies:
    - prepare_rx65n_bg96_mqtt_credentials
  allow_failure: true
  rules:
    - if: '$RX65N_BG96_SKIP_HW_TESTS != "true" && $RX65N_BG96_DYNAMIC_IOT_CREDENTIALS == "true" && $RX65N_BG96_TEST_SCOPE =~ /^(provision|mqtt|ota|full)$/'
      when: always
    - when: never
  script:
    - $ErrorActionPreference = "Continue"
    - |
      $artifactDir = Join-Path $env:CI_PROJECT_DIR "artifacts\prepare_rx65n_bg96_mqtt_credentials"
      $metaPath = Join-Path $artifactDir "iot_credentials_meta.json"
      $outPath = Join-Path $artifactDir "cleanup_summary.json"
      if (-not (Test-Path -LiteralPath $metaPath)) {
        Write-Host "Temporary BG96 credential metadata missing; cleanup skipped."
        exit 0
      }
      python tools/cleanup_bg96_iot_credentials.py `
        --meta-json "$metaPath" `
        --output-json "$outPath"
  artifacts:
    when: always
    paths:
      - artifacts/prepare_rx65n_bg96_mqtt_credentials/
    expire_in: 7 days

flash_rx72n_ether_fleet:
  stage: fleet_flash
  extends: .rx72n_linux_hw_job
  needs:
    - job: build_rx72n_ether_fleet
      artifacts: true
    - job: test_rx72n_ether_ota
      artifacts: true
      optional: true
  rules:
    - if: '($RUN_RX72N_FLEET_TESTS == "true" || $RX72N_TEST_SCOPE =~ /^(fleet|full)$/) && ($RX72N_TLS_BACKEND != "tsip" || $RX72N_TSIP_FLEET_ENABLE == "true") && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_FLEET_PROVISIONING_TEMPLATE_RX72N_02 && $AWS_FLEET_CLAIM_CERT_RX72N_02 && $AWS_FLEET_CLAIM_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - echo "=== Flash RX72N Fleet Provisioning image on Linux runner ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/flash_rx72n_ether_fleet"
      mkdir -p "$artifact_dir"
      reset_cmd="$RX72N_LINUX_RFP_CLI -device RX72x -tool $RX72N_LINUX_RFP_TOOL -if fine -speed $RFP_SPEED -auth id $RFP_AUTH -sig -run -noquery"

      "$RX72N_LINUX_RFP_CLI" -device RX72x -tool "$RX72N_LINUX_RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id "$RFP_AUTH" -erase-chip -noquery

      "$RX72N_LINUX_RFP_CLI" -device RX72x -tool "$RX72N_LINUX_RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id "$RFP_AUTH" \
        -p "$CI_PROJECT_DIR/Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/boot_loader_rx72n_envision_kit.mot" \
        -v -noquery

      "$RX72N_LINUX_RFP_CLI" -device RX72x -tool "$RX72N_LINUX_RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id "$RFP_AUTH" \
        -p "$CI_PROJECT_DIR/Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/boot_loader_rx72n_envision_kit_bank1.mot" \
        -v -noquery

      python tools/test_uart_download_rx72n.py \
        --rsu "$CI_PROJECT_DIR/rx72n_app.rsu" \
        --port "$RX72N_LINUX_UART_PORT" \
        --baud "$RX72N_LINUX_UART_BAUD_RATE" \
        --timeout 420 \
        --post-tx-wait 120 \
        --diag \
        --wait-for-ready \
        --ready-timeout 90 \
        --reset-cmd "$reset_cmd" \
        2>&1 | tee "$artifact_dir/flash_rx72n_fleet.log"
  artifacts:
    when: always
    paths:
      - artifacts/flash_rx72n_ether_fleet/
    expire_in: 7 days

provision_rx72n_ether_mqtt:
  stage: provision
  extends: .rx72n_linux_hw_job
  needs:
    - build_rx72n_ether
    - flash_rx72n_ether
  rules:
    - if: '$RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE =~ /^(mqtt|ota|full)$/ && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$CI_COMMIT_TAG && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "api" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_OTA_TESTS == "true" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_HW_TESTS == "true" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - echo "=== Provision RX72N AWS IoT credentials on Linux runner ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/provision_rx72n_ether_mqtt"
      mkdir -p "$artifact_dir"
      reset_cmd="$RX72N_LINUX_RFP_CLI -device RX72x -tool $RX72N_LINUX_RFP_TOOL -if fine -speed $RFP_SPEED -auth id $RFP_AUTH -sig -run -noquery"

      shadow_args=()
      if [ -n "${RX72N_LINUX_COMMAND_PORT:-}" ]; then
        shadow_args+=(--shadow-port "$RX72N_LINUX_COMMAND_PORT" --shadow-baud "$RX72N_LINUX_COMMAND_BAUD_RATE" --shadow-name cn8)
      fi

      provision_args=(
        --port "$RX72N_LINUX_UART_PORT"
        --baud "$RX72N_LINUX_UART_BAUD_RATE"
        --thing-name "$RX72N_DEVICE_ID"
        --endpoint "$AWS_IOT_ENDPOINT"
        --cert "$AWS_CLIENT_CERT_RX72N_02"
        --key "$AWS_PRIVATE_KEY_RX72N_02"
        --codesigner-cert "$CI_PROJECT_DIR/rx72n_codesign_cert.pem"
        --format
        --reset-cmd "$reset_cmd"
        --reset-after-open
        --boot-wait 12
        --cli-timeout 25
        --attempts 3
      )
      if [ "${RX72N_TLS_BACKEND}" = "tsip" ]; then
        provision_args+=(--skip-private-key --no-reset)
      fi

      python tools/provision_rx72n.py "${provision_args[@]}" "${shadow_args[@]}" \
        2>&1 | tee "$artifact_dir/provision_rx72n.log"
      status="${PIPESTATUS[0]}"
      if [ "$status" -ne 0 ]; then
        exit "$status"
      fi

      if [ "${RX72N_TLS_BACKEND}" = "tsip" ]; then
        python tools/provision_tsip_over_uart.py \
          --target rx72n \
          --port "$RX72N_LINUX_UART_PORT" \
          --baud "$RX72N_LINUX_UART_BAUD_RATE" \
          --chunk-size "${RX72N_TSIP_PROVISION_CHUNK_SIZE}" \
          --timeout "${RX72N_TSIP_PROVISION_TIMEOUT_SECONDS}" \
          --no-enter-cli \
          --reset-after \
          2>&1 | tee "$artifact_dir/provision_tsip.log"
        status="${PIPESTATUS[0]}"
      fi
      exit "$status"
  artifacts:
    when: always
    paths:
      - artifacts/provision_rx72n_ether_mqtt/
    expire_in: 7 days

