        --app-startup-timeout "${RX65N_BG96_APP_STARTUP_TIMEOUT_SECONDS}" \
        --mqtt-timeout "${RX65N_BG96_MQTT_TIMEOUT_SECONDS}" \
        --app-reset-retries "${RX65N_BG96_APP_RESET_RETRIES}" \
        "${tls_version_args[@]}" \
        --rfp-cli "${RX65N_BG96_LINUX_RFP_CLI}" \
        --rfp-device "${RX65N_BG96_RFP_DEVICE}" \
        --rfp-tool "${rfp_tool}" \
        --rfp-interface "${RX65N_BG96_RFP_INTERFACE}" \
        --rfp-speed "${RX65N_BG96_RFP_SPEED}" \
        --rfp-auth-id "${RX65N_BG96_RFP_AUTH_ID}" \
