stages:
  - build
  - flash
  - provision
  - test
  - package
  - ota_build
  - ota_create
  - ota_test

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "core.longpaths"
  GIT_CONFIG_VALUE_0: "true"
  E2STUDIO_CLI: "C:/Renesas/e2_studio_2025_12/eclipse/e2studioc.exe"
  E2STUDIO_WORKSPACE: "C:/Temp/e2ws_iot_ref_rx72n"
  RFP_CLI: "C:/Program Files (x86)/Renesas Electronics/Programming Tools/Renesas Flash Programmer V3.22/rfp-cli.exe"
  RFP_SPEED: "1500K"
  RFP_AUTH: "FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF"
  RFP_TOOL: "e2l"
  UART_PORT: "COM7"
  UART_BAUD_RATE: "921600"
  RX72N_SIGNING_KEY: "sample_keys/secp256r1.privatekey"
  RX72N_DEVICE_ID: "rx72n-02"
  RUN_RX72N_HW_TESTS: "false"
  RUN_RX72N_OTA_TESTS: "false"
  RX72N_HW_RUNNER_PLATFORM: "linux"
  RX72N_DEVICE_RESOURCE_GROUP: "rx72n-device-02"
  RX72N_LINUX_RFP_CLI: "rfp-cli"
  RX72N_LINUX_RFP_TOOL: "e2l"
  RX72N_LINUX_UART_PORT: "${UART_PORT_ENVISION_KIT_RX72N_CN6_RPI2}"
  RX72N_LINUX_COMMAND_PORT: "${UART_PORT_ENVISION_KIT_RX72N_CN8_RPI2}"
  RX72N_LINUX_UART_BAUD_RATE: "921600"
  RX72N_LINUX_COMMAND_BAUD_RATE: "115200"
  RX72N_OTA_CANDIDATE_VERSION: "0.9.3"
  RX72N_OTA_OBSERVE_TIMEOUT: "420"
  AWS_DEFAULT_REGION: "ap-northeast-1"
  E2STUDIO_WORKSPACE_OTA: "C:/Temp/e2ws_iot_ref_rx72n_ota"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
      when: always
    - if: $CI_MERGE_REQUEST_IID
      when: always

build_rx72n:
  stage: build
  tags:
    - run_ishiguro_machine
  script:
    - Write-Host "=== Build RX72N projects ==="
    - pip install cryptography --quiet
    - |
      & "$env:CI_PROJECT_DIR\tools\build_headless_rx72n.ps1" `
        -ProjectRoot "$env:CI_PROJECT_DIR" `
        -E2Studio "$env:E2STUDIO_CLI" `
        -Workspace "$env:E2STUDIO_WORKSPACE" `
        -LogFile "$env:CI_PROJECT_DIR\rx72n_e2studio_build.log"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot")) { Write-Error "boot_loader .mot missing"; exit 1 }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.mot")) { Write-Error "app .mot missing"; exit 1 }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.abs")) { Write-Error "app .abs missing"; exit 1 }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.x")) { Write-Error "app .x missing"; exit 1 }
    - |
      python "$env:CI_PROJECT_DIR\tools\build_fwup_v2_rsu.py" `
        --mot "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.mot" `
        --prm "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\src\smc_gen\r_fwup\tool\RX72N_DualBank_ImageGenerator_PRM.csv" `
        --key "$env:CI_PROJECT_DIR\$env:RX72N_SIGNING_KEY" `
        --output "$env:CI_PROJECT_DIR\rx72n_app.rsu"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\rx72n_app.rsu")) { Write-Error "rx72n_app.rsu missing"; exit 1 }
    - |
      python "$env:CI_PROJECT_DIR\tools\generate_signer_cert.py" `
        --key "$env:CI_PROJECT_DIR\$env:RX72N_SIGNING_KEY" `
        --out "$env:CI_PROJECT_DIR\rx72n_codesign_cert.pem"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\rx72n_codesign_cert.pem")) { Write-Error "rx72n_codesign_cert.pem missing"; exit 1 }
    - Write-Host "BUILD SUCCESS"
  artifacts:
    when: always
    paths:
      - rx72n_e2studio_build.log
      - rx72n_app.rsu
      - rx72n_codesign_cert.pem
      - Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 7 days

.rx72n_linux_hw_job:
  tags:
    - exec-shell
    - os-linux
    - hw-raspi
    - dev-rx72n-02
  resource_group: $RX72N_DEVICE_RESOURCE_GROUP
  before_script:
    - set -o pipefail
    - python3 -m venv .venv-pi
    - source .venv-pi/bin/activate
    - python -m pip install --quiet pyserial cryptography

flash_rx72n_linux:
  stage: flash
  extends: .rx72n_linux_hw_job
  needs:
    - build_rx72n
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_OTA_TESTS == "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_HW_TESTS == "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - echo "=== Flash RX72N boot_loader and download app RSU on Linux runner ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/flash_rx72n_linux"
      mkdir -p "$artifact_dir"
      reset_cmd="$RX72N_LINUX_RFP_CLI -device RX72x -tool $RX72N_LINUX_RFP_TOOL -if fine -speed $RFP_SPEED -auth id $RFP_AUTH -sig -run -noquery"

      "$RX72N_LINUX_RFP_CLI" -device RX72x -tool "$RX72N_LINUX_RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id "$RFP_AUTH" -erase-chip -noquery

      "$RX72N_LINUX_RFP_CLI" -device RX72x -tool "$RX72N_LINUX_RFP_TOOL" -if fine -speed "$RFP_SPEED" \
        -auth id "$RFP_AUTH" \
        -p "$CI_PROJECT_DIR/Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/boot_loader_rx72n_envision_kit.mot" \
        -v -run -noquery

      python tools/test_uart_download_rx72n.py \
        --rsu "$CI_PROJECT_DIR/rx72n_app.rsu" \
        --port "$RX72N_LINUX_UART_PORT" \
        --baud "$RX72N_LINUX_UART_BAUD_RATE" \
        --timeout 420 \
        --post-tx-wait 120 \
        --diag \
        --wait-for-ready \
        --ready-timeout 90 \
        --reset-cmd "$reset_cmd" \
        2>&1 | tee "$artifact_dir/flash_rx72n.log"
  artifacts:
    when: always
    paths:
      - artifacts/flash_rx72n_linux/
    expire_in: 7 days

provision_rx72n_linux:
  stage: provision
  extends: .rx72n_linux_hw_job
  needs:
    - build_rx72n
    - flash_rx72n_linux
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_OTA_TESTS == "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_HW_TESTS == "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - echo "=== Provision RX72N AWS IoT credentials on Linux runner ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/provision_rx72n_linux"
      mkdir -p "$artifact_dir"
      reset_cmd="$RX72N_LINUX_RFP_CLI -device RX72x -tool $RX72N_LINUX_RFP_TOOL -if fine -speed $RFP_SPEED -auth id $RFP_AUTH -sig -run -noquery"

      shadow_args=()
      if [ -n "${RX72N_LINUX_COMMAND_PORT:-}" ]; then
        shadow_args+=(--shadow-port "$RX72N_LINUX_COMMAND_PORT" --shadow-baud "$RX72N_LINUX_COMMAND_BAUD_RATE" --shadow-name cn8)
      fi

      python tools/provision_rx72n.py \
        --port "$RX72N_LINUX_UART_PORT" \
        --baud "$RX72N_LINUX_UART_BAUD_RATE" \
        --thing-name "$RX72N_DEVICE_ID" \
        --endpoint "$AWS_IOT_ENDPOINT" \
        --cert "$AWS_CLIENT_CERT_RX72N_02" \
        --key "$AWS_PRIVATE_KEY_RX72N_02" \
        --codesigner-cert "$CI_PROJECT_DIR/rx72n_codesign_cert.pem" \
        --format \
        --reset-cmd "$reset_cmd" \
        --reset-after-open \
        --boot-wait 12 \
        --cli-timeout 25 \
        --attempts 3 \
        "${shadow_args[@]}" \
        2>&1 | tee "$artifact_dir/provision_rx72n.log"
  artifacts:
    when: always
    paths:
      - artifacts/provision_rx72n_linux/
    expire_in: 7 days

test_mqtt_rx72n_linux:
  stage: test
  extends: .rx72n_linux_hw_job
  needs:
    - build_rx72n
    - flash_rx72n_linux
    - provision_rx72n_linux
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_OTA_TESTS == "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_HW_TESTS == "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - echo "=== Verify RX72N MQTT baseline on Linux runner ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/test_mqtt_rx72n_linux"
      mkdir -p "$artifact_dir"
      python -m serial.tools.list_ports -v 2>&1 | tee "$artifact_dir/serial_ports.txt"
      reset_cmd="$RX72N_LINUX_RFP_CLI -device RX72x -tool $RX72N_LINUX_RFP_TOOL -if fine -speed $RFP_SPEED -auth id $RFP_AUTH -sig -run -noquery"

      python tools/test_mqtt_rx72n.py \
        --log-port "$RX72N_LINUX_UART_PORT" \
        --log-baud "$RX72N_LINUX_UART_BAUD_RATE" \
        --timeout 180 \
        --reset-cmd "$reset_cmd" \
        2>&1 | tee "$artifact_dir/test_mqtt_rx72n.log"
  artifacts:
    when: always
    paths:
      - artifacts/test_mqtt_rx72n_linux/
    expire_in: 7 days

flash_rx72n:
  stage: flash
  tags:
    - run_ishiguro_machine
  resource_group: rx72n-envision-kit-local
  needs:
    - build_rx72n
  rules:
    - if: '$RUN_RX72N_HW_TESTS == "true" && $RX72N_HW_RUNNER_PLATFORM == "windows" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Flash RX72N boot_loader and download app RSU ==="
    - pip install pyserial --quiet
    - if (-not $env:RFP_TOOL) { Write-Error "RFP_TOOL not set"; exit 1 }
    - |
      $artifactDir = "$env:CI_PROJECT_DIR\artifacts\flash_rx72n"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
      $resetCmd = '"{0}" -device RX72x -tool {1} -if fine -speed {2} -auth id {3} -sig -run -noquery' -f `
        $env:RFP_CLI, $env:RFP_TOOL, $env:RFP_SPEED, $env:RFP_AUTH

      & "$env:RFP_CLI" -device RX72x -tool $env:RFP_TOOL -if fine -speed $env:RFP_SPEED `
        -auth id $env:RFP_AUTH -erase-chip -noquery
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      & "$env:RFP_CLI" -device RX72x -tool $env:RFP_TOOL -if fine -speed $env:RFP_SPEED `
        -auth id $env:RFP_AUTH `
        -p "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot" `
        -v -run -noquery
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      python tools/test_uart_download_rx72n.py `
        --rsu "$env:CI_PROJECT_DIR\rx72n_app.rsu" `
        --port $env:UART_PORT `
        --baud $env:UART_BAUD_RATE `
        --timeout 420 `
        --post-tx-wait 120 `
        --diag `
        --wait-for-ready `
        --ready-timeout 90 `
        --reset-cmd $resetCmd `
        2>&1 | Tee-Object -FilePath "$artifactDir\flash_rx72n.log"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    paths:
      - artifacts/flash_rx72n/
    expire_in: 7 days

provision_rx72n:
  stage: provision
  tags:
    - run_ishiguro_machine
  resource_group: rx72n-envision-kit-local
  needs:
    - build_rx72n
    - flash_rx72n
  rules:
    - if: '$RUN_RX72N_HW_TESTS == "true" && $RX72N_HW_RUNNER_PLATFORM == "windows" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Provision RX72N AWS IoT credentials ==="
    - pip install pyserial --quiet
    - if (-not $env:RX72N_DEVICE_ID) { Write-Error "RX72N_DEVICE_ID not set"; exit 1 }
    - if (-not $env:AWS_IOT_ENDPOINT) { Write-Error "AWS_IOT_ENDPOINT not set"; exit 1 }
    - if (-not $env:AWS_CLIENT_CERT_RX72N_02) { Write-Error "AWS_CLIENT_CERT_RX72N_02 not set"; exit 1 }
    - if (-not $env:AWS_PRIVATE_KEY_RX72N_02) { Write-Error "AWS_PRIVATE_KEY_RX72N_02 not set"; exit 1 }
    - |
      $artifactDir = "$env:CI_PROJECT_DIR\artifacts\provision_rx72n"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
      $resetCmd = '"{0}" -device RX72x -tool {1} -if fine -speed {2} -auth id {3} -sig -run -noquery' -f `
        $env:RFP_CLI, $env:RFP_TOOL, $env:RFP_SPEED, $env:RFP_AUTH

      python tools/provision_rx72n.py `
        --port $env:UART_PORT `
        --baud $env:UART_BAUD_RATE `
        --thing-name $env:RX72N_DEVICE_ID `
        --endpoint $env:AWS_IOT_ENDPOINT `
        --cert $env:AWS_CLIENT_CERT_RX72N_02 `
        --key $env:AWS_PRIVATE_KEY_RX72N_02 `
        --codesigner-cert "$env:CI_PROJECT_DIR\rx72n_codesign_cert.pem" `
        --format `
        --reset-cmd $resetCmd `
        --reset-after-open `
        --boot-wait 12 `
        --cli-timeout 25 `
        2>&1 | Tee-Object -FilePath "$artifactDir\provision_rx72n.log"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    paths:
      - artifacts/provision_rx72n/
    expire_in: 7 days

test_mqtt_rx72n:
  stage: test
  tags:
    - run_ishiguro_machine
  resource_group: rx72n-envision-kit-local
  needs:
    - build_rx72n
    - flash_rx72n
    - provision_rx72n
  rules:
    - if: '$RUN_RX72N_HW_TESTS == "true" && $RX72N_HW_RUNNER_PLATFORM == "windows" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Verify RX72N MQTT baseline ==="
    - pip install pyserial --quiet
    - |
      $artifactDir = "$env:CI_PROJECT_DIR\artifacts\test_mqtt_rx72n"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
      python -m serial.tools.list_ports -v 2>&1 | Tee-Object -FilePath "$artifactDir\serial_ports.txt"
      $resetCmd = '"{0}" -device RX72x -tool {1} -if fine -speed {2} -auth id {3} -sig -run -noquery' -f `
        $env:RFP_CLI, $env:RFP_TOOL, $env:RFP_SPEED, $env:RFP_AUTH

      python tools/test_mqtt_rx72n.py `
        --log-port $env:UART_PORT `
        --log-baud $env:UART_BAUD_RATE `
        --timeout 180 `
        --reset-cmd $resetCmd `
        2>&1 | Tee-Object -FilePath "$artifactDir\test_mqtt_rx72n.log"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    paths:
      - artifacts/test_mqtt_rx72n/
    expire_in: 7 days

build_rx72n_mqtt_candidate:
  stage: build
  tags:
    - run_ishiguro_machine
  rules:
    - if: '$AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Build RX72N MQTT candidate ==="
    - |
      & "$env:CI_PROJECT_DIR\tools\build_headless_rx72n_with_client_credentials.ps1" `
        -ProjectRoot "$env:CI_PROJECT_DIR" `
        -ThingName "$env:RX72N_DEVICE_ID" `
        -Endpoint "$env:AWS_IOT_ENDPOINT" `
        -CertInput "$env:AWS_CLIENT_CERT_RX72N_02" `
        -KeyInput "$env:AWS_PRIVATE_KEY_RX72N_02" `
        -LogFile "$env:CI_PROJECT_DIR\rx72n_e2studio_build_mqtt_candidate.log"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot")) { Write-Error "boot_loader .mot missing"; exit 1 }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.mot")) { Write-Error "app .mot missing"; exit 1 }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.abs")) { Write-Error "app .abs missing"; exit 1 }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\aws_ether_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\aws_ether_rx72n_envision_kit.x")) { Write-Error "app .x missing"; exit 1 }
    - Write-Host "BUILD MQTT CANDIDATE SUCCESS"
  artifacts:
    when: always
    paths:
      - rx72n_e2studio_build_mqtt_candidate.log
      - Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 1 day

package_rx72n_mqtt_candidate_rsu:
  stage: package
  tags:
    - run_ishiguro_machine
  needs:
    - job: build_rx72n_mqtt_candidate
      artifacts: true
  rules:
    - if: '$AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Package RX72N MQTT candidate RSU ==="
    - pip install cryptography --quiet
    - |
      & "$env:CI_PROJECT_DIR\tools\generate_rx72n_rsu.ps1" `
        -ProjectRoot "$env:CI_PROJECT_DIR" `
        -Output "$env:CI_PROJECT_DIR\artifacts\rx72n_mqtt_candidate.rsu"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\artifacts\rx72n_mqtt_candidate.rsu")) { Write-Error "RSU missing"; exit 1 }
    - Write-Host "PACKAGE MQTT CANDIDATE SUCCESS"
  artifacts:
    paths:
      - artifacts/rx72n_mqtt_candidate.rsu
      - Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 1 day

build_rx72n_ota_candidate:
  stage: ota_build
  allow_failure: true
  tags:
    - run_ishiguro_machine
  needs:
    - test_mqtt_rx72n_linux
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_OTA_TESTS == "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Build RX72N OTA candidate ==="
    - pip install cryptography --quiet
    - |
      $artifactDir = "$env:CI_PROJECT_DIR\artifacts\rx72n_ota_candidate"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

      if (-not $env:RX72N_OTA_CANDIDATE_VERSION) { Write-Error "RX72N_OTA_CANDIDATE_VERSION not set"; exit 1 }
      $signingKey = $env:RX72N_OTA_SIGNING_KEY
      if (-not $signingKey) {
        $signingKey = "$env:CI_PROJECT_DIR\$env:RX72N_SIGNING_KEY"
        Write-Host "RX72N_OTA_SIGNING_KEY not set; using RX72N_SIGNING_KEY path: $signingKey"
      }
      if (-not (Test-Path $signingKey)) { Write-Error "OTA signing key not found: $signingKey"; exit 1 }

      $versionUnderscore = $env:RX72N_OTA_CANDIDATE_VERSION -replace '\.', '_'
      $candidatePrefix = "$artifactDir\$env:RX72N_DEVICE_ID" + "_" + $versionUnderscore
      $candidateCodeSignCert = "$artifactDir\$env:RX72N_DEVICE_ID" + "_codesign_cert.pem"

      python tools/build_ota_candidate.py `
        --repo-root "$env:CI_PROJECT_DIR" `
        --version "$env:RX72N_OTA_CANDIDATE_VERSION" `
        --output-prefix "$candidatePrefix" `
        --signing-key "$signingKey" `
        --e2studio-cli "$env:E2STUDIO_CLI" `
        --workspace "$env:E2STUDIO_WORKSPACE_OTA" `
        --code-sign-cert-out "$candidateCodeSignCert" `
        2>&1 | Tee-Object -FilePath "$artifactDir\build_ota_candidate.log"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      $candidateRsu = "$candidatePrefix.rsu"
      if (-not (Test-Path $candidateRsu)) { Write-Error "OTA candidate .rsu missing: $candidateRsu"; exit 1 }
      if (-not (Test-Path $candidateCodeSignCert)) { Write-Error "OTA code-sign cert missing: $candidateCodeSignCert"; exit 1 }
      Write-Host "OTA candidate: $candidateRsu"
  artifacts:
    when: always
    paths:
      - artifacts/rx72n_ota_candidate/
      - Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 1 day

test_ota_rx72n_linux:
  stage: ota_test
  allow_failure: true
  extends: .rx72n_linux_hw_job
  needs:
    - job: build_rx72n_ota_candidate
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_OTA_TESTS == "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - when: never
  script:
    - echo "=== Verify RX72N OTA over MQTT on Linux runner ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/test_ota_rx72n_linux"
      ota_artifact_dir="$CI_PROJECT_DIR/artifacts/rx72n_ota"
      mkdir -p "$artifact_dir"
      mkdir -p "$ota_artifact_dir"
      python -m serial.tools.list_ports -v 2>&1 | tee "$artifact_dir/serial_ports.txt"

      reset_cmd="$RX72N_LINUX_RFP_CLI -device RX72x -tool $RX72N_LINUX_RFP_TOOL -if fine -speed $RFP_SPEED -auth id $RFP_AUTH -sig -run -noquery"
      ota_role_arn="$AWS_OTA_SERVICE_ROLE_ARN_RX72N_02"
      if [[ -n "$ota_role_arn" && "$ota_role_arn" != arn:* ]]; then
        ota_role_arn="arn:aws:iam::$ota_role_arn"
      fi

      cat > "$artifact_dir/create_rx72n_ota_update.sh" <<'SCRIPT'
      #!/usr/bin/env bash
      set -euo pipefail

      version_underscore="${RX72N_OTA_CANDIDATE_VERSION//./_}"
      candidate_rsu="$CI_PROJECT_DIR/artifacts/rx72n_ota_candidate/${RX72N_DEVICE_ID}_${version_underscore}.rsu"
      if [[ ! -f "$candidate_rsu" ]]; then
        echo "OTA candidate .rsu missing: $candidate_rsu" >&2
        exit 1
      fi

      python tools/create_ota_update.py \
        --artifact-dir "$OTA_ARTIFACT_DIR" \
        --thing-name "$RX72N_DEVICE_ID" \
        --input-rsu "$candidate_rsu" \
        --file-version "$RX72N_OTA_CANDIDATE_VERSION" \
        --bucket "$AWS_OTA_S3_BUCKET_RX72N_02" \
        --signing-profile "$AWS_OTA_SIGNING_PROFILE_RX72N_02" \
        --role-arn "$OTA_ROLE_ARN_FOR_TRIGGER" \
        --region "$AWS_DEFAULT_REGION" \
        --ota-id-prefix "${RX72N_DEVICE_ID}-ota"
      SCRIPT
      chmod +x "$artifact_dir/create_rx72n_ota_update.sh"

      OTA_ARTIFACT_DIR="$ota_artifact_dir" \
      OTA_ROLE_ARN_FOR_TRIGGER="$ota_role_arn" \
        python tools/test_ota.py \
        --port "$RX72N_LINUX_UART_PORT" \
        --baud "$RX72N_LINUX_UART_BAUD_RATE" \
        --timeout "$RX72N_OTA_OBSERVE_TIMEOUT" \
        --expected-version "$RX72N_OTA_CANDIDATE_VERSION" \
        --reset-cmd "$reset_cmd" \
        --reset-after-open \
        --no-reset \
        --trigger-command "$artifact_dir/create_rx72n_ota_update.sh" \
        --trigger-marker waiting_for_job \
        --trigger-log "$artifact_dir/create_ota_console.log" \
        --raw-log "$artifact_dir/ota_uart_raw.log" \
        --summary-json "$artifact_dir/ota_summary.json" \
        2>&1 | tee "$artifact_dir/test_ota_console.log"

      if [ "${PIPESTATUS[0]}" -ne 0 ]; then
        exit "${PIPESTATUS[0]}"
      fi

  artifacts:
    when: always
    paths:
      - artifacts/rx72n_ota/
      - artifacts/test_ota_rx72n_linux/
    expire_in: 7 days
