      when: on_success
    - when: never
  script:
    - echo "=== Verify RX72N OTA over MQTT on Linux runner ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/test_ota_rx72n_linux"
      mkdir -p "$artifact_dir"
      python -m serial.tools.list_ports -v 2>&1 | tee "$artifact_dir/serial_ports.txt"

      reset_cmd="$RX72N_LINUX_RFP_CLI -device RX72x -tool $RX72N_LINUX_RFP_TOOL -if fine -speed $RFP_SPEED -auth id $RFP_AUTH -sig -run -noquery"

      python tools/test_ota.py \
        --port "$RX72N_LINUX_UART_PORT" \
        --baud "$RX72N_LINUX_UART_BAUD_RATE" \
        --timeout "$RX72N_OTA_OBSERVE_TIMEOUT" \
        --expected-version "$RX72N_OTA_CANDIDATE_VERSION" \
        --reset-cmd "$reset_cmd" \
        --reset-after-open \
        --no-reset \
        --raw-log "$artifact_dir/ota_uart_raw.log" \
