workflow:
  rules:
    - if: '($CI_DEBUG_TRACE =~ /(?i)^(t|true|\+?0*1)$/ || $CI_DEBUG_SERVICES =~ /(?i)^(t|true|\+?0*1)$/)'
      when: never
    - if: '$CI_COMMIT_BRANCH == "codex/207-rpi4-same-project-token-probe" && $CI_PIPELINE_SOURCE == "api" && $PAIR_TOKEN_PROBE == "parent"'
    - if: '$CI_COMMIT_BRANCH == "codex/207-rpi4-same-project-token-probe" && $CI_PIPELINE_SOURCE == "pipeline" && $PAIR_TOKEN_PROBE == "child"'
    - when: never
stages: [test]
variables:
  GIT_STRATEGY: empty
  GIT_SUBMODULE_STRATEGY: none

same_project_token_parent:
  stage: test
  tags: [exec-shell, os-linux, ef-saffti-001-rpi-linux-004]
  timeout: 5 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $PAIR_TOKEN_PROBE == "parent"'
    - when: never
  script:
    - |
      python3 - <<'PY'
      import json, os, urllib.error, urllib.parse, urllib.request
      branch = 'codex/207-rpi4-same-project-token-probe'
      if (os.environ.get('CI_PROJECT_ID') != '38' or os.environ.get('CI_RUNNER_ID') != '26'
          or os.environ.get('CI_COMMIT_BRANCH') != branch or os.environ.get('CI_PIPELINE_SOURCE') != 'api'
          or os.environ.get('CI_API_V4_URL') != 'https://gitlab.saffti.jp/api/v4'):
          raise SystemExit('unexpected parent execution identity')
      token = os.environ.get('CI_JOB_TOKEN')
      if not token:
          raise SystemExit('job token unavailable')
      fields = {'ref': branch, 'variables[PAIR_TOKEN_PROBE]': 'child',
                'variables[PAIR_PARENT_SHA]': os.environ['CI_COMMIT_SHA'],
                'variables[PAIR_PARENT_PIPELINE]': os.environ['CI_PIPELINE_ID']}
      request = urllib.request.Request('https://gitlab.saffti.jp/api/v4/projects/38/trigger/pipeline',
          data=urllib.parse.urlencode(fields).encode('ascii'),
          headers={'JOB-TOKEN': token}, method='POST')
      try:
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.load(response)
      except urllib.error.HTTPError as error:
          print('trigger_http_status=' + str(error.code), flush=True)
          raise SystemExit('same-project token trigger rejected') from None
      except Exception as error:
          print('trigger_error_type=' + type(error).__name__, flush=True)
          raise SystemExit('trigger outcome may be unknown; do not retry blindly') from None
      safe = {name: result.get(name) for name in ('id', 'project_id', 'sha', 'ref', 'source', 'status')}
      print('child_pipeline=' + json.dumps(safe, sort_keys=True), flush=True)
      if (safe['project_id'] != 38 or safe['ref'] != branch or safe['sha'] != os.environ['CI_COMMIT_SHA']
          or safe['source'] != 'pipeline' or not isinstance(safe['id'], int)):
          raise SystemExit('downstream identity mismatch')
      PY

same_project_token_child:
  stage: test
  tags: [exec-shell, os-linux, ef-saffti-001-rpi-linux-004]
  timeout: 5 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $PAIR_TOKEN_PROBE == "child"'
    - when: never
  script:
    - |
      python3 - <<'PY'
      import hashlib, os
      if (os.environ.get('CI_PROJECT_ID') != '38' or os.environ.get('CI_RUNNER_ID') != '26'
          or os.environ.get('CI_PIPELINE_SOURCE') != 'pipeline'
          or os.environ.get('CI_COMMIT_BRANCH') != 'codex/207-rpi4-same-project-token-probe'
          or os.environ.get('CI_COMMIT_SHA') != os.environ.get('PAIR_PARENT_SHA')
          or not os.environ.get('PAIR_PARENT_PIPELINE', '').isdigit()):
          raise SystemExit('unexpected child execution identity')
      print('public_dummy_sha256=' + hashlib.sha256(b'public-same-project-trigger-v1\n').hexdigest())
      print('parent_pipeline=' + os.environ['PAIR_PARENT_PIPELINE'])
      PY
