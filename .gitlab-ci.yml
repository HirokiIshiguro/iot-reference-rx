# One-shot candidate, gated to one protected ref and manual controller.
# Review and explicitly approve before any pipeline is created or played.
include:
  - project: oss/infra/hardware-config
    ref: f26789f1b61645b7c5aad9d7e5e9f52c933b18e9
    file: /templates/windows_ccrx_host_lease.yml

workflow:
  rules:
    - if: '$CI_DEBUG_TRACE =~ /(?i)^(t|true|\+?0*1)$/ || $CI_DEBUG_SERVICES =~ /(?i)^(t|true|\+?0*1)$/'
      when: never
    - if: '$CI_PROJECT_ID == "38" && $CI_COMMIT_BRANCH == "codex/209-rpi4-transport-once-20261115" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $IDT_PAIR_MODE == "transport-controller"'
      when: always
    - if: '$CI_PROJECT_ID == "38" && $CI_COMMIT_BRANCH == "codex/209-rpi4-transport-once-20261115" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "pipeline" && $IDT_PAIR_MODE == "transport"'
      when: always
    - when: never

stages: [build, run]

variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: normal
  GIT_CONFIG_COUNT: "4"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"
  GIT_CONFIG_KEY_1: core.autocrlf
  GIT_CONFIG_VALUE_1: "false"
  GIT_CONFIG_KEY_2: core.eol
  GIT_CONFIG_VALUE_2: lf
  GIT_CONFIG_KEY_3: core.symlinks
  GIT_CONFIG_VALUE_3: "false"
  E2STUDIO_CLI: "C:/Renesas/e2_studio_2026_04_2/eclipse/e2studio-cli.exe"
  E2STUDIO_WORKSPACE: "C:/ai/codex/ws/ci-rx72n-ether-${CI_PIPELINE_ID}-${CI_JOB_ID}"
  WINDOWS_CCRX_BUILD_RESOURCE_GROUP: "ishiguro-pc-ccrx-e2studio-build"
  RX72N_E2STUDIO_TIMEOUT_SECONDS: "1200"
  RX72N_SIGNING_KEY: "sample_keys/secp256r1.privatekey"
  RX72N_TLS_BACKEND: "software"
  RX72N_REQUIRE_TLS_VERSION: ""
  RX72N_TLS13_0RTT_ENABLE: "false"
  RX72N_BUILD_RUNNER_TAG: "hw-ishiguro-pc"

.rx_windows_canonical_checkout:
  variables:
    GIT_STRATEGY: "clone"
    GIT_CONFIG_COUNT: "3"
    GIT_CONFIG_KEY_0: "core.longpaths"
    GIT_CONFIG_VALUE_0: "true"
    GIT_CONFIG_KEY_1: "core.autocrlf"
    GIT_CONFIG_VALUE_1: "false"
    GIT_CONFIG_KEY_2: "core.eol"
    GIT_CONFIG_VALUE_2: "lf"


build_rx72n_ether:
  timeout: 3 hours
  extends: .rx_windows_canonical_checkout
  stage: build
  tags:
    - exec-shell
    - os-windows
    - ccrx
    - $RX72N_BUILD_RUNNER_TAG
  resource_group: $WINDOWS_CCRX_BUILD_RESOURCE_GROUP
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $IDT_PAIR_MODE == "transport-controller"'
      when: manual
      allow_failure: false
    - when: never
  before_script:
    - |
      foreach ($entry in @(Get-ChildItem Env:)) {
        if ($entry.Name -match '^(?i:AWS_)' -or $entry.Name -match '^(?i:RX_OIDC_)') {
          Remove-Item -LiteralPath ('Env:' + $entry.Name) -ErrorAction Stop
        }
      }
  script:
    - !reference [.windows_ccrx_host_lease, script]
    - Write-Host "=== Build RX72N projects ==="
    - python tools/ci/check_rx72n_tsip_driver.py
    - pwsh -NoProfile -File tools/ci/tests/test_rx72n_ota_oidc.ps1 -Wrapper tools/aws/rx72n_ota_oidc.ps1
    # The regular MR pipeline checks its own complete CI contract. Those CI
    # structure tests do not apply to this intentionally restricted one-shot.
    - python -m unittest tools.ci.tests.test_test_ota tools.ci.tests.test_rx72n_tsip_trace_init tools.ci.tests.test_transport_mbedtls_provisioning_guard tools.ci.tests.test_verify_ota_aws_state tools.ci.tests.test_manage_ephemeral_iot_thing tools.ci.tests.test_rx72n_fwup_prm_contract tools.ci.tests.test_rx_e2studio_cli
    - pip install cryptography --quiet
    - |
      $tls13ZeroRtt = ($env:RX72N_TLS13_0RTT_ENABLE -eq "true")
      if ($tls13ZeroRtt) {
        & "$env:CI_PROJECT_DIR\tools\build_headless_rx72n_with_client_credentials.ps1" `
          -ProjectRoot "$env:CI_PROJECT_DIR" `
          -ThingName "$env:RX72N_DEVICE_ID" `
          -Endpoint "$env:AWS_IOT_ENDPOINT" `
          -CertInput "$env:AWS_CLIENT_CERT_RX72N_02" `
          -KeyInput "$env:AWS_PRIVATE_KEY_RX72N_02" `
          -E2Studio "$env:E2STUDIO_CLI" `
          -Workspace "$env:E2STUDIO_WORKSPACE" `
          -LogFile "$env:CI_PROJECT_DIR\rx72n_e2studio_build.log" `
          -E2StudioTimeoutSeconds $env:RX72N_E2STUDIO_TIMEOUT_SECONDS `
          -TlsBackend "$env:RX72N_TLS_BACKEND" `
          -RequireTlsVersion "$env:RX72N_REQUIRE_TLS_VERSION" `
          -Tls13ZeroRtt
      } else {
        & "$env:CI_PROJECT_DIR\tools\build_headless_rx72n.ps1" `
          -ProjectRoot "$env:CI_PROJECT_DIR" `
          -E2Studio "$env:E2STUDIO_CLI" `
          -Workspace "$env:E2STUDIO_WORKSPACE" `
          -LogFile "$env:CI_PROJECT_DIR\rx72n_e2studio_build.log" `
          -E2StudioTimeoutSeconds $env:RX72N_E2STUDIO_TIMEOUT_SECONDS `
          -TlsBackend "$env:RX72N_TLS_BACKEND" `
          -RequireTlsVersion "$env:RX72N_REQUIRE_TLS_VERSION"
      }
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot")) { Write-Error "boot_loader .mot missing"; exit 1 }
    - |
      $rx72nAppProject = if ($env:RX72N_TLS_BACKEND -eq "tsip") { "aws_ether_rx72n_envision_kit_tsip" } else { "aws_ether_rx72n_envision_kit" }
      $rx72nAppRoot = "$env:CI_PROJECT_DIR\Projects\$rx72nAppProject\e2studio_ccrx"
      $rx72nAppMot = "$rx72nAppRoot\HardwareDebug\$rx72nAppProject.mot"
      $rx72nAppAbs = "$rx72nAppRoot\HardwareDebug\$rx72nAppProject.abs"
      $rx72nAppX = "$rx72nAppRoot\HardwareDebug\$rx72nAppProject.x"
      foreach ($path in @($rx72nAppMot, $rx72nAppAbs, $rx72nAppX)) {
        if (-not (Test-Path $path)) { Write-Error "app artifact missing: $path"; exit 1 }
      }
    - |
      python "$env:CI_PROJECT_DIR\tools\shift_srec_addresses.py" `
        --input "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot" `
        --output "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit_bank1.mot" `
        --range-start 0xFFE00000 `
        --range-end 0xFFFFFFFF `
        --shift=-0x200000 `
        --drop-out-of-range
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit_bank1.mot")) { Write-Error "bank1 boot_loader .mot missing"; exit 1 }
    - |
      python "$env:CI_PROJECT_DIR\tools\build_fwup_v2_rsu.py" `
        --mot "$rx72nAppMot" `
        --prm "$env:CI_PROJECT_DIR\tools\fwup\rx72n_envision_kit_dual_bank.prm.csv" `
        --key "$env:CI_PROJECT_DIR\$env:RX72N_SIGNING_KEY" `
        --output "$env:CI_PROJECT_DIR\rx72n_app.rsu"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\rx72n_app.rsu")) { Write-Error "rx72n_app.rsu missing"; exit 1 }
    - |
      python "$env:CI_PROJECT_DIR\tools\generate_signer_cert.py" `
        --key "$env:CI_PROJECT_DIR\$env:RX72N_SIGNING_KEY" `
        --out "$env:CI_PROJECT_DIR\rx72n_codesign_cert.pem"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\rx72n_codesign_cert.pem")) { Write-Error "rx72n_codesign_cert.pem missing"; exit 1 }
    - Write-Host "BUILD SUCCESS"
  artifacts:
    when: always
    paths:
      - rx72n_e2studio_build.log
      - rx72n_app.rsu
      - rx72n_codesign_cert.pem
      - Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 7 days

# Cover the normal TSIP role too; its RAM/rings differ from the benchmark.
# This lane compiles and packages files only and never selects a hardware scope.

.normal_boot_package:
  timeout: 3 hours
  extends: .rx_windows_canonical_checkout
  stage: build
  resource_group: $WINDOWS_CCRX_BUILD_RESOURCE_GROUP
  before_script:
    - |
      foreach ($entry in @(Get-ChildItem Env:)) {
        if ($entry.Name -match '^(?i:AWS_)' -or $entry.Name -match '^(?i:RX_OIDC_)') {
          Remove-Item -LiteralPath ('Env:' + $entry.Name) -ErrorAction Stop
        }
      }
  script:
    - !reference [.windows_ccrx_host_lease, script]
    - |
      $ErrorActionPreference = 'Stop'
      python -m pip install --user cryptography
      if ($LASTEXITCODE -ne 0) { throw 'Normal boot cryptography dependency installation failed.' }
      $source = $env:CI_PROJECT_DIR
      $target = $env:NORMAL_BOOT_TARGET
      python -c "import os, sys; from pathlib import Path; from tools.idt.prepare_public_signer import _source_state; source_sha = _source_state(Path(os.environ['CI_PROJECT_DIR'])); sys.exit(0 if source_sha == os.environ['CI_COMMIT_SHA'] else 'Normal source SHA mismatch')"
      if ($LASTEXITCODE -ne 0) { throw 'Normal package requires a clean matching source checkout before generation.' }
      $privateRoot = "C:/ai/codex/tmp/normal-boot-$env:CI_PIPELINE_ID-$env:CI_JOB_ID"
      if (Test-Path -LiteralPath $privateRoot) { throw 'Normal boot output already exists.' }
      New-Item -ItemType Directory -Path $privateRoot | Out-Null
      $workspace = "C:/ai/codex/ws/normal-boot-$env:CI_PIPELINE_ID-$env:CI_JOB_ID"
      $targets = (Get-Content -LiteralPath (Join-Path $source 'tools/idt/targets.json') -Raw | ConvertFrom-Json).targets
      $signingKey = if ($target -eq 'rx671-wifi') { $targets.$target.signing_key } else { [Environment]::GetEnvironmentVariable($env:NORMAL_BOOT_SIGNING_KEY_VARIABLE) }
      if ([string]::IsNullOrWhiteSpace($signingKey)) { throw 'Normal signing key path is not configured.' }
      if (-not [IO.Path]::IsPathRooted($signingKey)) { $signingKey = Join-Path $source $signingKey }
      $backend = if ($target -eq 'rx671-wifi') { 'software' } else { [Environment]::GetEnvironmentVariable($env:NORMAL_BOOT_BACKEND_VARIABLE) }
      $inputs = Join-Path $privateRoot 'normal-inputs'
      New-Item -ItemType Directory -Path $inputs | Out-Null
      $rsu = Join-Path $inputs 'normal_app.rsu'
      $boot0 = Join-Path $inputs 'bootloader.mot'
      $boot1 = Join-Path $inputs 'bootloader_bank1.mot'
      if ($target -eq 'rx671-wifi') {
        & tools/build_headless_rx671_bootloader.ps1 -ProjectRoot "$source" -E2Studio "$env:E2STUDIO_CLI" `
          -Workspace (Join-Path $workspace 'e2ws_iot_ref_rx671_bootloader_2026_04_2') `
          -LogFile (Join-Path $privateRoot 'bootloader-build-private.log') -Python python
        if ($LASTEXITCODE -ne 0) { throw 'Normal RX671 bootloader build failed.' }
        Copy-Item -LiteralPath (Join-Path $source 'Projects/boot_loader_rx671_ek/e2studio_ccrx/HardwareDebug/boot_loader_rx671_ek.mot') -Destination $boot0
        python tools/shift_srec_addresses.py --input "$boot0" --output "$boot1" --range-start 0xFFFC0000 --range-end 0xFFFFFFFF --shift=-0x100000 --drop-out-of-range
        if ($LASTEXITCODE -ne 0) { throw 'Normal RX671 bootloader mirror generation failed.' }
        python tools/build_rx671_fwup_v2_rsu.py --mot (Join-Path $source $env:NORMAL_BOOT_APP_MOT) --key "$signingKey" --output "$rsu"
        if ($LASTEXITCODE -ne 0) { throw 'Normal RX671 signed RSU generation failed.' }
      } else {
        # Preserve downloaded normal images before the public producer rebuilds HardwareDebug.
        Copy-Item -LiteralPath (Join-Path $source $env:NORMAL_BOOT_RSU) -Destination $rsu
        Copy-Item -LiteralPath (Join-Path $source $env:NORMAL_BOOT_BOOT0) -Destination $boot0
        if ($target -eq 'rx65n-bg96') {
          python tools/shift_srec_addresses.py --input "$boot0" --output "$boot1" --range-start 0xFFFC0000 --range-end 0xFFFFFFFF --shift=-0x100000 --drop-out-of-range
          if ($LASTEXITCODE -ne 0) { throw 'Normal RX65N bootloader mirror generation failed.' }
        } else {
          Copy-Item -LiteralPath (Join-Path $source $env:NORMAL_BOOT_BOOT1) -Destination $boot1
        }
      }
      $public = Join-Path $privateRoot 'public-signer'
      python tools/idt/prepare_public_signer.py --source "$source" --target "$target" --output "$public" --workspace "$workspace" --python python --signing-key "$signingKey"
      if ($LASTEXITCODE -ne 0) { throw 'Normal public signer preparation failed.' }
      $bundle = Join-Path $privateRoot 'bundle'
      python tools/prepare_normal_boot.py --source "$source" --target "$target" --output "$bundle" --tls-backend "$backend" `
        --rsu "$rsu" --bootloader "$boot0" --bootloader-bank1 "$boot1" `
        --provisioner-mot (Join-Path $public 'public_signer_provisioner.mot') `
        --provisioner-manifest (Join-Path $public 'public_signer_provisioner_manifest.json') `
        --signer-cert (Join-Path $public 'signer.crt.pem') --signer-public-key (Join-Path $public 'signer.pub.pem')
      if ($LASTEXITCODE -ne 0) { throw 'Normal install bundle validation failed.' }
      $artifact = Join-Path $source $env:NORMAL_BOOT_ARTIFACT_DIR
      if (Test-Path -LiteralPath $artifact) { throw 'Normal boot artifact directory already exists.' }
      New-Item -ItemType Directory -Path $artifact -Force | Out-Null
      $publicFiles = @('normal_app.rsu', 'bootloader.mot', 'bootloader_bank1.mot',
        'public_signer_provisioner.mot', 'public_signer_provisioner_manifest.json',
        'signer.crt.pem', 'signer.pub.pem', 'public_signer_bootloader_config.h',
        'public_signer_target.h', 'normal_install_manifest.json')
      foreach ($name in $publicFiles) { Copy-Item -LiteralPath (Join-Path $bundle $name) -Destination (Join-Path $artifact $name) }
  artifacts:
    paths:
      - $NORMAL_BOOT_ARTIFACT_DIR/
    expire_in: 7 days


package_normal_boot_rx72n:
  extends: .normal_boot_package
  tags: [exec-shell, os-windows, ccrx, $RX72N_BUILD_RUNNER_TAG]
  needs:
    - job: build_rx72n_ether
      artifacts: true
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $IDT_PAIR_MODE == "transport-controller"'
      when: on_success
    - when: never
  variables:
    NORMAL_BOOT_TARGET: rx72n-ethernet
    NORMAL_BOOT_SIGNING_KEY_VARIABLE: RX72N_SIGNING_KEY
    NORMAL_BOOT_BACKEND_VARIABLE: RX72N_TLS_BACKEND
    NORMAL_BOOT_RSU: rx72n_app.rsu
    NORMAL_BOOT_BOOT0: Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/boot_loader_rx72n_envision_kit.mot
    NORMAL_BOOT_BOOT1: Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/boot_loader_rx72n_envision_kit_bank1.mot
    NORMAL_BOOT_ARTIFACT_DIR: artifacts/normal_boot_rx72n


rpi4_windows_worker:
  stage: run
  tags: [exec-shell, os-windows, ccrx, project38-idt-windows-protected]
  resource_group: ishiguro-pc-ccrx-e2studio-build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $IDT_PAIR_MODE == "transport"'
    - when: never
  script:
    # The pinned template takes its lease here. Export its function, then
    # release immediately; each build subprocess acquires it again.
    - !reference [.windows_ccrx_host_lease, script]
    - |
      $ErrorActionPreference = 'Stop'
      $leaseFile = Join-Path $env:TEMP ("idt-pair-lease-$env:CI_PIPELINE_ID-$env:CI_JOB_ID.ps1")
      try {
          $text = 'function Enter-WindowsCcrxHostLease {' + "`n" + ${function:Enter-WindowsCcrxHostLease}.ToString() + "`n}"
          $stream = [IO.File]::Open($leaseFile, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try { $writer = [IO.StreamWriter]::new($stream, [Text.UTF8Encoding]::new($false)); $writer.Write($text); $writer.Flush() }
          finally { $stream.Dispose() }
          $env:IDT_PAIR_LEASE_DEFINITION = $leaseFile
      } finally {
          $script:WindowsCcrxHostLease.Dispose()
          $script:WindowsCcrxHostLease = $null
      }
      try {
          . tools/rx_e2studio_cli.ps1
          Initialize-RxBuildDependencies -ProjectRoot $env:CI_PROJECT_DIR
          . tools/idt/rpi4_windows_python.ps1
          & $script:IdtWorkerPython -I tools/idt/rpi4_windows_worker.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      } finally {
          Remove-Item -LiteralPath $leaseFile -Force -ErrorAction SilentlyContinue
      }

rpi4_transport_controller:
  stage: run
  timeout: 3 hours
  tags: [exec-shell, os-linux, project38-idt-rpi4-protected]
  needs:
    - job: package_normal_boot_rx72n
      artifacts: true
  variables:
    RUN_RX_IDT: "true"
    IDT_TARGET: "rx72n-ethernet"
    IDT_SCOPE: "transport"
    IDT_PUBLIC_SIGNER_PROVISIONER_MOT_FILE: "$CI_PROJECT_DIR/artifacts/normal_boot_rx72n/public_signer_provisioner.mot"
    IDT_PUBLIC_SIGNER_PROVISIONER_MANIFEST_FILE: "$CI_PROJECT_DIR/artifacts/normal_boot_rx72n/public_signer_provisioner_manifest.json"
    IDT_PUBLIC_SIGNER_CERT_FILE: "$CI_PROJECT_DIR/artifacts/normal_boot_rx72n/signer.crt.pem"
    IDT_PUBLIC_SIGNER_PUBLIC_KEY_FILE: "$CI_PROJECT_DIR/artifacts/normal_boot_rx72n/signer.pub.pem"
  id_tokens:
    RX_OIDC_ID_TOKEN:
      aud: sts.amazonaws.com
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $IDT_PAIR_MODE == "transport-controller"'
      when: manual
      allow_failure: false
    - when: never
  script:
    - test "$CI_PROJECT_ID" = 38
    - test "$CI_RUNNER_ID" = 28
    - test "$(id -un)" = gitlab-runner-idt-rx
    - python3 -B tools/idt/rpi4_native_controller.py
