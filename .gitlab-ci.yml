      $rx65nBg96AppRoot = "$env:CI_PROJECT_DIR\Projects\$rx65nBg96AppProject\e2studio_ccrx"
      $bootMot = "$env:CI_PROJECT_DIR\Projects\boot_loader_ck_rx65n\e2studio_ccrx\HardwareDebug\boot_loader_ck_rx65n.mot"
      $appMot = "$rx65nBg96AppRoot\HardwareDebug\$rx65nBg96AppProject.mot"
      $appAbs = "$rx65nBg96AppRoot\HardwareDebug\$rx65nBg96AppProject.abs"
      foreach ($path in @($bootMot, $appMot, $appAbs)) {
        if (-not (Test-Path $path)) { Write-Error "fleet build artifact missing: $path"; exit 1 }
      }

      Copy-Item $bootMot "$artifactDir\boot_loader_ck_rx65n.mot"
      Copy-Item $appMot "$artifactDir\aws_bg96_ck_rx65n_fleet.mot"
      $demoIdPrefix = $env:RX65N_BG96_FLEET_DEMO_ID_PREFIX
      if (-not $demoIdPrefix) { $demoIdPrefix = "rx65n-bg96-fp" }
      Set-Content -Path "$artifactDir\fleet_demo_id.txt" -Value "$demoIdPrefix-$env:CI_PIPELINE_ID" -Encoding ascii

      $signingKey = $env:RX65N_BG96_SIGNING_KEY
      if (-not [System.IO.Path]::IsPathRooted($signingKey)) {
        $signingKey = Join-Path $env:CI_PROJECT_DIR $signingKey
      }
      if (-not (Test-Path $signingKey)) { Write-Error "RX65N BG96 signing key not found: $signingKey"; exit 1 }

      python "$env:CI_PROJECT_DIR\tools\create_bg96_rsu.py" `
