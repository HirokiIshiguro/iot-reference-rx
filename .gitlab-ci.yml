workflow:
  rules:
    - if: '($CI_DEBUG_TRACE =~ /(?i)^(t|true|\+?0*1)$/ || $CI_DEBUG_SERVICES =~ /(?i)^(t|true|\+?0*1)$/)'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/209-win29-log-readonly" && $CI_COMMIT_REF_PROTECTED == "true" && $IDT_LOG_READONLY == "true"'
    - when: never
stages: [test]
variables:
  GIT_STRATEGY: empty
  GIT_SUBMODULE_STRATEGY: none
win29_log_readonly:
  stage: test
  tags: [exec-shell, os-windows, ccrx, project38-idt-windows-protected]
  timeout: 5 minutes
  before_script: []
  after_script: []
  script:
    - |
      $ErrorActionPreference = 'Stop'
      if ($env:CI_PROJECT_ID -ne '38' -or $env:CI_RUNNER_ID -ne '29' -or
          $env:CI_COMMIT_REF_PROTECTED -ne 'true' -or [Environment]::UserName -ne 'svc-idt-rx') { throw 'Unexpected execution context.' }
      foreach ($entry in @(Get-ChildItem Env:)) {
          if ($entry.Name -match '^(?i:AWS_)' -or $entry.Name -match '(?i:TOKEN|SECRET|PRIVATE_KEY|PASSWORD)') {
              Remove-Item -LiteralPath ('Env:' + $entry.Name) -ErrorAction Stop
          }
      }
      $output = 'C:/ai/codex/tmp/idt-win29-public-15835-85499'
      $workspace = 'C:/ai/codex/ws/idt-win29-public-15835-85499'
      foreach ($path in @('C:/ai/codex/tmp', $output, 'C:/ai/codex/ws', $workspace)) {
          if ((Test-Path -LiteralPath $path) -and ((Get-Item -LiteralPath $path -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Unexpected path link.' }
      }
      Write-Host ('OUTPUT_EXISTS=' + [bool](Test-Path -LiteralPath $output -PathType Container))
      Write-Host ('WORKSPACE_EXISTS=' + [bool](Test-Path -LiteralPath $workspace -PathType Container))
      $files = @(
          @{ name = 'PUBLIC'; path = (Join-Path $output 'public-build.log') },
          @{ name = 'APPLICATION'; path = (Join-Path $output 'rx72n-ethernet/build.log') },
          @{ name = 'BOOTLOADER'; path = (Join-Path $output 'rx72n-ethernet/bootloader_build.log') }
      )
      foreach ($item in $files) {
          $path = $item.path; $parent = Split-Path -Parent $path
          if ((Test-Path -LiteralPath $parent) -and ((Get-Item -LiteralPath $parent -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Unexpected log directory link.' }
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { Write-Host ("LOG_$($item.name)=ABSENT"); continue }
          $info = Get-Item -LiteralPath $path -Force
          if (($info.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $info.Length -gt 25000000) { throw 'Unexpected log link or size.' }
          $content = Get-Content -LiteralPath $path -Raw
          $flags = [ordered]@{
              bytes = $info.Length
              codes = @([regex]::Matches($content, '(?i)\b[EFW][0-9]{5,8}\b') | ForEach-Object { $_.Value.ToUpperInvariant() } | Sort-Object -Unique)
              metadata_pass = [bool]($content -match 'PASS: \d+ target/group metadata validations')
              launcher_started = [bool]($content -match 'e2studio-cli headless import/build; output:')
              workspace_rejected = [bool]($content -match 'workspace is outside the dedicated workspace roots')
              unregistered_sources = [bool]($content -match 'unregistered source inputs')
              launcher_missing = [bool]($content -match 'require the e2studio-cli.exe command launcher')
              build_rejected = [bool]($content -match 'headless build was rejected')
              compiler_error = [bool]($content -match 'compiler, assembler or linker error')
              output_missing = [bool]($content -match 'Expected RX build output is (missing|empty or stale)')
              license = [bool]($content -match '(?i)licen[sc]e')
              timeout = [bool]($content -match '(?i)timed?\s*out|timeout')
              permission_denied = [bool]($content -match '(?i)access (to the path .* )?is denied|permission denied|UnauthorizedAccessException')
              path_missing = [bool]($content -match '(?i)cannot find path|could not find (a part of )?the (file|path)|FileNotFoundException|DirectoryNotFoundException')
              powershell_native_error = [bool]($content -match 'NativeCommandError')
              dependency_init = [bool]($content -match 'Pinned nested dependency initialization failed|Cannot read pinned RX dependency paths|Invalid submodule path entry')
              source_provenance = [bool]($content -match 'Cannot read metadata fixture source provenance|Cannot read integration-test dependency provenance|Cannot capture metadata fixture dependencies')
              source_manifest = [bool]($content -match 'IDT dependency source-copy verification failed|IDT dependency Git pin/hash capture failed|Test library provenance differs|Cannot verify the selected production MQTT')
              missing_build_dependency = [bool]($content -match 'Missing IDT build dependency')
              validation_mismatch = [bool]($content -match 'IDT source links select|IDT source URI does not|IDT source link does not|IDT PKCS11 report does not|metadata validation matrix is incomplete')
              python_traceback = [bool]($content -match 'Traceback \(most recent call last\)')
              git_fatal = [bool]($content -match '(?im)^\s*fatal:')
              git_ownership = [bool]($content -match '(?i)dubious ownership|safe.directory')
              git_auth = [bool]($content -match '(?i)authentication failed|could not read username|permission denied \(publickey\)')
              execution_policy = [bool]($content -match '(?i)running scripts is disabled|PSSecurityException')
              command_not_found = [bool]($content -match '(?i)CommandNotFoundException|is not recognized as the name of a cmdlet')
              parse_error = [bool]($content -match '(?i)ParserError|ParseException')
              powershell_terminating_error = [bool]($content -match 'CategoryInfo|FullyQualifiedErrorId')
              script_positions = @([regex]::Matches($content, '(?i)(test_build_rx_idt\.ps1|build_rx72n_idt_transport\.ps1|rx_e2studio_cli\.ps1|idt_source_manifest\.py):(?:line\s*)?([0-9]{1,5})') | ForEach-Object { $_.Groups[1].Value + ':' + $_.Groups[2].Value } | Sort-Object -Unique)
              exception_types = @([regex]::Matches($content, '\b(?:System\.)?(?:[A-Za-z]+\.)*[A-Za-z]+Exception\b') | ForEach-Object { $_.Value } | Sort-Object -Unique)
              fqids = @([regex]::Matches($content, '(?im)FullyQualifiedErrorId\s*:\s*([A-Za-z][A-Za-z0-9_.]*(?:,[A-Za-z][A-Za-z0-9_.]*)*)') | ForEach-Object { $id = $_.Groups[1].Value; if ($id -match '(?:Exception|Microsoft\.PowerShell\.Commands\.)') { $id } else { 'UNRECOGNIZED' } } | Sort-Object -Unique)
              exit_codes = @([regex]::Matches($content, '(?i)\bexit(?:ed with)? (?:code|status)\s*[:=]?\s*(-?[0-9]{1,4})\b') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          }
          Write-Host ("LOG_$($item.name)=" + ($flags | ConvertTo-Json -Compress))
          if ($item.name -eq 'PUBLIC') {
              $plain = [regex]::Replace($content, '\x1b\[[0-9;]*[A-Za-z]', '')
              $allLines = @($plain -split "`r?`n")
              for ($i = 0; $i -lt $allLines.Count; $i++) {
                  if ($allLines[$i] -notmatch 'build_rx72n_idt_transport\.ps1:150') { continue }
                  $selected = @()
                  for ($n = $i + 1; $n -lt [Math]::Min($i + 9, $allLines.Count); $n++) {
                      $line = $allLines[$n].Trim()
                      if (-not $line -or $line -match '^\d+\s*\|' -or $line -match '^[~+|\s]+$') { continue }
                      $line = [regex]::Replace($line, '(?i)https?://\S+|[A-Z]:[\\/][^\s"'']+|\\\\[^\s"'']+', '<PATH>')
                      $line = [regex]::Replace($line, '[\w.+-]+@[\w.-]+', '<EMAIL>')
                      $line = [regex]::Replace($line, '(?i)(token|secret|password|key|credential)\s*[:=]\s*\S+', '$1=<REDACTED>')
                      $line = [regex]::Replace($line, '\b[A-Za-z0-9_+/=-]{24,}\b', '<REDACTED>')
                      $selected += $line
                      if ($selected.Count -ge 3) { break }
                  }
                  foreach ($line in $selected) { Write-Host ('SAFE_ERROR=' + $line) }
                  break
              }
              $allowed = @('error','exception','failed','failure','fatal','python','python.exe','pwsh','process','command','program','execute','execution','run','running','cannot','could','not','the','a','of','is','was','with','in','for','at','line','char','exit','code','status','memory','allocation','resource','available','insufficient','enough','access','denied','permission','file','directory','path','system','argument','invalid','handle','closed','broken','pipe','output','input','encoding','decode','encode','unicode','version','module','import','missing','found','exist','source','dependency','dependencies','provenance','capture','captured','verify','verification','manifest','target','schema','hash','hashes','pin','pins','different','differs','mismatch','unrecorded','changed','initialization','uninitialized','unsupported','unexpected','requires','timed','out','timeout','space','disk','operating','specified','name','data','no','available','parameter','value','empty','start','started','launch','launcher','initializing','control','job','stopped','response','returned','warning','terminating','native','traceback','most','recent','call','last','erroractionpreference','method','operation','stream','stderr','stdout','as','when','external','an','while','being','has','been','used','all','configured','to','from','object','test','test_build_rx_idt.ps1','build_rx72n_idt_transport.ps1','rx_e2studio_cli.ps1','idt_source_manifest.py')
              $lines = @($content -split "`r?`n")
              for ($index = [Math]::Max(0, $lines.Count - 25); $index -lt $lines.Count; $index++) {
                  $safe = @([regex]::Matches($lines[$index], '[A-Za-z][A-Za-z0-9_.-]*') | ForEach-Object { $_.Value.ToLowerInvariant() } | Where-Object { $_ -in $allowed })
                  if ($safe.Count) { Write-Host ('SAFE_LOG_LINE_' + ($index + 1) + '=' + ($safe -join ' ')) }
              }
          }
      }
      $targetNames = @('ccrx.exe','rlink.exe','e2studio-cli.exe','e2studioc.exe','make.exe','sh.exe','java.exe','pwsh.exe','powershell.exe')
      $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
      $counts = @{}; $matched = 0; $unknown = 0
      foreach ($process in @(Get-CimInstance Win32_Process -Property ProcessId,Name,CommandLine)) {
          if ($process.Name -notin $targetNames -or $process.ProcessId -eq $PID) { continue }
          try {
              $owner = Invoke-CimMethod -InputObject $process -MethodName GetOwnerSid -ErrorAction Stop
              if ($owner.ReturnValue -ne 0 -or -not $owner.Sid) { $unknown++; continue }
              if ($owner.Sid -eq $sid) {
                  if (-not $counts.ContainsKey($process.Name)) { $counts[$process.Name] = 0 }
                  $counts[$process.Name]++
                  if (-not $process.CommandLine) { $unknown++ }
                  elseif ($process.CommandLine -match 'idt-win29-public-15835-85499') { $matched++ }
              }
          } catch { $unknown++ }
      }
      Write-Host ('CURRENT_DEDICATED_TOOL_PROCESS_COUNTS=' + ($counts | ConvertTo-Json -Compress))
      Write-Host ('TARGET_PATH_PROCESS_MATCHES=' + $matched)
      Write-Host ('PROCESS_INSPECTION_UNKNOWN=' + $unknown)
      Write-Host 'READ_ONLY_DIAGNOSTIC; NO TARGET PROCESS OR FILE CHANGED'
