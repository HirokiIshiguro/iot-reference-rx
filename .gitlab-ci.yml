# Isolated read-only pilot; not the product pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/rpi4-aws-sdk-verify"'
    - when: never
variables:
  GIT_SUBMODULE_STRATEGY: none
  RX72N_DEVICE_ID: "rx72n-02"
  AWS_DEFAULT_REGION: "ap-northeast-1"
cleanup_rx72n_ether_ota_jobs:
  tags: [exec-shell, os-linux, cap-aws-sdk]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
    - |
      set -euo pipefail
      [ "$CI_RUNNER_ID" = "26" ] || { echo "Unexpected runner ID" >&2; exit 1; }
      [ "$(hostname)" = "ef-saffti-001-rpi-linux-004" ] || { echo "Unexpected hostname" >&2; exit 1; }
      [ "$(uname -m)" = "aarch64" ] || { echo "Unexpected architecture" >&2; exit 1; }
    - |
      set -euo pipefail
      : "${GITLAB_OIDC_TOKEN:?OIDC job token is unavailable}"
      : "${AWS_ROLE_ARN:?OIDC role is unavailable}"
      token_file="$(mktemp)"
      trap 'rm -f -- "$token_file"' EXIT
      printf '%s' "$GITLAB_OIDC_TOKEN" > "$token_file"
      unset GITLAB_OIDC_TOKEN
      unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
      unset AWS_PROFILE AWS_DEFAULT_PROFILE AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_CREDENTIALS_FULL_URI
      unset AWS_ACCESS_KEY_ID_ISHIGURO AWS_SECRET_ACCESS_KEY_ISHIGURO
      export AWS_WEB_IDENTITY_TOKEN_FILE="$token_file"
      export AWS_ROLE_SESSION_NAME="gitlab38-$CI_JOB_ID"
      export AWS_CONFIG_FILE=/dev/null AWS_SHARED_CREDENTIALS_FILE=/dev/null BOTO_CONFIG=/dev/null
      export AWS_EC2_METADATA_DISABLED=true AWS_PAGER=""
      python3 - <<'PY'
      import os
      import re
      import botocore.session
      from botocore.config import Config

      role = re.fullmatch(r"arn:aws:iam::([0-9]{12}):role/(saffti-oss-gitlab-oidc)", os.environ["AWS_ROLE_ARN"])
      if not role:
          raise SystemExit("Unexpected AWS_ROLE_ARN")
      session = botocore.session.get_session()
      try:
          credentials = session.get_credentials()
          if not credentials or credentials.method != "assume-role-with-web-identity":
              raise SystemExit("Unexpected AWS credential provider")
          sts = session.create_client("sts", region_name=os.environ["AWS_DEFAULT_REGION"],
                                      config=Config(retries={"total_max_attempts": 1}, connect_timeout=10, read_timeout=20))
          caller = sts.get_caller_identity()["Arn"]
      except Exception:
          raise SystemExit("AWS OIDC identity check failed") from None
      expected = f"arn:aws:sts::{role[1]}:assumed-role/{role[2]}/{os.environ['AWS_ROLE_SESSION_NAME']}"
      if caller != expected:
          raise SystemExit("Unexpected AWS caller role or session")
      print("AWS SDK web identity and caller role verified")
      PY

      artifact_dir="$CI_PROJECT_DIR/artifacts/cleanup_rx72n_ether_ota_jobs"
      mkdir -p "$artifact_dir"
      python3 tools/cleanup_iot_jobs.py \
        --thing-name "$RX72N_DEVICE_ID" \
        --region "$AWS_DEFAULT_REGION" \
        --job-id-prefix "AFR_OTA-" \
        --check-empty \
        --output-json "$artifact_dir/cleanup_summary.json" \
        2>&1 | tee "$artifact_dir/cleanup_rx72n_ether_ota_jobs.log"
  artifacts:
    when: always
    paths:
      - artifacts/cleanup_rx72n_ether_ota_jobs/
    expire_in: 7 days
