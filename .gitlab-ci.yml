      artifacts: true
  script:
    - echo "=== Verify CK-RX65N BG96 Fleet Provisioning ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/test_rx65n_bg96_fleet"
      mkdir -p "$artifact_dir"
      actual_host="$(hostname)"
      if [ -n "${RX65N_BG96_RUNNER_HOSTNAME:-}" ] && ! printf '%s' "${actual_host}" | grep -Fq "${RX65N_BG96_RUNNER_HOSTNAME}"; then
        echo "This job must run on ${RX65N_BG96_RUNNER_HOSTNAME}*, but it was scheduled on ${actual_host}." >&2
        exit 1
      fi

      uart_port="${RX65N_BG96_UART_PORT:-${COMMAND_PORT:-}}"
      if [ -z "$uart_port" ] && [ -f artifacts/provision_rx65n_bg96_fleet/selected_uart_port.txt ]; then
        uart_port="$(tr -d '\r\n' < artifacts/provision_rx65n_bg96_fleet/selected_uart_port.txt)"
      fi
      if [ -z "$uart_port" ]; then
        echo "RX65N BG96 UART port was not selected." >&2
        exit 1
      fi

      rfp_tool="${RX65N_BG96_RFP_TOOL:-e2l:OBE110020}"
      reset_cmd="${RX65N_BG96_LINUX_RFP_CLI} -device ${RX65N_BG96_RFP_DEVICE} -tool ${rfp_tool} -if ${RX65N_BG96_RFP_INTERFACE} -speed ${RX65N_BG96_RFP_SPEED} -auth id ${RX65N_BG96_RFP_AUTH_ID} -sig -run -noquery"
      python tools/test_fleet_rx72n.py \
        --label "CK-RX65N BG96" \
        --log-port "$uart_port" \
        --log-baud "$UART_BAUD_RATE" \
        --timeout "$RX65N_BG96_FLEET_TEST_TIMEOUT_SECONDS" \
        --app-reset-retries "$RX65N_BG96_APP_RESET_RETRIES" \
        --reset-cmd "$reset_cmd" \
        --summary-json "$artifact_dir/fleet_summary.json" \
        2>&1 | tee "$artifact_dir/test_fleet_bg96.log"
      status="${PIPESTATUS[0]}"
      exit "$status"
  artifacts:
    when: always
    paths:
      - artifacts/test_rx65n_bg96_fleet/
    expire_in: 7 days

cleanup_rx65n_bg96_fleet:
  stage: fleet_cleanup
  allow_failure: true
  tags:
    - exec-shell
    - os-windows
    - ccrx
  dependencies:
    - test_rx65n_bg96_fleet
  extends:
    - .rx65n_bg96_fleet_cleanup_rules
  script:
    - Write-Host "=== Cleanup CK-RX65N BG96 Fleet Provisioning AWS resources ==="
    - |
      $artifactDir = "$env:CI_PROJECT_DIR\artifacts\cleanup_rx65n_bg96_fleet"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
      $summary = "$env:CI_PROJECT_DIR\artifacts\test_rx65n_bg96_fleet\fleet_summary.json"
      if (-not (Test-Path $summary)) {
        Write-Error "Fleet summary not found; cleanup cannot determine generated resources: $summary"
        exit 1
      }

      python tools\cleanup_rx72n_fleet_resources.py `
        --summary-json "$summary" `
        --region "$env:AWS_DEFAULT_REGION" `
        --policy-name "$env:RX65N_BG96_FLEET_POLICY_NAME" `
        --output-json "$artifactDir\cleanup_summary.json" `
        2>&1 | Tee-Object -FilePath "$artifactDir\cleanup_rx65n_bg96_fleet.log"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    paths:
      - artifacts/cleanup_rx65n_bg96_fleet/
    expire_in: 7 days

flash_rx72n_ether_windows:
  stage: flash
  tags:
    - exec-shell
    - os-windows
    - ccrx
  resource_group: rx72n-envision-kit-local
  needs:
    - build_rx72n_ether
  rules:
    - if: '$RUN_RX72N_HW_TESTS == "true" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "windows" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Flash RX72N boot_loader and download app RSU ==="
    - pip install pyserial --quiet
    - if (-not $env:RFP_TOOL) { Write-Error "RFP_TOOL not set"; exit 1 }
    - |
      $artifactDir = "$env:CI_PROJECT_DIR\artifacts\flash_rx72n_ether_windows"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
      $resetCmd = '"{0}" -device RX72x -tool {1} -if fine -speed {2} -auth id {3} -sig -run -noquery' -f `
        $env:RFP_CLI, $env:RFP_TOOL, $env:RFP_SPEED, $env:RFP_AUTH

      & "$env:RFP_CLI" -device RX72x -tool $env:RFP_TOOL -if fine -speed $env:RFP_SPEED `
        -auth id $env:RFP_AUTH -erase-chip -noquery
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      & "$env:RFP_CLI" -device RX72x -tool $env:RFP_TOOL -if fine -speed $env:RFP_SPEED `
        -auth id $env:RFP_AUTH `
        -p "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot" `
        -v -run -noquery
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      python tools/test_uart_download_rx72n.py `
        --rsu "$env:CI_PROJECT_DIR\rx72n_app.rsu" `
        --port $env:UART_PORT `
        --baud $env:UART_BAUD_RATE `
        --timeout 420 `
        --post-tx-wait 120 `
        --diag `
        --wait-for-ready `
        --ready-timeout 90 `
        --reset-cmd $resetCmd `
        2>&1 | Tee-Object -FilePath "$artifactDir\flash_rx72n.log"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    paths:
      - artifacts/flash_rx72n_ether_windows/
    expire_in: 7 days

provision_rx72n_ether_mqtt_windows:
  stage: provision
  tags:
    - exec-shell
    - os-windows
    - ccrx
  resource_group: rx72n-envision-kit-local
  needs:
    - build_rx72n_ether
    - flash_rx72n_ether_windows
  rules:
    - if: '$RUN_RX72N_HW_TESTS == "true" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "windows" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Provision RX72N AWS IoT credentials ==="
    - pip install pyserial --quiet
    - if (-not $env:RX72N_DEVICE_ID) { Write-Error "RX72N_DEVICE_ID not set"; exit 1 }
    - if (-not $env:AWS_IOT_ENDPOINT) { Write-Error "AWS_IOT_ENDPOINT not set"; exit 1 }
    - if (-not $env:AWS_CLIENT_CERT_RX72N_02) { Write-Error "AWS_CLIENT_CERT_RX72N_02 not set"; exit 1 }
    - if (-not $env:AWS_PRIVATE_KEY_RX72N_02) { Write-Error "AWS_PRIVATE_KEY_RX72N_02 not set"; exit 1 }
    - |
      $artifactDir = "$env:CI_PROJECT_DIR\artifacts\provision_rx72n_ether_mqtt_windows"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
      $resetCmd = '"{0}" -device RX72x -tool {1} -if fine -speed {2} -auth id {3} -sig -run -noquery' -f `
        $env:RFP_CLI, $env:RFP_TOOL, $env:RFP_SPEED, $env:RFP_AUTH

      python tools/provision_rx72n.py `
        --port $env:UART_PORT `
        --baud $env:UART_BAUD_RATE `
        --thing-name $env:RX72N_DEVICE_ID `
        --endpoint $env:AWS_IOT_ENDPOINT `
        --cert $env:AWS_CLIENT_CERT_RX72N_02 `
        --key $env:AWS_PRIVATE_KEY_RX72N_02 `
        --codesigner-cert "$env:CI_PROJECT_DIR\rx72n_codesign_cert.pem" `
        --format `
        --reset-cmd $resetCmd `
        --reset-after-open `
        --boot-wait 12 `
        --cli-timeout 25 `
        2>&1 | Tee-Object -FilePath "$artifactDir\provision_rx72n.log"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    paths:
      - artifacts/provision_rx72n_ether_mqtt_windows/
    expire_in: 7 days

test_rx72n_ether_mqtt_windows:
  stage: test
  tags:
    - exec-shell
