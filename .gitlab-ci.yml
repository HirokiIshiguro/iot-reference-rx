stages:
  - nightly_matrix
  - build
  - pre_test_cleanup
  - flash
  - bootloader_download
  - app_run
  - credential_prepare
  - provision
  - app_reset
  - test
  - package
  - ota_build
  - ota_prepare
  - ota_create
  - ota_test
  - ota_cleanup
  - fleet_flash
  - fleet_provision
  - fleet_test
  - fleet_cleanup
  - credential_cleanup

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "core.longpaths"
  GIT_CONFIG_VALUE_0: "true"
  E2STUDIO_CLI: "C:/Renesas/e2_studio_2025_12/eclipse/e2studioc.exe"
  E2STUDIO_CLI_BG96: "C:/Renesas/e2_studio_2025_12/eclipse/e2studio-cli.exe"
  E2STUDIO_WORKSPACE: "C:/Temp/e2ws_iot_ref_rx72n"
  E2STUDIO_WORKSPACE_RX65N_BG96: "C:/Temp/e2ws_iot_ref_rx65n_bg96"
  RX72N_E2STUDIO_TIMEOUT_SECONDS: "600"
  RFP_CLI: "C:/Program Files (x86)/Renesas Electronics/Programming Tools/Renesas Flash Programmer V3.22/rfp-cli.exe"
  RFP_SPEED: "1500K"
  RFP_AUTH: "FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF"
  RFP_TOOL: "e2l"
  UART_PORT: "COM7"
  UART_BAUD_RATE: "921600"
  RX72N_SIGNING_KEY: "sample_keys/secp256r1.privatekey"
  RX65N_BG96_SIGNING_KEY: "sample_keys/secp256r1.privatekey"
  # PIPELINE_PROFILE documents the intended pipeline shape. Job rules are still
  # controlled by board-specific scope variables so manual/API/schedule
  # pipelines can focus a single board/config without duplicating the job graph.
  #   branch  - feature push build-only pipeline.
  #   mr      - representative MR standard pipeline.
  #   focused - manual/API pipeline; set board scopes explicitly.
  #   release - default branch/tag release-confidence pipeline.
  #   nightly_matrix - scheduled parent pipeline that fans out focused rows.
  PIPELINE_PROFILE: "branch"
  NIGHTLY_MATRIX_INCLUDE_STABILIZING: "false"
  RUN_RX65N_BG96_BUILD: "true"
  # RX65N_BG96_TEST_SCOPE:
  #   build - build/package only, no hardware test.
  #   flash - flash the CK-RX65N BG96 boot loader.
  #   download - flash and download the application RSU via the boot loader.
  #   app   - flash, download app, and verify app startup.
  #   provision - flash, download app, and provision BG96 MQTT/APN credentials.
  #   mqtt  - flash, download app, provision credentials, and verify MQTT.
  #   ota   - mqtt + AWS IoT OTA.
  #   fleet - build and verify the Fleet Provisioning image.
  #   full  - ota + Fleet Provisioning path.
  RX65N_BG96_TEST_SCOPE: "build"
  RX65N_BG96_SKIP_HW_TESTS: "false"
  RX65N_BG96_DEVICE_RESOURCE_GROUP: "ck-rx65n-rpi3-hardware"
  # Route CK-RX65N/BG96 hardware jobs to Raspberry Pi #3.
  RX65N_BG96_RUNNER_TAG: "dev-ck-rx65n-bg96"
  RX65N_BG96_LINUX_RFP_CLI: "$CI_PROJECT_DIR/tools/rfp_cli_locked.sh"
  RX65N_BG96_RFP_DEVICE: "RX65x"
  RX65N_BG96_RFP_INTERFACE: "fine"
  RX65N_BG96_RFP_SPEED: "1500K"
  RX65N_BG96_RFP_AUTH_ID: "FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF"
  RX65N_BG96_RFP_TOOL: "e2l:OBE110020"
  # Keep empty by default so the bootloader download job auto-probes UART ports
  # on the selected runner and passes the chosen path to downstream jobs.
  RX65N_BG96_UART_PORT: ""
  RX65N_BG96_RUNNER_HOSTNAME: "ef-saffti-001-rpi-003"
  RX65N_BG96_BOOTLOADER_READY_TIMEOUT_SECONDS: "180"
  RX65N_BG96_APP_STARTUP_TIMEOUT_SECONDS: "420"
  RX65N_BG96_APP_RESET_RETRIES: "2"
  RX65N_BG96_MQTT_TIMEOUT_SECONDS: "900"
  RX65N_BG96_MQTT_PROVISION_CLI_TIMEOUT_SECONDS: "25"
  RX65N_BG96_MQTT_PROVISION_CHAR_DELAY_SECONDS: "0.002"
  RX65N_BG96_MQTT_PROVISION_LINE_DELAY_SECONDS: "0.5"
  RX65N_BG96_REQUIRE_TLS_VERSION: ""
  # RX65N_BG96_TLS_BACKEND: software or tsip.
  RX65N_BG96_TLS_BACKEND: "software"
  RX65N_BG96_UART_BAUD_RATE: "921600"
  # TSIP runtime provisioning payloads are read from masked CI/CD variables by
  # tools/provision_tsip_over_uart.py and sent to the board over UART.
  RX65N_BG96_TSIP_PROVISION_CHUNK_SIZE: "128"
  RX65N_BG96_TSIP_PROVISION_TIMEOUT_SECONDS: "30"
  RX65N_BG96_TSIP_FLEET_ENABLE: "false"
  RX65N_BG96_E2STUDIO_TIMEOUT_SECONDS: "600"
  RX65N_BG96_DYNAMIC_IOT_CREDENTIALS: "true"
  RX65N_BG96_IOT_POLICY_NAME: "ck-rx65n-policy"
  RX65N_BG96_THING_NAME_PREFIX: "rx65n-bg96"
  RX65N_BG96_OTA_CANDIDATE_VERSION: ""
  RX65N_BG96_OTA_SIGNING_KEY: ""
  RX65N_BG96_OTA_S3_BUCKET: "rx65n-ota"
  RX65N_BG96_OTA_SIGNING_PROFILE: "rx65n_ota_profile_testkey"
  RX65N_BG96_OTA_SERVICE_ROLE_ARN: "arn:aws:iam::094025684215:role/rx72n-ota-service-role"
  RX65N_BG96_OTA_OBSERVE_TIMEOUT_SECONDS: "900"
  RX65N_BG96_OTA_APP_RESET_RETRIES: "2"
  RX65N_BG96_OTA_ACTIVATE_RESET_DELAY_SECONDS: "15"
  E2STUDIO_WORKSPACE_RX65N_BG96_OTA: "C:/Temp/e2ws_iot_ref_rx65n_bg96_ota"
  RX65N_BG96_FLEET_DEMO_ID_PREFIX: "rx65n-bg96-fp"
  RX65N_BG96_FLEET_TEST_TIMEOUT_SECONDS: "900"
  RX65N_BG96_FLEET_CLEANUP_RESOURCES: "true"
  RX65N_BG96_FLEET_POLICY_NAME: "ck-rx65n-policy"
  E2STUDIO_WORKSPACE_RX65N_BG96_FLEET: "C:/Temp/e2ws_iot_ref_rx65n_bg96_fleet"
  RX72N_DEVICE_ID: "rx72n-02"
  RUN_RX72N_BUILD: "true"
  # Legacy credential-injected RX72N MQTT candidate build. The current hardware
  # pipeline provisions credentials over UART, so keep this off unless a focused
  # pipeline explicitly needs the old RSU packaging path.
  RUN_RX72N_MQTT_CANDIDATE_BUILD: "false"
  # RX72N_TEST_SCOPE:
  #   build - build/package only, no hardware test.
  #   mqtt  - flash/provision/MQTT only, no OTA.
  #   ota   - flash/provision/MQTT + OTA.
  #   fleet - build and verify the Fleet Provisioning image.
  #   full  - flash/provision/MQTT + OTA + Fleet Provisioning cleanup path.
  RX72N_TEST_SCOPE: "build"
  RUN_RX72N_HW_TESTS: "false"
  RUN_RX72N_OTA_TESTS: "false"
  RUN_RX72N_FLEET_TESTS: "false"
  RX72N_CLEANUP_FLEET_RESOURCES: "true"
  RX72N_FLEET_POLICY_NAME: "rx72n-envision-kit-policy"
  RX72N_SKIP_HW_TESTS: "false"
  RX72N_SKIP_OTA_TESTS: "false"
  RX72N_HW_RUNNER_PLATFORM: "linux"
  RX72N_REQUIRE_TLS_VERSION: ""
  RX72N_DEVICE_RESOURCE_GROUP: "rx72n-device-02"
  RX72N_LINUX_RFP_CLI: "$CI_PROJECT_DIR/tools/rfp_cli_locked.sh"
  # The restore pipeline is pinned to the RX72N set2 runner on RPi#2.
  # RPi#1 and RPi#2 both expose an RX72N E2 Lite as OBE110008, but the runner
  # tag scopes the host, so the pinned serial remains unambiguous.
  RX72N_LINUX_RFP_TOOL: "e2l:OBE110008"
  RX72N_LINUX_UART_PORT: "${UART_PORT_ENVISION_KIT_RX72N_CN6_RPI2}"
  RX72N_LINUX_COMMAND_PORT: ""
  RX72N_LINUX_UART_BAUD_RATE: "921600"
  RX72N_LINUX_COMMAND_BAUD_RATE: "115200"
  RX72N_MQTT_TEST_TIMEOUT: "600"
  RX72N_FLEET_TEST_TIMEOUT: "600"
  # RX72N_TLS_BACKEND: software or tsip.
  RX72N_TLS_BACKEND: "software"
  # TSIP runtime provisioning payloads are read from masked CI/CD variables by
  # tools/provision_tsip_over_uart.py and sent to the board over UART.
  RX72N_TSIP_PROVISION_CHUNK_SIZE: "128"
  RX72N_TSIP_PROVISION_TIMEOUT_SECONDS: "30"
  RX72N_TSIP_FLEET_ENABLE: "false"
  RX72N_OTA_CANDIDATE_VERSION: "0.9.3"
  RX72N_OTA_OBSERVE_TIMEOUT: "900"
  AWS_DEFAULT_REGION: "ap-northeast-1"
  E2STUDIO_WORKSPACE_OTA: "C:/Temp/e2ws_iot_ref_rx72n_ota"
  E2STUDIO_WORKSPACE_FLEET: "C:/Temp/e2ws_iot_ref_rx72n_fleet"
  E2STUDIO_WORKSPACE_MQTT: "C:/Temp/e2ws_iot_ref_rx72n_mqtt"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: always
    - if: $CI_COMMIT_TAG
      variables:
        PIPELINE_PROFILE: "release"
        RX65N_BG96_TEST_SCOPE: "full"
        RX72N_TEST_SCOPE: "full"
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PIPELINE_PROFILE: "mr"
        # MR standard keeps daily feedback short while covering both transports:
        # RX72N/Ether exercises OTA, RX65N/BG96 exercises the cellular MQTT path.
        RX65N_BG96_TEST_SCOPE: "mqtt"
        RX72N_TEST_SCOPE: "ota"
      when: always
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $PIPELINE_PROFILE == "nightly_matrix"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      variables:
        PIPELINE_PROFILE: "focused"
      when: always
    - if: '$CI_PIPELINE_SOURCE == "api"'
      variables:
        PIPELINE_PROFILE: "focused"
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        PIPELINE_PROFILE: "nightly_matrix"
        RUN_RX65N_BG96_BUILD: "false"
        RUN_RX72N_BUILD: "false"
        RX65N_BG96_TEST_SCOPE: "build"
        RX72N_TEST_SCOPE: "build"
      when: always
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # Feature branch push pipelines are build-only. The merge request pipeline
    # owns hardware sequences so independent push pipelines cannot interleave
    # RX65N/BG96 OTA and Fleet images on the same board.
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      variables:
        PIPELINE_PROFILE: "branch"
        RX65N_BG96_TEST_SCOPE: "build"
        RX72N_TEST_SCOPE: "build"
      when: always
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        PIPELINE_PROFILE: "release"
        RX65N_BG96_TEST_SCOPE: "full"
        RX72N_TEST_SCOPE: "full"
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always

.nightly_matrix_trigger:
  stage: nightly_matrix
  rules:
    - if: '($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web") && $PIPELINE_PROFILE == "nightly_matrix"'
      when: on_success
    - when: never
  trigger:
    include:
      - local: .gitlab-ci.yml
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: true

.nightly_matrix_rx72n:
  extends: .nightly_matrix_trigger
  variables:
    PIPELINE_PROFILE: "focused"
    RUN_RX72N_BUILD: "true"
    RX72N_SKIP_HW_TESTS: "false"
    RX65N_BG96_TEST_SCOPE: "build"
    RUN_RX65N_BG96_BUILD: "false"
    RX65N_BG96_SKIP_HW_TESTS: "true"

.nightly_matrix_rx65n_bg96:
  extends: .nightly_matrix_trigger
  variables:
    PIPELINE_PROFILE: "focused"
    RX72N_TEST_SCOPE: "build"
    RUN_RX72N_BUILD: "false"
    RX72N_SKIP_HW_TESTS: "true"
    RUN_RX65N_BG96_BUILD: "true"
    RX65N_BG96_SKIP_HW_TESTS: "false"

.nightly_matrix_stabilizing_trigger:
  stage: nightly_matrix
  rules:
    - if: '($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web") && $PIPELINE_PROFILE == "nightly_matrix" && $NIGHTLY_MATRIX_INCLUDE_STABILIZING == "true"'
      when: on_success
    - when: never
  trigger:
    include:
      - local: .gitlab-ci.yml
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: true

.nightly_matrix_rx72n_stabilizing:
