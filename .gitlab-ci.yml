workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "202-idt-rpi4-permissions-probe"'
    - when: never
stages: [test]
rpi4_idt_permissions_probe:
  stage: test
  tags: [exec-shell, os-linux, ef-saffti-001-rpi-linux-004]
  timeout: 5 minutes
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - |
      set -eu
      printf 'USER='; id -un
      printf 'UID='; id -u
      printf 'ARCH='; uname -m
      if unshare --user --map-root-user --mount --net -- true 2>/dev/null; then echo 'USER_MOUNT_NET_NS=available'; else echo 'USER_MOUNT_NET_NS=unavailable'; fi
      if unshare --user --map-root-user -- true 2>/dev/null; then echo 'USER_NS=available'; else echo 'USER_NS=unavailable'; fi
      if command -v qemu-x86_64-static >/dev/null; then echo 'QEMU=installed'; else echo 'QEMU=not_installed'; fi
      python3 -c 'import urllib3; print("URLLIB3=available")'
