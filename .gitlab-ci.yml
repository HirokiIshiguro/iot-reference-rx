cleanup_rx72n_fleet_resources:
  stage: fleet_cleanup
  allow_failure: true
  tags:
    - exec-shell
    - os-windows
    - hw-ishiguro-pc
  dependencies:
    - test_fleet_rx72n_linux
  rules:
    - if: '($RUN_RX72N_FLEET_TESTS == "true" || $RX72N_TEST_SCOPE == "full") && $RX72N_CLEANUP_FLEET_RESOURCES != "false" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_DEFAULT_REGION && $AWS_IOT_ENDPOINT && $AWS_FLEET_PROVISIONING_TEMPLATE_RX72N_02 && $AWS_FLEET_CLAIM_CERT_RX72N_02 && $AWS_FLEET_CLAIM_PRIVATE_KEY_RX72N_02'
      when: always
    - when: never
  script:
    - Write-Host "=== Cleanup RX72N Fleet Provisioning AWS resources ==="
    - |
      $artifactDir = "$env:CI_PROJECT_DIR\artifacts\cleanup_rx72n_fleet_resources"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
      $summary = "$env:CI_PROJECT_DIR\artifacts\test_fleet_rx72n_linux\fleet_summary.json"
      if (-not (Test-Path $summary)) {
        Write-Error "Fleet summary not found; cleanup cannot determine generated resources: $summary"
        exit 1
      }

      python tools\cleanup_rx72n_fleet_resources.py `
        --summary-json "$summary" `
        --region "$env:AWS_DEFAULT_REGION" `
        --policy-name "$env:RX72N_FLEET_POLICY_NAME" `
        --output-json "$artifactDir\cleanup_summary.json" `
        2>&1 | Tee-Object -FilePath "$artifactDir\cleanup_rx72n_fleet_resources.log"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    paths:
      - artifacts/cleanup_rx72n_fleet_resources/
    expire_in: 7 days

flash_rx72n:
  stage: flash
  tags:
    - exec-shell
    - os-windows
    - hw-ishiguro-pc
  resource_group: rx72n-envision-kit-local
  needs:
    - build_rx72n
  rules:
    - if: '$RUN_RX72N_HW_TESTS == "true" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "windows" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Flash RX72N boot_loader and download app RSU ==="
    - pip install pyserial --quiet
    - if (-not $env:RFP_TOOL) { Write-Error "RFP_TOOL not set"; exit 1 }
    - |
      $artifactDir = "$env:CI_PROJECT_DIR\artifacts\flash_rx72n"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
      $resetCmd = '"{0}" -device RX72x -tool {1} -if fine -speed {2} -auth id {3} -sig -run -noquery' -f `
        $env:RFP_CLI, $env:RFP_TOOL, $env:RFP_SPEED, $env:RFP_AUTH

      & "$env:RFP_CLI" -device RX72x -tool $env:RFP_TOOL -if fine -speed $env:RFP_SPEED `
        -auth id $env:RFP_AUTH -erase-chip -noquery
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      & "$env:RFP_CLI" -device RX72x -tool $env:RFP_TOOL -if fine -speed $env:RFP_SPEED `
        -auth id $env:RFP_AUTH `
        -p "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot" `
        -v -run -noquery
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      python tools/test_uart_download_rx72n.py `
        --rsu "$env:CI_PROJECT_DIR\rx72n_app.rsu" `
        --port $env:UART_PORT `
        --baud $env:UART_BAUD_RATE `
        --timeout 420 `
        --post-tx-wait 120 `
        --diag `
        --wait-for-ready `
        --ready-timeout 90 `
        --reset-cmd $resetCmd `
        2>&1 | Tee-Object -FilePath "$artifactDir\flash_rx72n.log"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    paths:
      - artifacts/flash_rx72n/
    expire_in: 7 days

