workflow:
  rules:
    - if: '($CI_DEBUG_TRACE =~ /(?i)^(t|true|\+?0*1)$/ || $CI_DEBUG_SERVICES =~ /(?i)^(t|true|\+?0*1)$/)'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/209-win29-public-diagnose" && $CI_COMMIT_REF_PROTECTED == "true" && $IDT_PUBLIC_DIAGNOSE == "true"'
    - when: never
stages: [test]
variables:
  GIT_STRATEGY: empty
  GIT_SUBMODULE_STRATEGY: none

win29_public_build_failure_diagnose:
  stage: test
  tags: [exec-shell, os-windows, ccrx, project38-idt-windows-protected]
  timeout: 5 minutes
  before_script: []
  after_script: []
  script:
    - |
      $ErrorActionPreference = 'Stop'
      if ($env:CI_PROJECT_ID -ne '38' -or $env:CI_RUNNER_ID -ne '29' -or
          $env:CI_COMMIT_REF_PROTECTED -ne 'true' -or [Environment]::UserName -ne 'svc-idt-rx') {
          throw 'Unexpected project, runner, protected ref or execution account.'
      }
      foreach ($entry in @(Get-ChildItem Env:)) {
          if ($entry.Name -match '^(?i:AWS_)' -or $entry.Name -match '(?i:TOKEN|SECRET|PRIVATE_KEY|PASSWORD)') {
              Remove-Item -LiteralPath ('Env:' + $entry.Name) -ErrorAction Stop
          }
      }
      $output = 'C:/ai/codex/tmp/idt-win29-public-15810-85341'
      $workspace = 'C:/ai/codex/ws/idt-win29-public-15810-85341'
      Write-Host ('OUTPUT_EXISTS=' + [bool](Test-Path -LiteralPath $output -PathType Container))
      Write-Host ('WORKSPACE_EXISTS=' + [bool](Test-Path -LiteralPath $workspace -PathType Container))
      foreach ($name in @('build.log', 'bootloader_build.log')) {
          $path = Join-Path (Join-Path $output 'rx72n-ethernet') $name
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              Write-Host ('LOG_' + $name + '=ABSENT')
              continue
          }
          if ((Get-Item -LiteralPath $path -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) {
              throw 'Unexpected log link.'
          }
          $info = Get-Item -LiteralPath $path
          if ($info.Length -gt 25000000) { throw 'Diagnostic log exceeds bounded size.' }
          $content = [IO.File]::ReadAllText($path)
          $codes = @([regex]::Matches($content, '(?i)\b[EFW][0-9]{5,8}\b') | ForEach-Object { $_.Value.ToUpperInvariant() } | Sort-Object -Unique)
          $flags = [ordered]@{
              bytes = $info.Length
              codes = $codes
              timeout = [bool]($content -match '(?i)timed?\s*out|timeout')
              no_config = [bool]($content -match '(?i)No Config matched')
              license = [bool]($content -match '(?i)licen[sc]e')
              build_error = [bool]($content -match '(?i)build failed|error(?:s)?\s*[:=]\s*[1-9]')
          }
          Write-Host ('LOG_' + $name + '=' + ($flags | ConvertTo-Json -Compress))
      }
      $targetNames = @('ccrx.exe','rlink.exe','e2studio-cli.exe','e2studioc.exe','make.exe','sh.exe','java.exe')
      $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
      $counts = @{}
      $unknown = 0
      foreach ($process in @(Get-CimInstance Win32_Process -Property ProcessId,Name)) {
          if ($process.Name -notin $targetNames) { continue }
          try {
              $owner = Invoke-CimMethod -InputObject $process -MethodName GetOwnerSid -ErrorAction Stop
              if ($owner.ReturnValue -ne 0 -or -not $owner.Sid) { $unknown++; continue }
              if ($owner.Sid -eq $sid) {
                  if (-not $counts.ContainsKey($process.Name)) { $counts[$process.Name] = 0 }
                  $counts[$process.Name]++
              }
          } catch { $unknown++ }
      }
      Write-Host ('CURRENT_DEDICATED_TOOL_PROCESS_COUNTS=' + ($counts | ConvertTo-Json -Compress))
      Write-Host ('PROCESS_OWNER_UNKNOWN=' + $unknown)
      Write-Host 'READ_ONLY_DIAGNOSTIC; NO PROCESS OR FILE CHANGED'
