workflow:
  rules:
    - if: '$CI_DEBUG_TRACE =~ /(?i)^(t|true|\+?0*1)$/ || $CI_DEBUG_SERVICES =~ /(?i)^(t|true|\+?0*1)$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PROJECT_ID == "38"'
      when: always
    - when: never

stages: [verify]
variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: normal
  GIT_CONFIG_COUNT: "3"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"
  GIT_CONFIG_KEY_1: core.autocrlf
  GIT_CONFIG_VALUE_1: "false"
  GIT_CONFIG_KEY_2: core.eol
  GIT_CONFIG_VALUE_2: lf

rpi4_nested_source_verify:
  stage: verify
  timeout: 30 minutes
  tags: [exec-shell, os-linux, project38-idt-rpi4-protected]
  script:
    - |
      python3 -B - <<'PY'
      import hashlib, json, os, pathlib, pwd, subprocess
      from types import SimpleNamespace
      from tools.idt import initialize_linux_dependencies as nested, rpi4_pair
      from tools.idt.oidc_job import current_job_metadata
      from tools.idt_source_manifest import capture_dependency_provenance
      root = pathlib.Path(os.environ['CI_PROJECT_DIR']).resolve(strict=True)
      account = pwd.getpwuid(os.geteuid())
      if account.pw_name != 'gitlab-runner-idt-rx' or os.environ.get('CI_PROJECT_ID') != '38' or os.environ.get('CI_RUNNER_ID') != '28' or os.environ.get('CI_COMMIT_REF_PROTECTED') != 'true':
          raise SystemExit('Unexpected dedicated runner identity')
      job = current_job_metadata(os.environ['CI_JOB_TOKEN'])
      sha = subprocess.check_output(['/usr/bin/git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
      if job['status'] != 'running' or str(job['id']) != os.environ['CI_JOB_ID'] or job['runner']['id'] != 28 or job['commit']['id'] != sha or sha != os.environ['CI_COMMIT_SHA']:
          raise SystemExit('Unexpected GitLab job identity')
      config = SimpleNamespace(search_path='/usr/bin:/bin', home=account.pw_dir)
      env = nested.git_environment(dict(os.environ), config)
      count = nested.initialize(root, '/usr/bin/git', env)
      os.environ.clear()
      env.pop('CI_JOB_TOKEN', None)
      os.environ.update(env)
      provenance = capture_dependency_provenance(root, 'rx72n-ethernet')
      snapshot = rpi4_pair.snapshot(root)
      digest = hashlib.sha256(json.dumps(snapshot, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
      print('NESTED_ROOTS=' + str(count))
      print('TARGET_FILES=' + str(len(provenance['dependency_files_sha256'])))
      print('SNAPSHOT_FILES=' + str(len(snapshot)))
      print('SNAPSHOT_SHA256=' + digest)
      print('PASS: recursive pins and source snapshot checked; no AWS or hardware used.')
      PY
