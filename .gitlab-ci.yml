# CI of iot-reference-rx.
#
# This file only decides the default scope and starts one child pipeline.
# What runs is decided by tools/ci/rxci.py from the test list in tools/ci/tests.json.
#
# The variables below are the form of Build > Pipelines > New pipeline.
# The values to choose for each purpose, and the jobs that then run, are in docs/ci-pipeline.md.
#
# A selection (BOARD, BACKEND, TLS, FEATURE or TEST) with a PROFILE other than full stops in the
# plan job with the reason, and so does a value that is not in a list.

stages:
  - plan
  - run

variables:
  PROFILE:
    value: "check"
    options:
      - "check"
      - "build"
      - "smoke"
      - "full"
      - "doctor"
    description: "How far the pipeline goes. check: unit tests of the CI tools. build: also build every firmware. smoke: a few tests on the boards. full: the tests on the boards. doctor: show what the runners have."
  BOARD:
    value: "all"
    options:
      - "all"
      - "rx72n"
      - "rx65n"
      - "rx671"
    description: "Board whose tests run (needs PROFILE=full). all: every board."
  BACKEND:
    value: "all"
    options:
      - "all"
      - "sw"
      - "tsip"
    description: "TLS implementation of the tests (needs PROFILE=full). sw: Mbed TLS in software. tsip: with the TSIP hardware."
  TLS:
    value: "all"
    options:
      - "all"
      - "tls12"
      - "tls13"
    description: "TLS version of the tests (needs PROFILE=full)."
  FEATURE:
    value: "all"
    options:
      - "all"
      - "mqtt"
      - "ota"
      - "fleet"
    description: "Kind of test (needs PROFILE=full). mqtt: connect and publish. ota: update the firmware over the air. fleet: Fleet Provisioning."
  REPEAT:
    value: "1"
    options:
      - "1"
      - "2"
      - "3"
      - "5"
      - "10"
    description: "How many times each selected test runs (one job per run)."
  REBUILD:
    value: "false"
    options:
      - "false"
      - "true"
    description: "true: build every firmware again. false: reuse a build with the same inputs."
  TEST:
    value: ""
    description: "Only for a selection the lists cannot express: regular expression of test names, for example ^rx72n:(sw|tsip):tls12:ota$. Leave BOARD, BACKEND, TLS and FEATURE at all when you use it."

workflow:
  rules:
    # A branch with an open merge request runs only the merge request pipeline.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # A pipeline that a person or a schedule started keeps running when new commits arrive.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      auto_cancel:
        on_new_commit: none
      variables:
        PROFILE: full
        REBUILD: "true"
        KEEP: "true"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      auto_cancel:
        on_new_commit: none
      variables:
        KEEP: "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PROFILE: build
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        PROFILE: smoke
    # Every other pipeline (a push to a branch without a merge request) uses the defaults above.
    - when: always

plan:
  stage: plan
  tags: [exec-shell, os-linux, ef-saffti-001-rpi-linux-004]
  variables:
    GIT_DEPTH: "1"
    GIT_SUBMODULE_STRATEGY: none
  script:
    - python3 tools/ci/rxci.py plan --profile "$PROFILE" --board "$BOARD" --backend "$BACKEND" --tls "$TLS" --feature "$FEATURE" --test "$TEST" --repeat "$REPEAT" --keep "${KEEP:-false}" --rebuild "$REBUILD"
  artifacts:
    paths:
      - child-pipeline.yml
      - plan.json
    expire_in: 14 days

# The child pipeline is complete by itself. Variables of this file must not reach it:
# forwarded variables would override the settings of its jobs (for example the checkout).
run:
  stage: run
  needs:
    - job: plan
      artifacts: true
  inherit:
    variables: false
  trigger:
    include:
      - artifact: child-pipeline.yml
        job: plan
    strategy: depend
    forward:
      yaml_variables: false
      pipeline_variables: false
