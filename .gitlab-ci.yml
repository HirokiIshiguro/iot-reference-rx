# Activation candidate for the exact protected temporary ref only; do not run until reviewed.
include:
  - project: oss/infra/hardware-config
    ref: f26789f1b61645b7c5aad9d7e5e9f52c933b18e9
    file: /templates/windows_ccrx_host_lease.yml

workflow:
  rules:
    - if: '($CI_DEBUG_TRACE =~ /(?i)^(t|true|\+?0*1)$/ || $CI_DEBUG_SERVICES =~ /(?i)^(t|true|\+?0*1)$/)'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/209-win29-public-build-log" && $CI_COMMIT_REF_PROTECTED == "true" && $IDT_WIN29_PUBLIC == "true"'
    - when: never

stages: [test, build]

variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: normal
  GIT_CONFIG_COUNT: "3"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"
  GIT_CONFIG_KEY_1: core.autocrlf
  GIT_CONFIG_VALUE_1: "false"
  GIT_CONFIG_KEY_2: core.eol
  GIT_CONFIG_VALUE_2: lf
  PYTHONUTF8: "1"
  IDT_WIN29_PYTHON_SELECTION: dedicated

.win29_public_job:
  tags: [exec-shell, os-windows, ccrx, project38-idt-windows-protected]
  before_script:
    - |
      $ErrorActionPreference = 'Stop'
      if ($env:CI_PROJECT_ID -ne '38' -or $env:CI_RUNNER_ID -ne '29' -or
          $env:CI_COMMIT_REF_PROTECTED -ne 'true' -or
          [Environment]::UserName -ne 'svc-idt-rx') {
          throw 'Unexpected project, runner, protected ref or execution account.'
      }
      # Preserve GitLab's job token for nested dependency checkout; remove AWS
      # and other secrets before invoking test/build tools. Never print values.
      foreach ($entry in @(Get-ChildItem Env:)) {
          if ($entry.Name -ne 'CI_JOB_TOKEN' -and
              ($entry.Name -match '^(?i:AWS_)' -or $entry.Name -match '(?i:TOKEN|SECRET|PRIVATE_KEY|PASSWORD)')) {
              Remove-Item -LiteralPath ('Env:' + $entry.Name) -ErrorAction Stop
          }
      }
      $env:AWS_EC2_METADATA_DISABLED = 'true'
      if ($env:IDT_WIN29_PYTHON_SELECTION -eq 'existing') {
          $idtPython = 'C:/ai/codex/tools/venvs/rx72n-idt-windows/Scripts/python.exe'
      } elseif ($env:IDT_WIN29_PYTHON_SELECTION -eq 'dedicated') {
          $idtPython = 'C:/ProgramData/SAFFTI-IdtRxRunner/work/tools/venv-3.14.10/Scripts/python.exe'
      } else { throw 'Unexpected Python selection.' }
      & $idtPython -I -c 'import boto3, cryptography; print("Python runtime and imports OK")'
      if ($LASTEXITCODE -ne 0) { throw 'Dedicated account cannot use the reviewed Python runtime.' }
  after_script: []

win29_public_stop_and_cleanup_contract:
  extends: .win29_public_job
  stage: test
  timeout: 10 minutes
  script:
    - |
      Remove-Item Env:CI_JOB_TOKEN -ErrorAction SilentlyContinue
      & $idtPython -B -m unittest `
        tools.ci.tests.test_windows_build_job tools.ci.tests.test_idt_rpi4_pair -v
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

win29_public_rx72n_compile:
  extends: .win29_public_job
  stage: build
  needs: [win29_public_stop_and_cleanup_contract]
  resource_group: ishiguro-pc-ccrx-e2studio-build
  timeout: 3 hours
  script:
    - !reference [.windows_ccrx_host_lease, script]
    - |
      $ErrorActionPreference = 'Stop'
      $tools = @{
        'C:/Renesas/e2_studio_2026_04_2/eclipse/e2studio-cli.exe' = '6b021cc60f8736f4124f2ff61586bf883a415d1957b0a584346403cc91de2320'
        'C:/Program Files (x86)/Renesas/RX/3_7_0/bin/ccrx.exe' = '64c3daf4cd80557efa98071378dbe13fb4ba9f78da80560f5616bbb22ff5bc0a'
      }
      foreach ($path in $tools.Keys) {
        if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $tools[$path]) {
          throw 'A reviewed compiler launcher differs.'
        }
      }
      if ($env:CI_PIPELINE_ID -notmatch '^\d+$' -or $env:CI_JOB_ID -notmatch '^\d+$') {
        throw 'Invalid CI job identity.'
      }
      # Finish dependency checkout while GitLab's job token is still available.
      . tools/rx_e2studio_cli.ps1
      Initialize-RxBuildDependencies -ProjectRoot $env:CI_PROJECT_DIR
      # Child tools do not need the GitLab job token after checkout.
      Remove-Item Env:CI_JOB_TOKEN -ErrorAction SilentlyContinue
      $sourceRoot = (Resolve-Path -LiteralPath $env:CI_PROJECT_DIR).Path.TrimEnd('\')
      $buildsRoot = [IO.Path]::GetFullPath($env:CI_BUILDS_DIR).TrimEnd('\')
      if (-not $sourceRoot.StartsWith($buildsRoot + '\', [StringComparison]::OrdinalIgnoreCase)) {
        throw 'Checkout is outside this Runner build root.'
      }
      $workspaceParent = [IO.Path]::GetFullPath('C:/ai/codex/ws').TrimEnd('\')
      $outputParent = [IO.Path]::GetFullPath('C:/ai/codex/tmp').TrimEnd('\')
      $runName = "idt-win29-public-$env:CI_PIPELINE_ID-$env:CI_JOB_ID"
      $workspace = [IO.Path]::GetFullPath((Join-Path $workspaceParent $runName))
      $output = [IO.Path]::GetFullPath((Join-Path $outputParent $runName))
      $generated = @(
        (Join-Path $sourceRoot 'Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug'),
        (Join-Path $sourceRoot 'Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug')
      ) | ForEach-Object { [IO.Path]::GetFullPath($_) }
      foreach ($path in @($workspace, $output) + $generated) {
        if (Test-Path -LiteralPath $path) { throw 'A job-owned output path already exists.' }
      }
      function Assert-PlainAncestors([string]$Path) {
        $entry = Get-Item -LiteralPath $Path -Force
        while ($null -ne $entry) {
          if ($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Reparse point in job-owned path.' }
          $entry = $entry.Parent
        }
      }
      foreach ($path in @($sourceRoot, $workspaceParent, $outputParent)) { Assert-PlainAncestors $path }
      $completed = $false
      try {
        [void](New-Item -ItemType Directory -Path $workspace -ErrorAction Stop)
        [void](New-Item -ItemType Directory -Path $output -ErrorAction Stop)
        foreach ($path in @($workspace, $output)) {
          & $idtPython -B -c 'import sys; from pathlib import Path; from tools.idt.run_idt import restrict_runtime; restrict_runtime(Path(sys.argv[1]))' $path
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restrict job-owned directory.' }
        }
        # Job Object assigns this waiting child before the first build command.
        $helper = Join-Path $output 'public-build.ps1'
        $helperText = @'
      param([string]$Python, [string]$Output, [string]$Workspace)
      $ErrorActionPreference = 'Stop'
      if ([Console]::In.ReadLine() -cne 'go') { throw 'No build containment.' }
      $privateLog = Join-Path $Output 'public-build.log'
      try {
        & tools/test_build_rx_idt.ps1 -Python $Python -CompileTargets @('rx72n-ethernet') -OutputDirectory $Output -WorkspaceRoot $Workspace *> $privateLog
        if ($LASTEXITCODE -ne 0) { throw 'Public build helper returned a nonzero exit.' }
      } catch {
        ($_ | Out-String) | Add-Content -LiteralPath $privateLog
        throw 'Public build helper failed; private log retained.'
      }
      '@
        [IO.File]::WriteAllText($helper, $helperText, [Text.UTF8Encoding]::new($false))
        $driver = @'
      import os, queue, sys, threading
      from tools.idt.windows_build_job import run_managed
      result = queue.Queue(maxsize=1)
      def build():
          try:
              run_managed(['pwsh', '-NoProfile', '-NonInteractive', '-File', sys.argv[1],
                           '-Python', sys.argv[2], '-Output', sys.argv[3], '-Workspace', sys.argv[4]],
                          timeout=3600, env=os.environ.copy())
              result.put('success')
          except BaseException as error:
              kind = type(error).__name__
              result.put(kind if kind in ('CalledProcessError', 'TimeoutExpired', 'UnconfirmedStop', 'OSError', 'RuntimeError') else 'Other')
      thread = threading.Thread(target=build)
      thread.start()
      while thread.is_alive():
          thread.join(15)
          if thread.is_alive():
              print('Public RX72N build is still running', flush=True)
      outcome = result.get()
      if outcome != 'success':
          print('PUBLIC_BUILD_FAILURE_TYPE=' + outcome, flush=True)
          raise SystemExit('public build or process-stop verification failed')
      '@
        $driver | & $idtPython -B - $helper $idtPython $output $workspace
        if ($LASTEXITCODE -ne 0) { throw 'Public build or process-stop verification failed.' }
        $completed = $true
        Write-Host 'RX72N placeholder compile only; no image may be flashed.'
      } finally {
        if ($completed) {
          # Only exact, previously absent paths owned by this job are removed.
          foreach ($path in @($workspace, $output) + $generated) {
            if (Test-Path -LiteralPath $path) {
              $resolved = (Resolve-Path -LiteralPath $path).Path
              if ($resolved -ine $path -or (Get-Item -LiteralPath $resolved -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw 'Refusing unsafe output cleanup.'
              }
              Assert-PlainAncestors $resolved
              Remove-Item -LiteralPath $resolved -Recurse -Force
              if (Test-Path -LiteralPath $resolved) { throw 'Job-owned output remains.' }
            }
          }
          Write-Host 'Job-owned public build output and workspace removed.'
        } else {
          Write-Warning 'Build or process stop uncertain; job-owned paths retained for review.'
        }
      }
