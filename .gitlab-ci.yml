      - Projects/aws_bg96_ck_rx65n/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_bg96_ck_rx65n_tsip/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_bg96_ck_rx65n_tsip/e2studio_ccrx/HardwareDebug/*.abs
