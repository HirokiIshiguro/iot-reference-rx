workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "202-idt-ssh-exact-probe-20261114"'
    - when: never
stages: [test]
probe_ssh_exact:
  stage: test
  tags: [exec-shell, os-windows, hw-ishiguro-pc, ccrx, aws-cli-ishiguro]
  resource_group: ishiguro-pc-ccrx-e2studio-build
  timeout: 15 minutes
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - '& "C:/ai/codex/tools/venvs/rx72n-idt-windows/Scripts/python.exe" -I tools/idt/ssh_exact_probe_windows.py'
    - 'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
