# UNREADY source-only proposal. Root + actual Claude must review the Python
# wrapper and this entire file before the wrapper readiness constant is changed.
# Replace the isolated diagnostic branch's .gitlab-ci.yml with this file only.
# Source baseline: 35589b1ed7887aca544ac1c09e67a85c3ea21660; no include.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/184-ci11933-credential-finalize-only" && $RUN_CI11933_CLOUD_CLEANUP_RECOVERY == "ci11933-owned-cloud-cleanup-reviewed-v1"'
      when: always
    - when: never

stages:
  - cleanup

variables:
  GIT_SUBMODULE_STRATEGY: none
  AWS_DEFAULT_REGION: "ap-northeast-1"
  RX65N_BG96_IOT_POLICY_NAME: "ck-rx65n-policy"
  RX65N_BG96_THING_NAME_PREFIX: "rx65n-bg96"
  AWS_CLI_RUNNER_TAG: "aws-cli-ishiguro"

# Exact public AWS Windows tags/bootstrap copied from the pinned source YAML.
.aws_cli_windows_job:
  tags:
    - exec-shell
    - os-windows
    - $AWS_CLI_RUNNER_TAG
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - $ErrorActionPreference = "Stop"
    - |
      python -c "import awscli" 2>$null
      if ($LASTEXITCODE -eq 0) {
        $ciBin = "$env:CI_PROJECT_DIR\.ci-bin"
        New-Item -ItemType Directory -Force -Path $ciBin | Out-Null
        Set-Content -Path "$ciBin\aws.cmd" -Encoding ASCII -Value @(
          "@echo off",
          "python -m awscli %*"
        )
        $env:PATH = "$ciBin;$env:PATH"
        $env:AWS_CLI_USE_PYTHON_MODULE = "1"
      }
      if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
        Write-Error "AWS CLI is unavailable on the AWS CLI runner."
        exit 1
      }
      aws --version

cleanup_ci11933_owned_credentials:
  stage: cleanup
  extends: .aws_cli_windows_job
  needs: []
  dependencies: []
  retry: 0
  interruptible: false
  resource_group: ci11933-owned-cloud-cleanup
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/184-ci11933-credential-finalize-only" && $RUN_CI11933_CLOUD_CLEANUP_RECOVERY == "ci11933-owned-cloud-cleanup-reviewed-v1"'
      when: on_success
    - when: never
  script:
    - python tools/cleanup_ci11933_in_memory.py
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    paths:
      - sanitized_cleanup_projection.json
    expire_in: 7 days
