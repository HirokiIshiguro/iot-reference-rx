workflow:
  rules:
    - if: '($CI_DEBUG_TRACE =~ /(?i)^(t|true|\+?0*1)$/ || $CI_DEBUG_SERVICES =~ /(?i)^(t|true|\+?0*1)$/)'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/209-win29-encoding-diagnostic" && $CI_COMMIT_REF_PROTECTED == "true" && $IDT_ENCODING_DIAGNOSTIC == "true"'
    - when: never
stages: [test]
variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: none
win29_encoding_diagnostic:
  stage: test
  tags: [exec-shell, os-windows, ccrx, project38-idt-windows-protected]
  timeout: 5 minutes
  before_script: []
  after_script: []
  script:
    - |
      $ErrorActionPreference = 'Stop'
      if ($env:CI_PROJECT_ID -ne '38' -or $env:CI_RUNNER_ID -ne '29' -or
          $env:CI_COMMIT_REF_PROTECTED -ne 'true' -or [Environment]::UserName -ne 'svc-idt-rx') { throw 'Unexpected execution context.' }
      foreach ($entry in @(Get-ChildItem Env:)) {
          if ($entry.Name -match '^(?i:AWS_)' -or $entry.Name -match '(?i:TOKEN|SECRET|PRIVATE_KEY|PASSWORD)') {
              Remove-Item -LiteralPath ('Env:' + $entry.Name) -ErrorAction Stop
          }
      }
      $python = 'C:/ProgramData/SAFFTI-IdtRxRunner/work/tools/venv-3.14.10/Scripts/python.exe'
      $script = @'
      import ctypes, json, locale, os, subprocess, sys
      from ctypes import wintypes
      print('ENCODINGS=' + json.dumps({'python_version':sys.version.split()[0], 'utf8_mode':sys.flags.utf8_mode,
          'preferred':locale.getpreferredencoding(False), 'locale':locale.getencoding(),
          'ansi_cp':ctypes.windll.kernel32.GetACP(), 'oem_cp':ctypes.windll.kernel32.GetOEMCP()}), flush=True)
      size = wintypes.DWORD(256)
      buffer = ctypes.create_unicode_buffer(size.value)
      ok = bool(ctypes.windll.advapi32.GetUserNameW(buffer, ctypes.byref(size)))
      print('GETUSERNAME_MATCH=' + json.dumps({'api_ok':ok, 'expected':ok and buffer.value.casefold() == 'svc-idt-rx',
          'environment':ok and buffer.value.casefold() == os.environ.get('USERNAME','').casefold()}), flush=True)
      commands = {
          'WHOAMI': ['whoami.exe'],
          'WHOAMI_CSV': ['whoami.exe','/user','/fo','csv','/nh'],
          'GIT_HEAD': ['git','--no-optional-locks','rev-parse','HEAD'],
          'GIT_STATUS': ['git','--no-optional-locks','status','--porcelain=v1','--untracked-files=all','--ignore-submodules=none'],
      }
      for name, args in commands.items():
          result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
          def can_decode(data, encoding):
              try: data.decode(encoding, 'strict'); return True
              except (UnicodeError, LookupError): return False
          data = {'returncode':result.returncode, 'stdout_bytes':len(result.stdout), 'stderr_bytes':len(result.stderr)}
          for stream, value in [('stdout',result.stdout),('stderr',result.stderr)]:
              data[stream + '_default'] = can_decode(value, locale.getpreferredencoding(False))
              data[stream + '_utf8'] = can_decode(value, 'utf-8')
              data[stream + '_oem'] = can_decode(value, 'cp' + str(ctypes.windll.kernel32.GetOEMCP()))
          if name == 'GIT_STATUS': data['clean'] = not result.stdout
          print(name + '=' + json.dumps(data), flush=True)
      '@
      $script | & $python -I -
      if ($LASTEXITCODE -ne 0) { throw 'Read-only encoding diagnostic failed.' }
      Write-Host 'READ_ONLY_DIAGNOSTIC_COMPLETE'
