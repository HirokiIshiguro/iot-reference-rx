    expire_in: 7 days

build_rx72n_ether_mqtt_candidate:
  stage: build
  tags:
    - exec-shell
    - os-windows
    - ccrx
  resource_group: rx72n-e2studio-build
  rules:
    - if: '$RUN_RX72N_BUILD == "false"'
      when: never
    - if: '$RUN_RX72N_MQTT_CANDIDATE_BUILD == "true" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Build RX72N MQTT candidate ==="
    - |
      & "$env:CI_PROJECT_DIR\tools\build_headless_rx72n_with_client_credentials.ps1" `
        -ProjectRoot "$env:CI_PROJECT_DIR" `
        -ThingName "$env:RX72N_DEVICE_ID" `
        -Endpoint "$env:AWS_IOT_ENDPOINT" `
        -CertInput "$env:AWS_CLIENT_CERT_RX72N_02" `
        -KeyInput "$env:AWS_PRIVATE_KEY_RX72N_02" `
        -E2Studio "$env:E2STUDIO_CLI" `
        -Workspace "$env:E2STUDIO_WORKSPACE_MQTT" `
        -LogFile "$env:CI_PROJECT_DIR\rx72n_e2studio_build_mqtt_candidate.log" `
        -E2StudioTimeoutSeconds $env:RX72N_E2STUDIO_TIMEOUT_SECONDS `
        -TlsBackend "$env:RX72N_TLS_BACKEND"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot")) { Write-Error "boot_loader .mot missing"; exit 1 }
    - |
      $rx72nAppProject = if ($env:RX72N_TLS_BACKEND -eq "tsip") { "aws_ether_rx72n_envision_kit_tsip" } else { "aws_ether_rx72n_envision_kit" }
      $rx72nAppRoot = "$env:CI_PROJECT_DIR\Projects\$rx72nAppProject\e2studio_ccrx"
      foreach ($path in @(
        "$rx72nAppRoot\HardwareDebug\$rx72nAppProject.mot",
        "$rx72nAppRoot\HardwareDebug\$rx72nAppProject.abs",
        "$rx72nAppRoot\HardwareDebug\$rx72nAppProject.x"
      )) {
        if (-not (Test-Path $path)) { Write-Error "app artifact missing: $path"; exit 1 }
      }
    - Write-Host "BUILD MQTT CANDIDATE SUCCESS"
  artifacts:
    when: always
    paths:
      - rx72n_e2studio_build_mqtt_candidate.log
      - Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 1 day

package_rx72n_ether_mqtt_candidate_rsu:
  stage: package
  tags:
    - exec-shell
    - os-windows
    - ccrx
  needs:
    - job: build_rx72n_ether_mqtt_candidate
      artifacts: true
  rules:
    - if: '$RUN_RX72N_BUILD == "false"'
      when: never
    - if: '$RUN_RX72N_MQTT_CANDIDATE_BUILD == "true" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Package RX72N MQTT candidate RSU ==="
    - pip install cryptography --quiet
    - |
      & "$env:CI_PROJECT_DIR\tools\generate_rx72n_rsu.ps1" `
        -ProjectRoot "$env:CI_PROJECT_DIR" `
        -Output "$env:CI_PROJECT_DIR\artifacts\build_rx72n_ether_mqtt_candidate.rsu" `
        -TlsBackend "$env:RX72N_TLS_BACKEND"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\artifacts\build_rx72n_ether_mqtt_candidate.rsu")) { Write-Error "RSU missing"; exit 1 }
    - Write-Host "PACKAGE MQTT CANDIDATE SUCCESS"
  artifacts:
    paths:
      - artifacts/build_rx72n_ether_mqtt_candidate.rsu
      - Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 1 day

build_rx72n_ether_ota:
  stage: ota_build
  tags:
    - exec-shell
    - os-windows
    - ccrx
  resource_group: rx72n-e2studio-build
  needs:
    - test_rx72n_ether_mqtt
  rules:
    - if: '$RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE =~ /^(ota|full)$/ && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$CI_COMMIT_TAG && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "api" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_OTA_TESTS == "true" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Build RX72N OTA candidate ==="
    - pip install cryptography --quiet
    - |
      $artifactDir = "$env:CI_PROJECT_DIR\artifacts\build_rx72n_ether_ota"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

      if (-not $env:RX72N_OTA_CANDIDATE_VERSION) { Write-Error "RX72N_OTA_CANDIDATE_VERSION not set"; exit 1 }
      $signingKey = $env:RX72N_OTA_SIGNING_KEY
      if (-not $signingKey) {
        $signingKey = "$env:CI_PROJECT_DIR\$env:RX72N_SIGNING_KEY"
        Write-Host "RX72N_OTA_SIGNING_KEY not set; using RX72N_SIGNING_KEY path: $signingKey"
      }
      if (-not (Test-Path $signingKey)) { Write-Error "OTA signing key not found: $signingKey"; exit 1 }

      $versionUnderscore = $env:RX72N_OTA_CANDIDATE_VERSION -replace '\.', '_'
      $candidatePrefix = "$artifactDir\$env:RX72N_DEVICE_ID" + "_" + $versionUnderscore
      $candidateCodeSignCert = "$artifactDir\$env:RX72N_DEVICE_ID" + "_codesign_cert.pem"

      python tools/build_ota_candidate.py `
        --repo-root "$env:CI_PROJECT_DIR" `
        --version "$env:RX72N_OTA_CANDIDATE_VERSION" `
        --output-prefix "$candidatePrefix" `
        --signing-key "$signingKey" `
        --e2studio-cli "$env:E2STUDIO_CLI" `
        --workspace "$env:E2STUDIO_WORKSPACE_OTA" `
        --tls-backend "$env:RX72N_TLS_BACKEND" `
        --code-sign-cert-out "$candidateCodeSignCert" `
        2>&1 | Tee-Object -FilePath "$artifactDir\build_ota_candidate.log"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      $candidateRsu = "$candidatePrefix.rsu"
      if (-not (Test-Path $candidateRsu)) { Write-Error "OTA candidate .rsu missing: $candidateRsu"; exit 1 }
      if (-not (Test-Path $candidateCodeSignCert)) { Write-Error "OTA code-sign cert missing: $candidateCodeSignCert"; exit 1 }
      Write-Host "OTA candidate: $candidateRsu"
  artifacts:
    when: always
    paths:
      - artifacts/build_rx72n_ether_ota/
      - Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 1 day

park_rx72n_ether_ota_cli:
  stage: ota_prepare
  extends: .rx72n_linux_hw_job
  needs:
    - job: build_rx72n_ether
      artifacts: true
    - test_rx72n_ether_mqtt
  rules:
    - if: '$RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE =~ /^(ota|full)$/ && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$CI_COMMIT_TAG && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "api" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_OTA_TESTS == "true" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - when: never
  script:
    - echo "=== Park RX72N in CLI before Windows OTA job creation ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/park_rx72n_ether_ota_cli"
      mkdir -p "$artifact_dir"
      python -m serial.tools.list_ports -v 2>&1 | tee "$artifact_dir/serial_ports.txt"
      reset_cmd="$RX72N_LINUX_RFP_CLI -device RX72x -tool $RX72N_LINUX_RFP_TOOL -if fine -speed $RFP_SPEED -auth id $RFP_AUTH -sig -run -noquery"

      shadow_args=()
      if [ -n "${RX72N_LINUX_COMMAND_PORT:-}" ]; then
        shadow_args+=(--shadow-port "$RX72N_LINUX_COMMAND_PORT" --shadow-baud "$RX72N_LINUX_COMMAND_BAUD_RATE" --shadow-name cn8)
      fi

      provision_args=(
        --port "$RX72N_LINUX_UART_PORT"
        --baud "$RX72N_LINUX_UART_BAUD_RATE"
        --thing-name "$RX72N_DEVICE_ID"
        --endpoint "$AWS_IOT_ENDPOINT"
        --cert "$AWS_CLIENT_CERT_RX72N_02"
        --key "$AWS_PRIVATE_KEY_RX72N_02"
        --codesigner-cert "$CI_PROJECT_DIR/rx72n_codesign_cert.pem"
        --reset-cmd "$reset_cmd"
        --reset-after-open
        --boot-wait 12
        --cli-timeout 25
        --attempts 3
        --no-reset
      )
      if [ "${RX72N_TLS_BACKEND}" = "tsip" ]; then
        provision_args+=(--skip-private-key)
      fi

      python tools/provision_rx72n.py "${provision_args[@]}" "${shadow_args[@]}" \
        2>&1 | tee "$artifact_dir/park_rx72n_ota_cli.log"
      status="${PIPESTATUS[0]}"
      if [ "$status" -ne 0 ]; then
        exit "$status"
      fi
      touch "$artifact_dir/parked.ok"
  artifacts:
    when: always
    paths:
      - artifacts/park_rx72n_ether_ota_cli/
    expire_in: 7 days

create_rx72n_ether_ota:
  stage: ota_create
  tags:
    - exec-shell
    - os-windows
    - ccrx
  needs:
    - job: build_rx72n_ether_ota
      artifacts: true
    - job: park_rx72n_ether_ota_cli
      artifacts: true
  rules:
    - if: '$RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE =~ /^(ota|full)$/ && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$CI_COMMIT_TAG && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "api" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_TEST_SCOPE == "auto" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - if: '$RUN_RX72N_OTA_TESTS == "true" && $RX72N_SKIP_HW_TESTS != "true" && $RX72N_SKIP_OTA_TESTS != "true" && $RX72N_HW_RUNNER_PLATFORM == "linux" && $AWS_IOT_ENDPOINT && $AWS_CLIENT_CERT_RX72N_02 && $AWS_PRIVATE_KEY_RX72N_02 && $AWS_OTA_S3_BUCKET_RX72N_02 && $AWS_OTA_SIGNING_PROFILE_RX72N_02 && $AWS_OTA_SERVICE_ROLE_ARN_RX72N_02'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Create RX72N AWS IoT OTA update ==="
    - |
      $artifactDir = "$env:CI_PROJECT_DIR\artifacts\create_rx72n_ether_ota"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

      foreach ($name in @("RX72N_DEVICE_ID", "RX72N_OTA_CANDIDATE_VERSION", "AWS_OTA_S3_BUCKET_RX72N_02", "AWS_OTA_SIGNING_PROFILE_RX72N_02", "AWS_OTA_SERVICE_ROLE_ARN_RX72N_02", "AWS_DEFAULT_REGION")) {
        if (-not [Environment]::GetEnvironmentVariable($name)) {
          Write-Error "$name not set"
          exit 1
        }
      }
      $otaRoleArn = $env:AWS_OTA_SERVICE_ROLE_ARN_RX72N_02
      if ($otaRoleArn -and -not $otaRoleArn.StartsWith("arn:")) {
        $otaRoleArn = "arn:aws:iam::$otaRoleArn"
      }

      $versionUnderscore = $env:RX72N_OTA_CANDIDATE_VERSION -replace '\.', '_'
      $candidateRsu = "$env:CI_PROJECT_DIR\artifacts\build_rx72n_ether_ota\$env:RX72N_DEVICE_ID" + "_" + $versionUnderscore + ".rsu"
      if (-not (Test-Path $candidateRsu)) { Write-Error "OTA candidate .rsu missing: $candidateRsu"; exit 1 }
      $parkMarker = "$env:CI_PROJECT_DIR\artifacts\park_rx72n_ether_ota_cli\parked.ok"
      if (-not (Test-Path $parkMarker)) { Write-Error "RX72N CLI park marker missing: $parkMarker"; exit 1 }

      python tools/create_ota_update.py `
        --artifact-dir "$artifactDir" `
        --thing-name "$env:RX72N_DEVICE_ID" `
        --input-rsu "$candidateRsu" `
        --file-version "$env:RX72N_OTA_CANDIDATE_VERSION" `
        --bucket "$env:AWS_OTA_S3_BUCKET_RX72N_02" `
        --signing-profile "$env:AWS_OTA_SIGNING_PROFILE_RX72N_02" `
        --role-arn "$otaRoleArn" `
        --region "$env:AWS_DEFAULT_REGION" `
        --ota-id-prefix "${env:RX72N_DEVICE_ID}-ota" `
        2>&1 | Tee-Object -FilePath "$artifactDir\create_ota_console.log"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    paths:
      - artifacts/create_rx72n_ether_ota/
    expire_in: 7 days

test_rx72n_ether_ota:
  stage: ota_test
  extends: .rx72n_linux_hw_job
  needs:
    - job: create_rx72n_ether_ota
      artifacts: true
