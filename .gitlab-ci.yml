build_rx72n_ether:
  stage: build
  tags:
    - exec-shell
    - os-windows
    - ccrx
  resource_group: rx72n-e2studio-build
  rules:
    - if: '$RUN_RX72N_BUILD == "false"'
      when: never
    - when: on_success
  script:
    - Write-Host "=== Build RX72N projects ==="
    - pip install cryptography --quiet
    - |
      & "$env:CI_PROJECT_DIR\tools\build_headless_rx72n.ps1" `
        -ProjectRoot "$env:CI_PROJECT_DIR" `
        -E2Studio "$env:E2STUDIO_CLI" `
        -Workspace "$env:E2STUDIO_WORKSPACE" `
        -LogFile "$env:CI_PROJECT_DIR\rx72n_e2studio_build.log" `
        -E2StudioTimeoutSeconds $env:RX72N_E2STUDIO_TIMEOUT_SECONDS `
        -TlsBackend "$env:RX72N_TLS_BACKEND"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot")) { Write-Error "boot_loader .mot missing"; exit 1 }
    - |
      $rx72nAppProject = if ($env:RX72N_TLS_BACKEND -eq "tsip") { "aws_ether_rx72n_envision_kit_tsip" } else { "aws_ether_rx72n_envision_kit" }
      $rx72nAppRoot = "$env:CI_PROJECT_DIR\Projects\$rx72nAppProject\e2studio_ccrx"
      $rx72nAppMot = "$rx72nAppRoot\HardwareDebug\$rx72nAppProject.mot"
      $rx72nAppAbs = "$rx72nAppRoot\HardwareDebug\$rx72nAppProject.abs"
      $rx72nAppX = "$rx72nAppRoot\HardwareDebug\$rx72nAppProject.x"
      foreach ($path in @($rx72nAppMot, $rx72nAppAbs, $rx72nAppX)) {
        if (-not (Test-Path $path)) { Write-Error "app artifact missing: $path"; exit 1 }
      }
    - |
      python "$env:CI_PROJECT_DIR\tools\shift_srec_addresses.py" `
        --input "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit.mot" `
        --output "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit_bank1.mot" `
        --range-start 0xFFE00000 `
        --range-end 0xFFFFFFFF `
        --shift -0x200000 `
        --drop-out-of-range
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\Projects\boot_loader_rx72n_envision_kit\e2studio_ccrx\HardwareDebug\boot_loader_rx72n_envision_kit_bank1.mot")) { Write-Error "bank1 boot_loader .mot missing"; exit 1 }
    - |
      python "$env:CI_PROJECT_DIR\tools\build_fwup_v2_rsu.py" `
        --mot "$rx72nAppMot" `
        --prm "$rx72nAppRoot\src\smc_gen\r_fwup\tool\RX72N_DualBank_ImageGenerator_PRM.csv" `
        --key "$env:CI_PROJECT_DIR\$env:RX72N_SIGNING_KEY" `
        --output "$env:CI_PROJECT_DIR\rx72n_app.rsu"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\rx72n_app.rsu")) { Write-Error "rx72n_app.rsu missing"; exit 1 }
    - |
      python "$env:CI_PROJECT_DIR\tools\generate_signer_cert.py" `
        --key "$env:CI_PROJECT_DIR\$env:RX72N_SIGNING_KEY" `
        --out "$env:CI_PROJECT_DIR\rx72n_codesign_cert.pem"
    - if (-not (Test-Path "$env:CI_PROJECT_DIR\rx72n_codesign_cert.pem")) { Write-Error "rx72n_codesign_cert.pem missing"; exit 1 }
    - Write-Host "BUILD SUCCESS"
  artifacts:
    when: always
    paths:
      - rx72n_e2studio_build.log
      - rx72n_app.rsu
      - rx72n_codesign_cert.pem
      - Projects/boot_loader_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit/e2studio_ccrx/HardwareDebug/*.x
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_ether_rx72n_envision_kit_tsip/e2studio_ccrx/HardwareDebug/*.x
    expire_in: 7 days

build_rx65n_bg96:
  stage: build
  tags:
    - exec-shell
    - os-windows
    - ccrx
  resource_group: rx65n-bg96-e2studio-build
  rules:
    - if: '$RUN_RX65N_BG96_BUILD == "true"'
      when: on_success
    - when: never
  script:
    - Write-Host "=== Build CK-RX65N BG96 projects ==="
    - python -m pip install --user cryptography
    - |
      & "$env:CI_PROJECT_DIR\tools\build_headless_rx65n_bg96.ps1" `
      -ProjectRoot "$env:CI_PROJECT_DIR" `
      -E2Studio "$env:E2STUDIO_CLI_BG96" `
      -Workspace "$env:E2STUDIO_WORKSPACE_RX65N_BG96" `
      -LogFile "$env:CI_PROJECT_DIR\rx65n_bg96_e2studio_build.log" `
      -E2StudioTimeoutSeconds $env:RX65N_BG96_E2STUDIO_TIMEOUT_SECONDS `
      -TlsBackend "$env:RX65N_BG96_TLS_BACKEND"
    - |
      $artifactDir = "$env:CI_PROJECT_DIR\artifacts\build_rx65n_bg96"
      New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

      $rx65nBg96AppProject = if ($env:RX65N_BG96_TLS_BACKEND -eq "tsip") { "aws_bg96_ck_rx65n_tsip" } else { "aws_bg96_ck_rx65n" }
      $rx65nBg96AppRoot = "$env:CI_PROJECT_DIR\Projects\$rx65nBg96AppProject\e2studio_ccrx"
      $bootMot = "$env:CI_PROJECT_DIR\Projects\boot_loader_ck_rx65n\e2studio_ccrx\HardwareDebug\boot_loader_ck_rx65n.mot"
      $appMot = "$rx65nBg96AppRoot\HardwareDebug\$rx65nBg96AppProject.mot"
      $appAbs = "$rx65nBg96AppRoot\HardwareDebug\$rx65nBg96AppProject.abs"
      foreach ($path in @($bootMot, $appMot, $appAbs)) {
        if (-not (Test-Path $path)) { Write-Error "build artifact missing: $path"; exit 1 }
      }

      Copy-Item $bootMot "$artifactDir\boot_loader_ck_rx65n.mot"
      Copy-Item $appMot "$artifactDir\aws_bg96_ck_rx65n.mot"

      $signingKey = $env:RX65N_BG96_SIGNING_KEY
      if (-not [System.IO.Path]::IsPathRooted($signingKey)) {
        $signingKey = Join-Path $env:CI_PROJECT_DIR $signingKey
      }
      if (-not (Test-Path $signingKey)) { Write-Error "RX65N BG96 signing key not found: $signingKey"; exit 1 }

      python "$env:CI_PROJECT_DIR\tools\create_bg96_rsu.py" `
        --mot "$appMot" `
        --key "$signingKey" `
        --output "$artifactDir\aws_bg96_ck_rx65n.rsu"

      if (-not (Test-Path "$artifactDir\aws_bg96_ck_rx65n.rsu")) { Write-Error "RX65N BG96 RSU missing"; exit 1 }
    - Write-Host "BUILD CK-RX65N BG96 SUCCESS"
  artifacts:
    when: always
    paths:
      - rx65n_bg96_e2studio_build.log
      - artifacts/build_rx65n_bg96/
      - Projects/boot_loader_ck_rx65n/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_bg96_ck_rx65n/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_bg96_ck_rx65n/e2studio_ccrx/HardwareDebug/*.abs
      - Projects/aws_bg96_ck_rx65n_tsip/e2studio_ccrx/HardwareDebug/*.mot
      - Projects/aws_bg96_ck_rx65n_tsip/e2studio_ccrx/HardwareDebug/*.abs
    expire_in: 7 days

build_rx65n_bg96_fleet:
  stage: build
  tags:
