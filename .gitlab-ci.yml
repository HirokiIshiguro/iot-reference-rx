flash_rx65n_bg96_fleet:
  stage: fleet_flash
  extends:
    - .rx65n_bg96_linux_hw_job
    - .rx65n_bg96_fleet_rules
  needs:
    - job: build_rx65n_bg96_fleet
      artifacts: true
    - job: cleanup_rx65n_bg96_ota
      artifacts: false
      optional: true
  script:
    - echo "=== Flash CK-RX65N BG96 bootloader for Fleet Provisioning ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/flash_rx65n_bg96_fleet"
      mkdir -p "$artifact_dir"
      actual_host="$(hostname)"
      if [ -n "${RX65N_BG96_RUNNER_HOSTNAME:-}" ] && ! printf '%s' "${actual_host}" | grep -Fq "${RX65N_BG96_RUNNER_HOSTNAME}"; then
        echo "This job must run on ${RX65N_BG96_RUNNER_HOSTNAME}*, but it was scheduled on ${actual_host}." >&2
        exit 1
      fi

      rfp_tool="${RX65N_BG96_RFP_TOOL:-e2l:OBE110020}"
      python3 tools/bg96_bootloader_integration.py \
        --action flash-bootloader \
        --bootloader-mot "$CI_PROJECT_DIR/artifacts/build_rx65n_bg96_fleet/boot_loader_ck_rx65n.mot" \
        --uart-port "unused" \
        --rfp-cli "${RX65N_BG96_LINUX_RFP_CLI}" \
        --rfp-device "${RX65N_BG96_RFP_DEVICE}" \
        --rfp-tool "${rfp_tool}" \
        --rfp-interface "${RX65N_BG96_RFP_INTERFACE}" \
        --rfp-speed "${RX65N_BG96_RFP_SPEED}" \
        --rfp-auth-id "${RX65N_BG96_RFP_AUTH_ID}" \
        2>&1 | tee "$artifact_dir/flash_fleet_bootloader.log"
      status="${PIPESTATUS[0]}"
      exit "$status"
  artifacts:
    when: always
    paths:
      - artifacts/flash_rx65n_bg96_fleet/
    expire_in: 7 days

provision_rx65n_bg96_fleet:
  stage: fleet_provision
  extends:
    - .rx65n_bg96_linux_hw_job
    - .rx65n_bg96_fleet_rules
  needs:
    - job: build_rx65n_bg96_fleet
      artifacts: true
    - job: flash_rx65n_bg96_fleet
      artifacts: true
  script:
    - echo "=== Download and provision CK-RX65N BG96 Fleet Provisioning image ==="
    - |
      artifact_dir="$CI_PROJECT_DIR/artifacts/provision_rx65n_bg96_fleet"
      mkdir -p "$artifact_dir"
      actual_host="$(hostname)"
      if [ -n "${RX65N_BG96_RUNNER_HOSTNAME:-}" ] && ! printf '%s' "${actual_host}" | grep -Fq "${RX65N_BG96_RUNNER_HOSTNAME}"; then
        echo "This job must run on ${RX65N_BG96_RUNNER_HOSTNAME}*, but it was scheduled on ${actual_host}." >&2
        exit 1
      fi

      uart_port="${RX65N_BG96_UART_PORT:-${COMMAND_PORT:-}}"
      rfp_tool="${RX65N_BG96_RFP_TOOL:-e2l:OBE110020}"
      python3 tools/bg96_bootloader_integration.py \
        --action download-rsu \
        --bootloader-mot "$CI_PROJECT_DIR/artifacts/build_rx65n_bg96_fleet/boot_loader_ck_rx65n.mot" \
        --userprog-rsu "$CI_PROJECT_DIR/artifacts/build_rx65n_bg96_fleet/aws_bg96_ck_rx65n_fleet.rsu" \
        --selected-uart-out "$artifact_dir/selected_uart_port.txt" \
        --uart-port "${uart_port}" \
        --ready-timeout "${RX65N_BG96_BOOTLOADER_READY_TIMEOUT_SECONDS}" \
        --rfp-cli "${RX65N_BG96_LINUX_RFP_CLI}" \
        --rfp-device "${RX65N_BG96_RFP_DEVICE}" \
        --rfp-tool "${rfp_tool}" \
        --rfp-interface "${RX65N_BG96_RFP_INTERFACE}" \
        --rfp-speed "${RX65N_BG96_RFP_SPEED}" \
        --rfp-auth-id "${RX65N_BG96_RFP_AUTH_ID}" \
        2>&1 | tee "$artifact_dir/download_fleet_rsu.log"
      status="${PIPESTATUS[0]}"
      if [ "$status" -ne 0 ]; then
        exit "$status"
      fi

      if [ -f "$artifact_dir/selected_uart_port.txt" ]; then
        uart_port="$(tr -d '\r\n' < "$artifact_dir/selected_uart_port.txt")"
      fi
      if [ -z "$uart_port" ]; then
        echo "RX65N BG96 UART port was not selected." >&2
        exit 1
      fi

      python3 tools/bg96_bootloader_integration.py \
        --action run-app \
        --uart-port "${uart_port}" \
        --app-startup-timeout "${RX65N_BG96_APP_STARTUP_TIMEOUT_SECONDS}" \
        --rfp-cli "${RX65N_BG96_LINUX_RFP_CLI}" \
        --rfp-device "${RX65N_BG96_RFP_DEVICE}" \
        --rfp-tool "${rfp_tool}" \
        --rfp-interface "${RX65N_BG96_RFP_INTERFACE}" \
        --rfp-speed "${RX65N_BG96_RFP_SPEED}" \
        --rfp-auth-id "${RX65N_BG96_RFP_AUTH_ID}" \
        2>&1 | tee "$artifact_dir/run_fleet_app.log"
      status="${PIPESTATUS[0]}"
      if [ "$status" -ne 0 ]; then
        exit "$status"
      fi

      python3 tools/bg96_bootloader_integration.py \
        --action provision-fleet \
        --uart-port "${uart_port}" \
        --provision-cli-timeout "${RX65N_BG96_MQTT_PROVISION_CLI_TIMEOUT_SECONDS}" \
        --provision-char-delay "${RX65N_BG96_MQTT_PROVISION_CHAR_DELAY_SECONDS}" \
        --provision-line-delay "${RX65N_BG96_MQTT_PROVISION_LINE_DELAY_SECONDS}" \
        --rfp-cli "${RX65N_BG96_LINUX_RFP_CLI}" \
        --rfp-device "${RX65N_BG96_RFP_DEVICE}" \
        --rfp-tool "${rfp_tool}" \
        --rfp-interface "${RX65N_BG96_RFP_INTERFACE}" \
        --rfp-speed "${RX65N_BG96_RFP_SPEED}" \
        --rfp-auth-id "${RX65N_BG96_RFP_AUTH_ID}" \
        2>&1 | tee "$artifact_dir/provision_fleet.log"
      status="${PIPESTATUS[0]}"
      exit "$status"
  artifacts:
    when: always
    paths:
      - artifacts/provision_rx65n_bg96_fleet/
    expire_in: 7 days

