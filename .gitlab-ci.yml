# CI of iot-reference-rx.
#
# This file only decides the default scope and starts one child pipeline.
# What runs is decided by tools/ci/rxci.py from the test list in tools/ci/tests.json.
#
#   PROFILE  check | build | smoke | full     scope of the pipeline
#   TEST     regular expression of test names (e.g. ^rx671:sw:tls12:mqtt$)
#   REPEAT   how many times each selected test runs (one job per run)
#   REBUILD  true builds every firmware again instead of reusing a build with the same inputs
#
# Run one test three times:  Run pipeline with TEST=^rx72n:sw:tls12:mqtt$ and REPEAT=3

stages:
  - plan
  - run

variables:
  PROFILE:
    value: ""
    description: "check | build | smoke | full. Empty uses the default of the trigger."
  TEST:
    value: ""
    description: "Regular expression of test names. Empty runs every test of the profile."
  REPEAT:
    value: "1"
    description: "How many times each selected test runs."
  REBUILD:
    value: ""
    description: "true builds every firmware again. Empty reuses a build with the same inputs (a schedule always builds)."

workflow:
  rules:
    # A branch with an open merge request runs only the merge request pipeline.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # A pipeline that a person or a schedule started keeps running when new commits arrive.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      auto_cancel:
        on_new_commit: none
      variables:
        DEFAULT_PROFILE: full
        DEFAULT_REBUILD: "true"
        KEEP: "true"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      auto_cancel:
        on_new_commit: none
      variables:
        DEFAULT_PROFILE: check
        KEEP: "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        DEFAULT_PROFILE: build
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        DEFAULT_PROFILE: smoke
    - variables:
        DEFAULT_PROFILE: check

plan:
  stage: plan
  tags: [exec-shell, os-linux, ef-saffti-001-rpi-linux-004]
  variables:
    GIT_DEPTH: "1"
    GIT_SUBMODULE_STRATEGY: none
  script:
    - python3 tools/ci/rxci.py plan --profile "${PROFILE:-$DEFAULT_PROFILE}" --test "$TEST" --repeat "$REPEAT" --keep "${KEEP:-false}" --rebuild "${REBUILD:-${DEFAULT_REBUILD:-false}}"
  artifacts:
    paths:
      - child-pipeline.yml
      - plan.json
    expire_in: 14 days

# The child pipeline is complete by itself. Variables of this file must not reach it:
# forwarded variables would override the settings of its jobs (for example the checkout).
run:
  stage: run
  needs:
    - job: plan
      artifacts: true
  inherit:
    variables: false
  trigger:
    include:
      - artifact: child-pipeline.yml
        job: plan
    strategy: depend
    forward:
      yaml_variables: false
      pipeline_variables: false
